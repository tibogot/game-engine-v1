<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      RTS game page. The v3 engine (startV3App) wires itself to the editor's DOM
      shell, so rather than COPY that 1900-line markup (which drifts every time
      the editor changes), we fetch v3/editor.html at runtime and inject its
      #app subtree — editor.html stays the single source of truth. The editor
      chrome is then hidden with CSS so only the 3D viewport shows.

      The engine loads assets by paths relative to /v3/, so that's the base.
    -->
    <base href="/v3/" />
    <title>RTS Game (v3)</title>
    <link rel="stylesheet" href="./styles/editor.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
      /* Hide the editor chrome — the game shows only the viewport. */
      #toolbar,
      #right-panel { display: none !important; }
      #viewport { position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100vh !important; }

      /* Engine perf stats (stats-gl: FPS / CPU / GPU + DRAW / KTRI) — the engine
         creates and updates it, and pins it to the viewport's BOTTOM-left, which
         is where the minimap lives. `!important` beats the inline style the
         engine's layoutStatsOverlay() rewrites on every resize. */
      #perf-stats {
        top: 8px !important;
        bottom: auto !important;
        left: 8px !important;
      }

      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; background: #0a0a0a; color: #cfcfcf;
        font-family: system-ui, -apple-system, sans-serif;
        transition: opacity 0.5s ease;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #boot .spinner {
        width: 34px; height: 34px; border: 3px solid #333; border-top-color: #6ab0ff;
        border-radius: 50%; animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #boot .err {
        max-width: 640px; margin-top: 8px; padding: 12px 16px;
        font-size: 13px; line-height: 1.5; color: #ff8c8c;
        background: #1c0f0f; border: 1px solid #532; border-radius: 6px;
        white-space: pre-wrap; display: none;
      }
    </style>
  </head>
  <!-- data-stochastic-ui="custom" suppresses the engine's floating stochastic
       toggle button (v2/core/legacy/stochasticTex.js), same as v3/editor.html. -->
  <body data-stochastic-ui="custom">
    <div id="boot">
      <div class="spinner" id="spinner"></div>
      <div id="msg">Loading…</div>
      <div class="err" id="err"></div>
    </div>

    <script type="module">
      const boot = document.getElementById("boot");
      const msg = document.getElementById("msg");
      const err = document.getElementById("err");
      const spinner = document.getElementById("spinner");

      try {
        // 1) Pull the editor's DOM shell (single source of truth) and inject it.
        msg.textContent = "Loading engine UI…";
        const html = await (await fetch("/v3/editor.html")).text();
        const parsed = new DOMParser().parseFromString(html, "text/html");
        const appEl = parsed.getElementById("app");
        if (!appEl) throw new Error("Could not find #app in v3/editor.html");
        document.body.insertBefore(document.importNode(appEl, true), boot);

        // 2) Boot the game. Relative specifier: ES imports resolve against this
        //    module's URL (not <base>), and Vite code-splits it at build time.
        const { startRtsGame } = await import("./rtsGame.js");
        await startRtsGame({ onStatus: (s) => (msg.textContent = s), fov: 40 });

        boot.classList.add("hidden");
        setTimeout(() => boot.remove(), 600);
      } catch (e) {
        console.error("[RTS-v3] failed to start", e);
        spinner.style.display = "none";
        msg.textContent = "Failed to start the RTS game.";
        err.style.display = "block";
        err.textContent = e?.stack || e?.message || String(e);
      }
    </script>
  </body>
</html>
