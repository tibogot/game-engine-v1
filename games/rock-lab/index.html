<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      ROCK LAB — cliffs and rocks for a stylised off-road map, on a small 512 m
      level (public/levels/rock-lab.v3proj, built by tools/rockLabLevel.mjs).
      The level is ordinary editor data: open it in the editor to tweak.

      Keys 1-5: camera views · C: scale car on/off · drag to orbit, wheel to zoom.
      ?world=/path/to/level.v3proj loads another level.
    -->
    <base href="/v3/" />
    <title>Rock lab</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #game { position: fixed; inset: 0; }
      #boot {
        position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
        background: #0a0a0a; color: #cfcfcf; font: 14px system-ui, sans-serif; transition: opacity 0.4s;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #hud {
        position: fixed; left: 10px; top: 10px; z-index: 50; padding: 8px 10px; border-radius: 6px;
        background: rgba(0, 0, 0, 0.55); color: #ddd; font: 12px system-ui, sans-serif;
        display: flex; flex-direction: column; gap: 4px; max-width: 280px;
      }
      #hud button {
        font: 12px system-ui, sans-serif; text-align: left; padding: 4px 8px; border-radius: 4px; cursor: pointer;
        border: 1px solid #555; background: #222; color: #ddd;
      }
      #hud button.on { border-color: #d98a2b; color: #fff; }
      #hud .note { color: #999; margin-top: 4px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot">Loading…</div>
    <div id="hud"></div>

    <script type="module">
      const boot = document.getElementById("boot");
      try {
        const { startRockLab } = await import("./rockLab.js");
        window.__rockLab = await startRockLab({
          container: document.getElementById("game"),
          hud: document.getElementById("hud"),
          onStatus: (s) => (boot.textContent = s),
        });
        boot.classList.add("hidden");
        setTimeout(() => boot.remove(), 500);
      } catch (e) {
        console.error("[rock-lab] failed to start", e);
        boot.textContent = `Failed to start: ${e?.message ?? e}`;
      }
    </script>
  </body>
</html>
