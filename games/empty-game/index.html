<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Starter game: the smallest page that boots the v3 engine as a GAME, loads
      a level and shows it. Copy this folder to start a new game.

      The page owns its layout: the engine draws into #game (any element you
      size) and needs nothing from the editor's page.

      URL options:
        ?world=/path/to/level.v3proj   the level to load (default: the RTS one)
        ?env=none                      no engine environment: the game adds its
                                       own lights (see game.js)
    -->
    <base href="/v3/" />
    <title>Empty game (v3 starter)</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #game { position: fixed; inset: 0; }
      #boot {
        position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
        background: #0a0a0a; color: #cfcfcf; font: 14px system-ui, sans-serif; transition: opacity 0.4s;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #hud {
        position: fixed; left: 10px; top: 10px; z-index: 50; padding: 6px 10px; border-radius: 6px;
        background: rgba(0, 0, 0, 0.55); color: #ddd; font: 12px system-ui, sans-serif; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot">Loading…</div>
    <div id="hud"></div>

    <script type="module">
      const boot = document.getElementById("boot");
      try {
        const { startGame } = await import("./game.js");
        window.__game = await startGame({
          container: document.getElementById("game"),
          onStatus: (s) => (boot.textContent = s),
        });
        boot.classList.add("hidden");
        setTimeout(() => boot.remove(), 500);
      } catch (e) {
        console.error("[empty-game] failed to start", e);
        boot.textContent = `Failed to start: ${e?.message ?? e}`;
      }
    </script>
  </body>
</html>
