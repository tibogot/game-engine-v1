<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tube Lab — cheap shader</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #c8d0da; color: #1a2230;
                   font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        min-width: 270px; max-width: 360px;
        padding: 12px 14px;
        background: rgba(10, 15, 24, 0.72);
        border: 1px solid rgba(150, 180, 220, 0.18);
        border-radius: 10px;
        backdrop-filter: blur(8px);
        pointer-events: none;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      }
      #hud h1 {
        margin: 0 0 4px; font-size: 12px; letter-spacing: 0.08em;
        text-transform: uppercase; color: #7f93ad; font-weight: 700;
      }
      #hud .title { margin: 0 0 8px; font-size: 18px; font-weight: 650; color: #f2f6fb; }
      #hud .meta { color: #9fb0c6; font-size: 12px; }
      #hud .meta b { color: #f2f6fb; font-weight: 600; font-variant-numeric: tabular-nums; }
      #hud .game { color: #ffab6b; }
      #hud .lab { color: #6fd3ff; }
      #hud .keys {
        margin-top: 10px; padding-top: 8px;
        border-top: 1px solid rgba(150, 180, 220, 0.16);
        color: #7f93ad; font-size: 11px; line-height: 1.55;
      }
      #hud .keys b { color: #cfe0f2; font-weight: 600; }
      #err {
        position: fixed; left: 12px; bottom: 12px; z-index: 20;
        max-width: 560px; padding: 10px 12px; display: none;
        background: rgba(60, 12, 12, 0.92); border: 1px solid #a44;
        border-radius: 8px; color: #ffb0b0; white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <h1>Tube lab</h1>
      <div class="title" id="s-title">Straight tube · 26 m</div>
      <div class="meta">
        Piece <b id="s-shader">—</b><br />
        View <b id="s-cam">orbit</b> · Tris <b id="s-tris">—</b> · Draws <b id="s-draws">—</b><br />
        GPU <b id="s-gpu">—</b> · <b id="s-fps">—</b> fps
      </div>
      <div class="keys">
        <b>1</b> game kit mesh · <b>2</b> lab lathe (same cheap shader)<br />
        <b>I</b> inside the bore · <b>F</b> fill test (wall = the frame)<br />
        <b>R</b> orbit outside · drag / wheel to look around<br />
        Game files are not touched. Tune here, then decide.
      </div>
    </div>
    <div id="err"></div>

    <script type="module">
      /**
       * TUBE LOOK + COST LAB.
       *
       * A/B is now SHAPE, on the shipping cheap shader (createTubeMaterial):
       *   1 game = the kit's swept 26 m tube (capped mouths)
       *   2 lab  = the lathe thick-walled pipe (2 rings along the length)
       * Same lights, camera, and material so GPU ms is geometry, not paint.
       *
       * Bloom is off on purpose. This lab measures the MAIN material. The
       * game's bloom pyramid is a fixed extra; rings still write emissive so
       * the look is honest without paying the post stack.
       */
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import GUI from "three/addons/libs/lil-gui.module.min.js";
      import {
        buildPiece,
        roadParams as kitRoadParams,
        pieceParams as kitPieceParams,
        guardrailParams as kitGuardrailParams,
      } from "./modularRoadKit.js";
      import { createTubeMaterial, syncTubeUniforms } from "./modularRoadMaterial.js";

      const $ = (id) => document.getElementById(id);
      const showErr = (e) => {
        const el = $("err");
        el.style.display = "block";
        el.textContent = e?.stack || String(e);
        console.error(e);
      };

      /** Stock game tube. One shape, on purpose. */
      const TUBE = {
        base: "tube",
        straightLength: 26,
        tubeRadius: 8,
        tubeWall: 0.6,
      };

      const look = {
        tubeInner: 0x24303c,
        tubeOuter: 0xd9662a,
        // neonColor: 0x35e0ff, // cyan glow + bloom
        neonColor: 0xffffff,
        neonIntensity: 3.0,
        neonSpacing: 8.0,
        neonWidth: 0.35,
        innerRough: 0.82,
        outerRough: 0.55,
        metalness: 0.0,
      };

      const ctl = {
        shader: "lab",
        doubleSide: false,
        shadows: true,
        showGround: true,
        sunIntensity: 3.2,
        hemiIntensity: 1.15,
        fillIntensity: 1.35,
        rimIntensity: 0.7,
        boreIntensity: 28,
        exposure: 1.05,
      };

      const sceneCtl = { shadowBias: -0.0004, shadowNormalBias: 0.04 };

      let renderer, scene, camera, controls, sun, hemi, fill, rim, boreLight, ground, grid;
      let gui, hasTimestamps = false;
      let pieceRoot, gameMesh = null, labMesh = null;
      let tubeMat;
      let gameMat, labMat;
      let viewName = "orbit";
      /** World Y of the tube axis after sitting the shell on the floor. */
      let axisY = TUBE.tubeRadius;
      const perf = { frames: 0, gpuSum: 0, gpuN: 0, since: 0, gpu: 0, fps: 0 };

      async function createTimingDevice() {
        if (!navigator.gpu) return null;
        try {
          const adapter = await navigator.gpu.requestAdapter();
          if (!adapter) return null;
          return await adapter.requestDevice({ requiredFeatures: [...adapter.features] });
        } catch (e) {
          console.warn("[tube-lab] timestamp device unavailable; GPU ms will read —", e);
          return null;
        }
      }

      /* ------------------------------------------------------------------ */
      /* Shipping tube shader — same function the game uses.                */
      /* ------------------------------------------------------------------ */

      function applyLook() {
        syncTubeUniforms(tubeMat, look);
      }

      function applyShader() {
        const isLab = ctl.shader === "lab";
        if (labMesh) labMesh.visible = isLab;
        if (gameMesh) gameMesh.visible = !isLab;
        const el = $("s-shader");
        if (isLab) {
          el.textContent = "lab · lathe + cheap";
          el.className = "lab";
        } else {
          el.textContent = "game · kit mesh + cheap";
          el.className = "game";
        }
        const mesh = isLab ? labMesh : gameMesh;
        if (mesh) {
          const g = mesh.geometry;
          const tris = (g.index ? g.index.count : g.attributes.position.count) / 3;
          $("s-tris").textContent = Math.round(tris).toLocaleString();
        }
      }

      function applySide() {
        const side = ctl.doubleSide ? THREE.DoubleSide : THREE.FrontSide;
        if (tubeMat) {
          tubeMat.side = side;
          tubeMat.needsUpdate = true;
        }
      }

      function applyShadows() {
        renderer.shadowMap.enabled = ctl.shadows;
        sun.castShadow = ctl.shadows;
        for (const m of [gameMesh, labMesh]) {
          if (!m) continue;
          m.castShadow = ctl.shadows;
          m.receiveShadow = ctl.shadows;
        }
      }

      /* ------------------------------------------------------------------ */
      /* Two meshes: kit (game) and thick pipe (lab). Toggle shows one.      */
      /* ------------------------------------------------------------------ */

      /** The real in-game tube from modularRoadKit — hollow lips and all. */
      function buildGameTubeGeometry() {
        const pp = {
          ...kitPieceParams,
          straightLength: TUBE.straightLength,
          tubeRadius: TUBE.tubeRadius,
          tubeWall: TUBE.tubeWall,
        };
        const built = buildPiece(
          TUBE.base,
          new THREE.Matrix4(),
          pp,
          kitRoadParams,
          { ...kitGuardrailParams, enabled: false },
          false,
        );
        built.railGeometry?.dispose();
        built.shellGeometry?.dispose();
        built.decorGeometry?.dispose();
        built.glassGeometry?.dispose();
        const geo = built.geometry;
        const box = new THREE.Box3().setFromBufferAttribute(geo.getAttribute("position"));
        const center = box.getCenter(new THREE.Vector3());
        geo.applyMatrix4(new THREE.Matrix4().makeTranslation(
          -center.x, -box.min.y, -center.z,
        ));
        return geo;
      }

      /**
       * Lathe of a rectangular wall profile. Caps are emitted TWICE (outward
       * and inward) so FrontSide shows the lip from outside AND from the bore
       * without painting every wall twice.
       */
      function buildThickTubeGeometry() {
        const Ri = TUBE.tubeRadius;
        const Ro = Ri + TUBE.tubeWall;
        const L = TUBE.straightLength;
        const segs = 48;
        const z0 = -L / 2;
        const z1 = L / 2;
        axisY = Ro;

        const edges = [
          { rA: Ri, zA: z0, rB: Ro, zB: z0, zone: 4, alongA: 0, alongB: 0, kind: "cap", nz: -1 },
          { rA: Ro, zA: z0, rB: Ro, zB: z1, zone: 4, alongA: 0, alongB: L, kind: "outer" },
          { rA: Ro, zA: z1, rB: Ri, zB: z1, zone: 4, alongA: L, alongB: L, kind: "cap", nz: 1 },
          { rA: Ri, zA: z1, rB: Ri, zB: z0, zone: 3, alongA: L, alongB: 0, kind: "inner" },
        ];

        const pos = [];
        const nrm = [];
        const uvs = [];
        const zones = [];
        const lateral = [];
        const index = [];
        let v = 0;
        const dθ = (Math.PI * 2) / segs;

        const pushVert = (r, theta, z, along, zone, nx, ny, nz) => {
          pos.push(r * Math.cos(theta), axisY + r * Math.sin(theta), z);
          nrm.push(nx, ny, nz);
          uvs.push(along, theta * r);
          zones.push(zone);
          lateral.push(0);
          return v++;
        };

        /**
         * `flip` reverses winding so FrontSide faces the intended side.
         * Inner/outer were wound facing the wrong radial direction; caps need
         * both an outward face and an inward cover (the ring you see from
         * inside the bore).
         */
        const emit = (e, flip, nxOf, nyOf, nzOf) => {
          for (let i = 0; i < segs; i++) {
            const t0 = i * dθ;
            const t1 = (i + 1) * dθ;
            const n0 = [nxOf(t0), nyOf(t0), nzOf(t0)];
            const n1 = [nxOf(t1), nyOf(t1), nzOf(t1)];
            const a = pushVert(e.rA, t0, e.zA, e.alongA, e.zone, ...n0);
            const b = pushVert(e.rB, t0, e.zB, e.alongB, e.zone, ...n0);
            const c = pushVert(e.rB, t1, e.zB, e.alongB, e.zone, ...n1);
            const d = pushVert(e.rA, t1, e.zA, e.alongA, e.zone, ...n1);
            if (flip) index.push(a, c, b, a, d, c);
            else index.push(a, b, c, a, c, d);
          }
        };

        for (const e of edges) {
          if (e.kind === "outer") {
            emit(e, true, (t) => Math.cos(t), (t) => Math.sin(t), () => 0);
          } else if (e.kind === "inner") {
            emit(e, true, (t) => -Math.cos(t), (t) => -Math.sin(t), () => 0);
          } else {
            emit(e, true, () => 0, () => 0, () => e.nz);
            emit(e, false, () => 0, () => 0, () => -e.nz);
          }
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
        geo.setAttribute("normal", new THREE.Float32BufferAttribute(nrm, 3));
        geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
        geo.setAttribute("aZone", new THREE.Float32BufferAttribute(zones, 1));
        geo.setAttribute("aLateral", new THREE.Float32BufferAttribute(lateral, 1));
        geo.setAttribute("aPlain", new THREE.Float32BufferAttribute(new Float32Array(v).fill(1), 1));
        geo.setAttribute("aCurve", new THREE.Float32BufferAttribute(new Float32Array(v).fill(0), 1));
        geo.setIndex(index);
        geo.computeBoundingSphere();
        return geo;
      }

      function clearPiece() {
        for (const m of [gameMesh, labMesh]) {
          if (!m) continue;
          pieceRoot.remove(m);
          m.geometry.dispose();
        }
        gameMesh = labMesh = null;
      }

      function rebuildPiece() {
        clearPiece();
        axisY = TUBE.tubeRadius + TUBE.tubeWall;

        gameMesh = new THREE.Mesh(buildGameTubeGeometry(), gameMat);
        labMesh = new THREE.Mesh(buildThickTubeGeometry(), labMat);
        pieceRoot.add(gameMesh);
        pieceRoot.add(labMesh);

        applyShadows();
        applyShader();
        sun.target.position.set(0, axisY, 0);
        sun.target.updateMatrixWorld();
        if (boreLight) boreLight.position.set(0, axisY, 0);
      }

      /* ------------------------------------------------------------------ */
      /* Cameras                                                             */
      /* ------------------------------------------------------------------ */

      function setView(name) {
        viewName = name;
        $("s-cam").textContent = name;
      }

      function resetCamera() {
        camera.position.set(22, axisY + 8, 26);
        controls.target.set(0, axisY, 0);
        controls.update();
        setView("orbit");
      }

      /** Chase-ish: on the axis, looking down the bore. The hitch pose. */
      function insideCamera() {
        camera.position.set(0, axisY, 10);
        controls.target.set(0, axisY, -8);
        controls.update();
        setView("inside");
      }

      /**
       * Wall fills the frame so GPU ms is the TUBE shader, not sky.
       * Same reason road-piece-lab has F: an orbit view hides the cost.
       */
      function fillCamera() {
        camera.position.set(2.2, axisY, 0);
        controls.target.set(7.4, axisY, 0.001);
        controls.update();
        setView("fill");
      }

      function exportLook() {
        const payload = {
          format: "modular-tube-look",
          version: 1,
          savedAt: new Date().toISOString(),
          note: "Lab only. Not applied to the game.",
          look: { ...look },
          ctl: {
            shader: ctl.shader,
            doubleSide: ctl.doubleSide,
          },
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "tube-look.json";
        a.click();
        URL.revokeObjectURL(a.href);
      }

      function importLook(file) {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            if (data.look) Object.assign(look, data.look);
            applyLook();
            gui?.controllersRecursive?.().forEach((c) => c.updateDisplay?.());
          } catch (e) {
            showErr(e);
          }
        };
        reader.readAsText(file);
      }

      const lookFileInput = Object.assign(document.createElement("input"), {
        type: "file",
        accept: "application/json",
      });
      lookFileInput.addEventListener("change", () => {
        const f = lookFileInput.files?.[0];
        lookFileInput.value = "";
        if (f) importLook(f);
      });

      function buildGui() {
        gui = new GUI({ title: "Tube lab" });

        const fAb = gui.addFolder("A/B — mesh (same cheap shader)");
        fAb.add(ctl, "shader", {
          "game (kit sweep)": "game",
          "lab (lathe)": "lab",
        })
          .name("Version")
          .onChange(applyShader);
        fAb.open();

        const fLook = gui.addFolder("Look (both versions)");
        fLook.addColor(look, "tubeInner").name("Inner").onChange(applyLook);
        fLook.addColor(look, "tubeOuter").name("Outer").onChange(applyLook);
        fLook.addColor(look, "neonColor").name("Neon").onChange(applyLook);
        fLook.add(look, "neonIntensity", 0, 8, 0.05).name("Neon intensity").onChange(applyLook);
        fLook.add(look, "neonSpacing", 2, 20, 0.1).name("Ring spacing m").onChange(applyLook);
        fLook.add(look, "neonWidth", 0.05, 1.2, 0.01).name("Ring width m").onChange(applyLook);
        fLook.open();

        const fLab = gui.addFolder("Shader");
        fLab.add(look, "innerRough", 0.05, 1, 0.01).name("Inner roughness").onChange(applyLook);
        fLab.add(look, "outerRough", 0.05, 1, 0.01).name("Outer roughness").onChange(applyLook);
        fLab.add(look, "metalness", 0, 1, 0.01).name("Metalness").onChange(applyLook);
        fLab.add(ctl, "doubleSide").name("Double-sided").onChange(applySide);
        fLab.open();

        const fSh = gui.addFolder("Shadows");
        fSh.add(ctl, "shadows").name("Shadows on").onChange(applyShadows);
        fSh.add(sceneCtl, "shadowBias", -0.005, 0.005, 0.0001).name("Bias").onChange((v) => {
          sun.shadow.bias = v;
        });
        fSh.add(sceneCtl, "shadowNormalBias", 0, 0.2, 0.005).name("Normal bias").onChange((v) => {
          sun.shadow.normalBias = v;
        });

        const fSc = gui.addFolder("Scene");
        fSc.add(ctl, "showGround").name("Ground").onChange((v) => {
          ground.visible = v;
          grid.visible = v;
        });
        fSc.add(ctl, "sunIntensity", 0, 6, 0.05).name("Sun").onChange((v) => {
          sun.intensity = v;
        });
        fSc.add(ctl, "hemiIntensity", 0, 3, 0.05).name("Sky / bounce").onChange((v) => {
          hemi.intensity = v;
        });
        fSc.add(ctl, "fillIntensity", 0, 3, 0.05).name("Fill").onChange((v) => {
          fill.intensity = v;
        });
        fSc.add(ctl, "rimIntensity", 0, 3, 0.05).name("Rim").onChange((v) => {
          rim.intensity = v;
        });
        fSc.add(ctl, "boreIntensity", 0, 80, 1).name("Inside fill").onChange((v) => {
          boreLight.intensity = v;
        });
        fSc.add(ctl, "exposure", 0.4, 2, 0.05).name("Exposure").onChange((v) => {
          renderer.toneMappingExposure = v;
        });

        const fCam = gui.addFolder("Camera");
        fCam.add({ resetCamera }, "resetCamera").name("Orbit outside (R)");
        fCam.add({ insideCamera }, "insideCamera").name("Inside bore (I)");
        fCam.add({ fillCamera }, "fillCamera").name("Fill test (F)");
        fCam.open();

        const fIo = gui.addFolder("Look file (lab only)");
        fIo.add({ exportLook }, "exportLook").name("Export tube-look.json");
        fIo.add({ load: () => lookFileInput.click() }, "load").name("Import .json");
      }

      /**
       * Tiny procedural sky/ground equirect with a sun blob, same idea as
       * road-piece-lab. Gives Standard materials something to reflect so
       * roughness actually reads, instead of a black metal cave.
       */
      function buildStudioEnv() {
        const W = 128;
        const H = 64;
        const data = new Uint16Array(W * H * 4);
        const sunDir = new THREE.Vector3(28, 48, 20).normalize();
        const d = new THREE.Vector3();
        const half = THREE.DataUtils.toHalfFloat;
        for (let y = 0; y < H; y++) {
          const phi = ((y + 0.5) / H) * Math.PI;
          for (let x = 0; x < W; x++) {
            const theta = ((x + 0.5) / W) * Math.PI * 2;
            const sp = Math.sin(phi);
            d.set(sp * Math.cos(theta), Math.cos(phi), sp * Math.sin(theta));
            let r, g, b;
            if (d.y >= 0) {
              const t = Math.pow(d.y, 0.55);
              r = 0.56 * (1 - t) + 0.34 * t;
              g = 0.61 * (1 - t) + 0.43 * t;
              b = 0.69 * (1 - t) + 0.57 * t;
            } else {
              const t = Math.min(1, -d.y * 2.2);
              r = 0.56 * (1 - t) + 0.36 * t;
              g = 0.56 * (1 - t) + 0.33 * t;
              b = 0.55 * (1 - t) + 0.28 * t;
            }
            const s = Math.max(0, d.dot(sunDir));
            const sunAmt = Math.pow(s, 340) * 80 + Math.pow(s, 14) * 0.4;
            const i = (y * W + x) * 4;
            data[i] = half(r + sunAmt);
            data[i + 1] = half(g + sunAmt * 0.96);
            data[i + 2] = half(b + sunAmt * 0.86);
            data[i + 3] = half(1);
          }
        }
        const tex = new THREE.DataTexture(
          data, W, H, THREE.RGBAFormat, THREE.HalfFloatType,
        );
        tex.mapping = THREE.EquirectangularReflectionMapping;
        tex.colorSpace = THREE.LinearSRGBColorSpace;
        tex.minFilter = THREE.LinearFilter;
        tex.magFilter = THREE.LinearFilter;
        tex.generateMipmaps = false;
        tex.needsUpdate = true;
        return tex;
      }

      async function init() {
        const device = await createTimingDevice();
        hasTimestamps = Boolean(device?.features?.has("timestamp-query"));
        renderer = new THREE.WebGPURenderer({
          antialias: true,
          trackTimestamp: true,
          ...(device ? { device } : {}),
        });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(innerWidth, innerHeight);
        renderer.setClearColor(0xb8c4d2);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = ctl.exposure;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        await renderer.init();

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xb8c4d2);
        scene.fog = new THREE.Fog(0xb8c4d2, 70, 160);
        scene.environment = buildStudioEnv();

        camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 400);
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 0.4;
        controls.maxDistance = 120;

        hemi = new THREE.HemisphereLight(0xf0f5ff, 0xd2c4b0, ctl.hemiIntensity);
        scene.add(hemi);

        sun = new THREE.DirectionalLight(0xfff6e8, ctl.sunIntensity);
        sun.position.set(28, 48, 20);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.near = 1;
        sun.shadow.camera.far = 120;
        sun.shadow.camera.left = -40;
        sun.shadow.camera.right = 40;
        sun.shadow.camera.top = 40;
        sun.shadow.camera.bottom = -40;
        sun.shadow.bias = sceneCtl.shadowBias;
        sun.shadow.normalBias = sceneCtl.shadowNormalBias;
        scene.add(sun);
        scene.add(sun.target);

        fill = new THREE.DirectionalLight(0xdde8ff, ctl.fillIntensity);
        fill.position.set(-24, 18, -20);
        scene.add(fill);

        rim = new THREE.DirectionalLight(0xffffff, ctl.rimIntensity);
        rim.position.set(6, 16, 32);
        scene.add(rim);

        // No-shadow fill on the axis so the inner wall is readable. Sun alone
        // only enters through the open ends and the bore reads as a cave.
        boreLight = new THREE.PointLight(0xfff4e8, ctl.boreIntensity, 22, 2);
        boreLight.castShadow = false;
        scene.add(boreLight);

        ground = new THREE.Mesh(
          new THREE.PlaneGeometry(200, 200),
          new THREE.MeshStandardMaterial({ color: 0xd8dde6, roughness: 0.92, metalness: 0 }),
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.02;
        ground.receiveShadow = true;
        scene.add(ground);

        grid = new THREE.GridHelper(80, 40, 0x8a96a8, 0xb8c0cc);
        grid.position.y = 0.001;
        scene.add(grid);

        pieceRoot = new THREE.Group();
        scene.add(pieceRoot);

        tubeMat = createTubeMaterial(look);
        gameMat = labMat = tubeMat;
        applyLook();
        applySide();

        rebuildPiece();
        applyShader();
        resetCamera();
        buildGui();

        addEventListener("resize", onResize);
        addEventListener("keydown", onKey);

        window.__tubeLab = {
          renderer, scene, camera, controls, look, ctl,
          rebuildPiece, applyShader, applyLook, exportLook,
          resetCamera, insideCamera, fillCamera, perf,
          gameMat, labMat, gameMesh, labMesh,
        };

        renderer.setAnimationLoop(frame);
      }

      function onKey(e) {
        if (e.target?.matches?.("input, textarea")) return;
        const k = e.key.toLowerCase();
        if (k === "1") { ctl.shader = "game"; applyShader(); gui?.controllersRecursive?.().forEach((c) => c.updateDisplay?.()); }
        if (k === "2") { ctl.shader = "lab"; applyShader(); gui?.controllersRecursive?.().forEach((c) => c.updateDisplay?.()); }
        if (k === "r") resetCamera();
        if (k === "i") insideCamera();
        if (k === "f") fillCamera();
      }

      function onResize() {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      }

      function frame() {
        controls.update();
        renderer.render(scene, camera);

        if (hasTimestamps) renderer.resolveTimestampsAsync(THREE.TimestampQuery.RENDER);

        const now = performance.now();
        if (!perf.since) perf.since = now;
        perf.frames++;
        const ts = renderer.info.render.timestamp;
        if (ts > 0) { perf.gpuSum += ts; perf.gpuN++; }
        if (now - perf.since >= 500) {
          perf.fps = (perf.frames * 1000) / (now - perf.since);
          perf.gpu = perf.gpuN ? perf.gpuSum / perf.gpuN : 0;
          $("s-fps").textContent = perf.fps.toFixed(0);
          $("s-gpu").textContent = perf.gpuN ? `${perf.gpu.toFixed(2)} ms` : "n/a";
          $("s-draws").textContent = String(renderer.info.render.drawCalls);
          perf.frames = 0; perf.gpuSum = 0; perf.gpuN = 0; perf.since = now;
        }
      }

      init().catch(showErr);
    </script>
  </body>
</html>
