<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud Lab — modular-road volumetric clouds</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: #0b1018; color: #dce6f2;
        font: 13px/1.45 ui-sans-serif, system-ui, sans-serif;
      }
      canvas { display: block; width: 100%; height: 100%; }

      #hud {
        position: fixed; top: 12px; left: 12px; z-index: 10; width: 300px;
        max-height: calc(100vh - 24px); overflow-y: auto;
        padding: 12px 14px;
        background: rgba(8, 13, 22, 0.82);
        border: 1px solid rgba(150, 180, 220, 0.18);
        border-radius: 10px;
        backdrop-filter: blur(8px);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
      }
      #hud::-webkit-scrollbar { width: 8px; }
      #hud::-webkit-scrollbar-thumb { background: rgba(150,180,220,0.25); border-radius: 4px; }
      #hud h1 {
        margin: 0 0 2px; font-size: 11px; letter-spacing: 0.09em;
        text-transform: uppercase; color: #7f93ad; font-weight: 700;
      }
      #hud .title { margin: 0 0 10px; font-size: 17px; font-weight: 650; color: #f2f6fb; }

      .stats {
        display: grid; grid-template-columns: auto 1fr; gap: 2px 10px;
        padding: 8px 0; margin-bottom: 6px;
        border-top: 1px solid rgba(150,180,220,0.14);
        border-bottom: 1px solid rgba(150,180,220,0.14);
        font-variant-numeric: tabular-nums;
      }
      .stats dt { color: #7f93ad; font-size: 11px; }
      .stats dd { margin: 0; color: #f2f6fb; font-size: 12px; font-weight: 600; }
      .stats dd.warn { color: #ffb05c; }
      .stats dd.good { color: #6ee7a8; }

      .grp { margin-top: 10px; }
      .grp > summary {
        cursor: pointer; list-style: none; user-select: none;
        font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
        color: #6fd3ff; font-weight: 700; padding: 4px 0;
      }
      .grp > summary::-webkit-details-marker { display: none; }
      .grp > summary::before { content: "▸ "; color: #45607d; }
      .grp[open] > summary::before { content: "▾ "; }

      .row { display: grid; grid-template-columns: 92px 1fr 44px; gap: 6px;
             align-items: center; margin: 3px 0; }
      .row label { color: #9fb0c6; font-size: 11px; }
      .row input[type=range] { width: 100%; height: 16px; accent-color: #6fd3ff; }
      .row .val { color: #cfe0f2; font-size: 11px; text-align: right;
                  font-variant-numeric: tabular-nums; }
      .row input[type=checkbox] { accent-color: #6fd3ff; justify-self: start; }

      .btns { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
      .btns button {
        flex: 1 1 auto; padding: 5px 8px; font-size: 11px; font-weight: 600;
        color: #cfe0f2; background: rgba(80, 120, 170, 0.22);
        border: 1px solid rgba(150, 180, 220, 0.28); border-radius: 6px; cursor: pointer;
      }
      .btns button:hover { background: rgba(110, 160, 220, 0.35); color: #fff; }

      .keys {
        margin-top: 10px; padding-top: 8px;
        border-top: 1px solid rgba(150, 180, 220, 0.16);
        color: #7f93ad; font-size: 11px; line-height: 1.6;
      }
      .keys b { color: #cfe0f2; font-weight: 600; }

      #err {
        position: fixed; left: 12px; bottom: 12px; z-index: 20;
        max-width: 640px; padding: 10px 12px; display: none;
        background: rgba(60, 12, 12, 0.94); border: 1px solid #a44;
        border-radius: 8px; color: #ffb0b0; white-space: pre-wrap;
        font: 11px/1.5 ui-monospace, monospace;
      }
      #boot {
        position: fixed; inset: 0; z-index: 30; display: flex;
        align-items: center; justify-content: center; pointer-events: none;
        color: #6fd3ff; font-size: 14px; letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <h1>Cloud lab</h1>
      <div class="title">Fly-through volumetrics</div>

      <dl class="stats">
        <dt>GPU</dt><dd id="s-gpu">–</dd>
        <dt>FPS</dt><dd id="s-fps">–</dd>
        <dt>Altitude</dt><dd id="s-alt">–</dd>
        <dt>In cloud</dt><dd id="s-in">–</dd>
        <dt>Bake</dt><dd id="s-bake">baking…</dd>
      </dl>

      <div class="btns">
        <button data-view="below">Below</button>
        <button data-view="inside">Inside</button>
        <button data-view="above">Above</button>
        <button data-view="grazing">Grazing</button>
      </div>

      <details class="grp" open>
        <summary>Shape</summary>
        <div id="g-shape"></div>
      </details>
      <details class="grp">
        <summary>March</summary>
        <div id="g-march"></div>
      </details>
      <details class="grp">
        <summary>Lighting</summary>
        <div id="g-light"></div>
      </details>
      <details class="grp">
        <summary>Sky &amp; wind</summary>
        <div id="g-sky"></div>
      </details>
      <details class="grp">
        <summary>Quality</summary>
        <div id="g-qual"></div>
      </details>

      <div class="btns">
        <button id="b-copy">Copy params</button>
        <button id="b-reset">Reset</button>
      </div>

      <div class="keys">
        <b>WASD</b> fly · <b>Q/E</b> down/up · <b>Shift</b> boost<br />
        <b>drag</b> look · <b>1–4</b> viewpoints · <b>C</b> clouds on/off · <b>H</b> hide panel
      </div>
    </div>

    <div id="boot">initialising WebGPU…</div>
    <div id="err"></div>

    <script type="module">
      import { startCloudLab } from "./cloudLab.js";
      startCloudLab().catch((err) => {
        console.error(err);
        const el = document.getElementById("err");
        el.style.display = "block";
        el.textContent = `${err?.message ?? err}\n\n${err?.stack ?? ""}`;
        document.getElementById("boot").textContent = "";
      });
    </script>
  </body>
</html>
