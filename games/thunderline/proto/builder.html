<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thunderline P1 builder</title>
    <!--
      Prototype P1/P2 (grey box, throwaway): pieces on an 8 m × 2 m grid, chained from the open end,
      an automatic camera, a timeline of the track in driving order, predicted speed, and a preview
      ride at that speed. See ../DESIGN.md §4, §5, §9.
    -->
    <style>
      :root { --bg: #0e1116; --panel: rgba(16, 19, 25, 0.88); --line: #2a313c; --text: #dfe5ee; --dim: #8b95a5; --accent: #ffb43d; --cyan: #54d2e6; --bad: #ff5a5a; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc4e4; color: var(--text); font: 13px/1.35 system-ui, sans-serif; }
      #view { position: fixed; inset: 0; }
      .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; z-index: 10; }
      #stats { left: 12px; top: 12px; padding: 8px 12px; }
      #stats b { color: var(--accent); }
      #palette { left: 12px; top: 70px; padding: 8px; display: flex; flex-direction: column; gap: 6px; width: 132px; }
      #palette button, #tools button, #params button { background: #1c222c; color: var(--text); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font: inherit; }
      #palette button { display: flex; align-items: center; gap: 8px; padding: 8px; text-align: left; }
      #palette button .ic { font-size: 20px; width: 24px; text-align: center; }
      #palette button .k { margin-left: auto; color: var(--dim); font-size: 11px; }
      #palette button.on { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan) inset; }
      #palette hr { border: 0; border-top: 1px solid var(--line); margin: 2px 0; width: 100%; }
      #tools { right: 12px; top: 12px; padding: 8px; display: flex; gap: 6px; flex-wrap: wrap; max-width: 420px; justify-content: flex-end; }
      #tools button { padding: 6px 10px; }
      #params { left: 50%; transform: translateX(-50%); bottom: 92px; padding: 8px 10px; display: none; align-items: center; gap: 8px; white-space: nowrap; }
      #params.show { display: flex; }
      #params .name { font-weight: 600; color: var(--cyan); min-width: 70px; }
      #params .name.sel { color: var(--accent); }
      #params .desc { min-width: 150px; }
      #params button { padding: 6px 9px; }
      #params button.place { background: #1d4a2c; border-color: #2e7a46; }
      #params .warn { color: var(--bad); font-weight: 600; }
      #timeline { left: 12px; right: 12px; bottom: 12px; padding: 8px; display: flex; gap: 4px; overflow-x: auto; height: 58px; align-items: stretch; }
      .chip { flex: 0 0 auto; min-width: 54px; padding: 4px 6px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; color: #0b0d10; font-size: 11px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
      .chip .t { font-weight: 700; font-size: 13px; }
      .chip.sel { border-color: var(--accent); box-shadow: 0 0 0 2px #000 inset; }
      .chip.draft { border: 2px dashed var(--cyan); background: transparent !important; color: var(--cyan); }
      .chip.cp::after { content: "CP"; position: absolute; right: 3px; top: 2px; font-size: 9px; font-weight: 800; background: #ffd84a; padding: 0 3px; border-radius: 3px; }
      .chip.bad { outline: 2px solid var(--bad); }
      .caret { flex: 0 0 3px; background: var(--cyan); border-radius: 2px; }
      #help { right: 12px; bottom: 82px; padding: 8px 10px; color: var(--dim); font-size: 12px; max-width: 300px; }
      #help kbd { color: var(--text); background: #232a35; border-radius: 3px; padding: 0 4px; font: 11px ui-monospace, monospace; }
      #ridehud { left: 50%; top: 14px; transform: translateX(-50%); padding: 6px 14px; font-size: 22px; font-weight: 700; display: none; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="stats" class="panel"></div>
    <div id="palette" class="panel"></div>
    <div id="tools" class="panel"></div>
    <div id="params" class="panel"></div>
    <div id="timeline" class="panel"></div>
    <div id="ridehud" class="panel"></div>
    <div id="help" class="panel">
      <kbd>1</kbd>–<kbd>4</kbd> pick a piece · <kbd>←</kbd><kbd>→</kbd> bend · <kbd>↑</kbd><kbd>↓</kbd> height ·
      <kbd>+</kbd><kbd>−</kbd> size · <kbd>Enter</kbd> place · <kbd>Esc</kbd> stop<br />
      Click a piece (or the strip) to select it; the same keys then edit it. <kbd>Del</kbd> removes it, and new pieces go in after it.
      <kbd>C</kbd> checkpoint · <kbd>B</kbd> boost · <kbd>P</kbd> ride · <kbd>O</kbd> overview · <kbd>Ctrl+Z</kbd> undo<br />
      Wheel zoom · right-drag look around (optional)
    </div>
    <script type="module" src="./builder.js"></script>
  </body>
</html>
