<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The engine loads its assets (models / textures / sounds) via paths relative
      to the page, written for the editor's /v2/ location. This game page lives
      elsewhere, so we rebase relative URLs to /v2/ so those assets resolve the
      same way the editor does. (Long-term product fix: make the engine's asset
      paths location-independent so this isn't needed.)
    -->
    <base href="/v2/" />
    <title>RTS Game</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
      }
      canvas {
        display: block;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: system-ui, -apple-system, sans-serif;
        color: #cfcfcf;
        background: #0a0a0a;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      #boot.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot .spinner {
        width: 34px;
        height: 34px;
        border: 3px solid #333;
        border-top-color: #6ab0ff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #boot .err {
        max-width: 640px;
        margin-top: 8px;
        padding: 12px 16px;
        font-size: 13px;
        line-height: 1.5;
        color: #ff8c8c;
        background: #1c0f0f;
        border: 1px solid #532;
        border-radius: 6px;
        white-space: pre-wrap;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="spinner" id="spinner"></div>
      <div id="msg">Loading…</div>
      <div class="err" id="err"></div>
    </div>

    <script type="module">
      // Absolute so the <base href="/v2/"> above doesn't rebase it.
      import { startRtsGame } from "/games/rts/rtsGame.js";

      const boot = document.getElementById("boot");
      const msg = document.getElementById("msg");
      const err = document.getElementById("err");
      const spinner = document.getElementById("spinner");

      try {
        await startRtsGame({ onStatus: (s) => (msg.textContent = s) });
        boot.classList.add("hidden");
        setTimeout(() => boot.remove(), 600);
      } catch (e) {
        console.error("[RTS] failed to start", e);
        spinner.style.display = "none";
        msg.textContent = "Failed to start the RTS game.";
        err.style.display = "block";
        err.textContent = e?.stack || e?.message || String(e);
      }
    </script>
  </body>
</html>
