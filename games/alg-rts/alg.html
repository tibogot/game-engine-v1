<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Algeria RTS page. The engine draws into #game; the page needs nothing from
      the editor's page (startV3App({ container })).

      The engine loads assets by paths relative to /v3/, so that's the base.
    -->
    <base href="/v3/" />
    <title>Sand &amp; Blood — Algeria RTS</title>
    <!-- No icon file: an empty one, or the browser asks for /favicon.ico and logs a 404. -->
    <link rel="icon" href="data:," />
    <!-- The cover art first, so the loading screen is never a black screen. -->
    <link rel="preload" as="image" href="/games/alg-rts/menu/menualg2.webp" />
    <link rel="preload" as="image" href="/games/alg-rts/menu/sandlogo.webp" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #game { position: fixed; inset: 0; }
      #perf-stats { top: 8px !important; bottom: auto !important; left: 8px !important; }

      /* ── Loading screen (nam.html's, in this game's colours) ──────────────
         Full-screen cover art: THE MENU'S (2026-10-11, menu.html — menualg2, mirrored the same
         way, the logo top left where the menu has it), so a choice in the menu flows straight
         into the loading screen; the map's slides fade over it, the logo stays on top. */
      #boot {
        position: fixed; inset: 0; z-index: 2147483000; overflow: hidden;
        height: 100svh;
        background: #16110c; color: #eadfc8;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        transition: opacity 0.6s ease;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #boot .art {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; object-position: 20% 20%;
        /* THE SLIDES (2026-10-09, you: "more images so the loading is less boring"): the next
           picture fades over the last. NO ZOOM any more (you, 2026-10-11: "jittering", and a new
           slide "appears and scales up"): the slow scale stuttered while the boot compiles and
           uploads (the GPU busy), and each new slide restarted it from 1 over a zoomed one. */
        transition: opacity 1.4s ease;
      }
      #boot .art.waiting { opacity: 0; }
      /* The menu's art and logo (menu.html: the same mirror, crop, place and size). */
      #boot .art.cover { transform: scaleX(-1); }
      #boot .logo { position: absolute; top: clamp(20px, 6vh, 64px); left: clamp(16px, 5vw, 80px); width: clamp(220px, 26vw, 420px); height: auto; }
      /* The picture's caption, bottom left, over the shade. */
      #boot .cap {
        position: absolute; left: 3.2%; bottom: 6.5%; max-width: min(380px, 34vw);
        font-size: 12px; font-style: italic; letter-spacing: 0.04em; line-height: 1.5; color: #d8c9a8;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); opacity: 0; transition: opacity 1.2s ease;
      }
      /* Darken the foot of the art so the bar and tips read over the dust. */
      #boot .shade {
        position: absolute; inset: 0;
        background: linear-gradient(to top, rgba(14, 10, 6, 0.82) 0%, rgba(14, 10, 6, 0) 34%);
      }
      #boot .load {
        position: absolute; left: 50%; bottom: 6.5%; transform: translateX(-50%);
        width: min(560px, 72vw);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      }
      #boot .tip {
        min-height: 1.4em; margin-bottom: 14px; text-align: center;
        font-size: 12px; letter-spacing: 0.12em; color: #d8c9a8;
        transition: opacity 0.5s ease;
      }
      #boot .row {
        display: flex; justify-content: space-between; align-items: baseline;
        margin-bottom: 7px; font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
      }
      #boot .pct { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: 0.1em; }
      #boot .bar { height: 3px; background: rgba(234, 223, 200, 0.16); }
      /* The tricolour of the title's underline, as the bar fills. */
      #boot .fill {
        height: 100%; width: 0%;
        background: linear-gradient(to right, #2f4fa8, #eadfc8 50%, #c8322a);
        background-size: min(560px, 72vw) 100%;
        box-shadow: 0 0 8px rgba(234, 223, 200, 0.45);
      }
      #boot .err {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        max-width: 640px; padding: 12px 16px;
        font-size: 13px; line-height: 1.5; color: #ff9a8c;
        background: rgba(20, 10, 10, 0.92); border: 1px solid #5a3328; border-radius: 2px;
        white-space: pre-wrap; display: none;
      }
      #hud {
        position: fixed; right: calc(var(--alg-dev-w, 0px) + 10px); bottom: 10px; z-index: 50; padding: 6px 10px; border-radius: 4px;
        background: rgba(20, 14, 8, 0.6); color: #e8dcc4; font: 12px "Segoe UI", system-ui, sans-serif; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot">
      <img class="art cover" src="/games/alg-rts/menu/menualg2.webp" alt="" />
      <div class="shade"></div>
      <img class="logo" src="/games/alg-rts/menu/sandlogo.webp" alt="Sand &amp; Blood" />
      <div class="cap" id="cap"></div>
      <div class="load">
        <div class="tip" id="tip"></div>
        <div class="row"><span id="msg">Chargement</span><span class="pct" id="pct">0%</span></div>
        <div class="bar"><div class="fill" id="fill"></div></div>
      </div>
      <div class="err" id="err"></div>
    </div>
    <div id="hud"></div>

    <script type="module">
      // LANGUAGES (i18n/i18n.js): French is the key; English lives in i18n/en/systems.js.
      // Tiny module (the dictionaries only) — the screen is in the player's language at once.
      import { t } from "./i18n/i18n.js";
      const boot = document.getElementById("boot");
      const msg = document.getElementById("msg");
      const pctEl = document.getElementById("pct");
      const fill = document.getElementById("fill");
      const tipEl = document.getElementById("tip");
      const err = document.getElementById("err");

      // ── Tips: things that are true about this game as it stands ──────────
      const TIPS = [
        t("Aurès, novembre 1954. Le massif est à eux ; les vallées sont à vous."),
        t("Le poste forme des appelés : sa porte s'ouvre pour chaque homme qu'il envoie."),
        t("Le haut de la minicarte est tourné vers l'ennemi — votre poste est en bas."),
        t("Q / E tournent la caméra, la molette zoome, C la libère."),
        t("Ctrl + un chiffre crée un groupe ; le chiffre le rappelle."),
      ];
      msg.textContent = t("Chargement");
      let tipI = Math.floor(Math.random() * TIPS.length);
      const showTip = () => {
        tipEl.style.opacity = 0;
        setTimeout(() => { tipEl.textContent = TIPS[tipI++ % TIPS.length]; tipEl.style.opacity = 1; }, 450);
      };
      tipEl.textContent = TIPS[tipI++ % TIPS.length];
      const tipTimer = setInterval(showTip, 6500);

      // ── THE SLIDES: the cover first (the menu's art, the logo over all), then these, one every
      // SLIDE_S seconds (public/games/alg-rts/loading/, WebP ~150 KB each). Each is fetched a moment
      // after the page opens — never in the way of the cover — and shown only once decoded (off
      // the main thread). The last one stays. Add a picture: one line here.
      const SLIDES = [
        { src: "/games/alg-rts/loading/aures-descente.webp", pos: "50% 45%", cap: t("Aurès, 1956. Une section de paras descend vers le douar.") },
      ];
      const SLIDE_S = 7;
      const capEl = document.getElementById("cap");
      const shade = boot.querySelector(".shade");
      let slideI = 0;
      const slideTimers = [];
      const nextSlide = () => {
        const s = SLIDES[slideI++];
        if (!s || !boot.isConnected) return;
        const img = new Image();
        img.className = "art waiting";
        img.alt = "";
        img.decoding = "async";
        img.style.objectPosition = s.pos ?? "50% 50%";
        img.src = s.src;
        img.decode().then(() => {
          if (!boot.isConnected) return;
          boot.insertBefore(img, shade);          // over the last picture, under the shade and the bar
          requestAnimationFrame(() => {
            img.classList.remove("waiting");
            capEl.style.opacity = 0;
            setTimeout(() => { capEl.textContent = s.cap ?? ""; capEl.style.opacity = s.cap ? 1 : 0; }, 700);
          });
          if (slideI < SLIDES.length) slideTimers.push(setTimeout(nextSlide, SLIDE_S * 1000));
        }).catch(() => {});                       // a picture that fails: the screen keeps the last
      };
      // Fetched a second in (the cover is up by then): in the cache when their turn comes.
      slideTimers.push(setTimeout(() => SLIDES.forEach((s) => { const p = new Image(); p.src = s.src; }), 1000));
      slideTimers.push(setTimeout(nextSlide, SLIDE_S * 1000));

      // ── A progress bar that knows how long each stage takes (as nam.html) ─
      // Every boot records how long each status stage lasted and the next boot
      // uses those as the bar's scale. Within a stage the bar creeps toward
      // that stage's share; the level download reports real bytes. The first
      // boot on a machine uses these rough weights.
      // One table per map (?map=, layout.js): its level loads under its own name.
      const MAP_ID = new URLSearchParams(location.search).get("map");
      const LEVEL_STAGE = `Loading alg-${MAP_ID ?? "aures"}.v3proj…`;
      const KEY = MAP_ID && MAP_ID !== "aures" ? `algrts.bootStages.${MAP_ID}` : "algrts.bootStages";
      const DEFAULT = {
        order: ["Starting engine…", "Loading level…", LEVEL_STAGE, "Placing assets…",
          "Setting up camera…", "Mustering…", "Painting surfaces…"],
        ms: { "Starting engine…": 2500, "Loading level…": 4000, [LEVEL_STAGE]: 3000,
          "Placing assets…": 3000, "Mustering…": 2000, "Painting surfaces…": 800 },
      };
      let learned = DEFAULT;
      try { learned = JSON.parse(localStorage.getItem(KEY) || "null") || DEFAULT; } catch { /* private mode */ }
      const expectMs = (s) => learned.ms[s] ?? 600;
      const total = Math.max(1, learned.order.reduce((a, s) => a + expectMs(s), 0));

      const seen = [];          // [{ s, t0 }]
      let dl = -1;              // download fraction of the current stage, if any
      let shown = 0;
      const pretty = (s) => s.replace(/…$/, "").replace(/\.v3proj$/, "");
      const onStatus = (s) => {
        seen.push({ s, t0: performance.now() });
        dl = -1;
        if (s !== "ready") msg.textContent = pretty(s);
      };
      const onProgress = (f) => { dl = f; };
      const progress = () => {
        if (!seen.length) return 0;
        let done = 0;
        for (let i = 0; i < seen.length - 1; i++) done += expectMs(seen[i].s);
        const cur = seen[seen.length - 1];
        const e = expectMs(cur.s);
        const within = dl >= 0 ? dl : 1 - Math.exp(-(performance.now() - cur.t0) / e);
        return Math.min(0.99, (done + e * Math.min(0.97, within)) / Math.max(total, done + e));
      };
      let raf = 0;
      const tick = () => {
        shown = Math.max(shown, progress());            // never goes backwards
        fill.style.width = `${(shown * 100).toFixed(1)}%`;
        pctEl.textContent = `${Math.floor(shown * 100)}%`;
        raf = requestAnimationFrame(tick);
      };
      tick();

      try {
        // Relative to THIS file (Vite resolves imports from the file, not <base>).
        // FIRST LAUNCH: the engine reads its terrain size from this page's
        // saved config when it loads; with none it starts at its default,
        // finds the level is another size and RELOADS the page — a whole
        // boot thrown away (measured on a clean install: 39 s vs 31 s). The
        // level's size (alg-aures.v3proj), written before the engine loads.
        // A level of another size still takes the reload path (levelLoader).
        try {
          const key = `v3.terrainConfig:${location.pathname.replace(/index\.html$/, "")}`;
          if (!localStorage.getItem(key)) {
            localStorage.setItem(key, JSON.stringify({ worldSize: 1024, heightmapSize: 1024, splatSize: 2048, maxHeight: 250 }));
          }
        } catch { /* private mode: the reload path */ }
        const { startAlgGame } = await import("./algGame.js");
        window.__ALG = await startAlgGame({
          container: document.getElementById("game"),
          onStatus,
          onProgress,
        });

        // Learn this machine's stage times for the next boot (smoothed).
        const end = performance.now();
        const ms = { ...learned.ms };
        for (let i = 0; i < seen.length; i++) {
          const next = i + 1 < seen.length ? seen[i + 1].t0 : end;
          const d = next - seen[i].t0;
          ms[seen[i].s] = learned.ms[seen[i].s] ? 0.5 * learned.ms[seen[i].s] + 0.5 * d : d;
        }
        try { localStorage.setItem(KEY, JSON.stringify({ order: seen.map((x) => x.s), ms })); } catch { /* private mode */ }

        cancelAnimationFrame(raf);
        clearInterval(tipTimer); slideTimers.forEach(clearTimeout);
        fill.style.width = "100%";
        pctEl.textContent = "100%";
        msg.textContent = t("Prêt");
        setTimeout(() => boot.classList.add("hidden"), 250);
        setTimeout(() => boot.remove(), 900);
      } catch (e) {
        console.error("[alg-rts] failed to start", e);
        cancelAnimationFrame(raf);
        clearInterval(tipTimer); slideTimers.forEach(clearTimeout);
        msg.textContent = t("Échec du démarrage");
        err.style.display = "block";
        err.textContent = e?.stack || e?.message || String(e);
      }
    </script>
  </body>
</html>
