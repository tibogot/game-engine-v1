<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Algeria RTS page. The engine draws into #game; the page needs nothing from
      the editor's page (startV3App({ container })).

      The engine loads assets by paths relative to /v3/, so that's the base.
    -->
    <base href="/v3/" />
    <title>Djebel — Algeria RTS</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #game { position: fixed; inset: 0; }
      #perf-stats { top: 8px !important; bottom: auto !important; left: 8px !important; }
      #boot {
        position: fixed; inset: 0; z-index: 2147483000; display: flex; align-items: center; justify-content: center;
        background: #16110c; color: #e8dcc4; font: 14px "Segoe UI", system-ui, sans-serif; letter-spacing: 0.04em;
        transition: opacity 0.5s;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #hud {
        position: fixed; right: 10px; bottom: 10px; z-index: 50; padding: 6px 10px; border-radius: 4px;
        background: rgba(20, 14, 8, 0.6); color: #e8dcc4; font: 12px "Segoe UI", system-ui, sans-serif; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot">Loading…</div>
    <div id="hud"></div>

    <script type="module">
      const boot = document.getElementById("boot");
      try {
        // Relative to THIS file (Vite resolves imports from the file, not <base>).
        const { startAlgGame } = await import("./algGame.js");
        window.__ALG = await startAlgGame({
          container: document.getElementById("game"),
          onStatus: (s) => (boot.textContent = s),
        });
        boot.classList.add("hidden");
        setTimeout(() => boot.remove(), 600);
      } catch (e) {
        console.error("[alg-rts] failed to start", e);
        boot.textContent = `Failed to start: ${e?.message ?? e}`;
      }
    </script>
  </body>
</html>
