<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- THE LAB (lab.js, 2026-10-19): every building of the game in one catalogue — search, filters, its
         versions side by side, the game's views, the numbers. (The old building-lab.html: gone, 2026-10-25 — one lab.) -->
    <base href="/v3/" />
    <title>Lab — Sand &amp; Blood</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #0b0906; --panel: #0f0c08; --panel2: #1d1710; --line: rgba(240, 200, 120, 0.42);
        --text: #fbf6ea; --dim: #d6c8ab; --gold: #f2c45a; --gold2: #ffe3a3; --green: #a6e37f; --amber: #ffb547; --grey: #c2b9a8;
        --r: 8px; font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
      #view { position: fixed; inset: 0 300px 0 330px; }
      #side { position: fixed; left: 0; top: 0; bottom: 0; width: 330px; background: var(--panel); border-right: 1px solid var(--line);
        display: flex; flex-direction: column; z-index: 10; }
      #side header { padding: 14px 14px 8px; }
      #side h1 { margin: 0 0 2px; font-size: 15px; letter-spacing: 0.12em; color: var(--gold2); text-transform: uppercase; }
      #side .sub { color: var(--dim); font-size: 12.5px; }
      #sections { display: flex; gap: 4px; margin-top: 10px; }
      #sections .sec, #bSections .sec { flex: 1; border: 1px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 6px; padding: 6px 4px;
        cursor: pointer; font: inherit; font-size: 13px; font-weight: 600; line-height: 1.2; }
      #sections .sec:hover, #bSections .sec:hover { border-color: var(--gold); }
      #sections .sec.on, #bSections .sec.on { background: var(--gold); color: #000; border-color: var(--gold); }
      #sections .sec small, #bSections .sec small { display: block; font-weight: 400; font-size: 11px; opacity: 0.8; }
      #search { width: 100%; margin-top: 10px; padding: 8px 10px; border-radius: var(--r); border: 1px solid var(--line); background: #000;
        color: var(--text); font: inherit; outline: none; }
      #search:focus { border-color: var(--gold); }
      .filters { padding: 6px 14px 10px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 5px; }
      .srow { display: flex; gap: 6px; margin-top: 10px; } .srow #search { margin-top: 0; flex: 1; }
      #browseAll { border: 1px solid var(--gold); background: var(--panel2); color: var(--gold2); border-radius: var(--r); padding: 0 10px; cursor: pointer; font: inherit; font-size: 13px; white-space: nowrap; }
      #browseAll:hover { background: var(--gold); color: #000; }
      /* the compact filters: one dropdown a group */
      .fsel { flex: 1 1 45%; min-width: 0; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; font-size: 12.5px; }
      .fsel.on { border-color: var(--gold); color: var(--gold2); font-weight: 600; }
      /* the groups */
      .ghead { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; padding: 8px 2px 2px; cursor: pointer;
        color: var(--gold2); font-weight: 700; font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--line); user-select: none; }
      .ghead small { color: var(--dim); font-weight: 400; text-transform: none; letter-spacing: 0; }
      .ghead:hover span { color: var(--gold); }
      /* your verdicts */
      .thumb { position: relative; }
      .vb { position: absolute; right: 4px; top: 4px; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px; color: #000; }
      .v-keep { background: #7fc97a; } .v-improve { background: #e8c25a; } .v-redo { background: #e8904a; } .v-remove { background: #e06a5a; } .v-parked { background: #8fb4d8; }
      .vbtn.on { color: #000; font-weight: 700; border-color: transparent; }
      .vbtn:not(.on) { background: var(--panel2); }
      #vNote { width: 100%; margin-top: 6px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: #000; color: var(--text); font: inherit; font-size: 12.5px; box-sizing: border-box; }
      /* the catalogue, full screen */
      #browser { position: fixed; inset: 0; z-index: 40; background: #0c0905; display: none; flex-direction: column; }
      #browser.open { display: flex; }
      .bbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
      .bbar h2 { margin: 0; font-size: 15px; letter-spacing: 0.12em; color: var(--gold2); text-transform: uppercase; }
      #bSections { display: flex; gap: 4px; } #bSections .sec { padding: 5px 10px; }
      #bSearch { width: 220px; padding: 7px 10px; border-radius: var(--r); border: 1px solid var(--line); background: #000; color: var(--text); font: inherit; outline: none; }
      #bFilters { display: flex; gap: 5px; } #bFilters .fsel { flex: none; }
      .bcount { color: var(--dim); font-size: 13px; margin-left: auto; }
      .bclose { border: 1px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 15px; }
      .bgrid { flex: 1; overflow-y: auto; padding: 8px 18px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); grid-auto-rows: max-content; gap: 10px; align-content: start; }
      .bgrid .thumb { height: 104px; }
      .frow { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; align-items: center; }
      .frow > span { width: 54px; color: var(--gold2); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
      .chip { border: 1px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 999px; padding: 3px 9px; cursor: pointer;
        font: inherit; font-size: 13px; }
      .chip:hover { border-color: var(--gold); }
      .chip.on { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 600; }
      #count { padding: 8px 14px; color: var(--text); font-size: 13px; display: flex; justify-content: space-between; }
      #count button { background: none; border: none; color: var(--gold2); cursor: pointer; font: inherit; font-size: 13px; padding: 0; text-decoration: underline; }
      #list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 10px 14px; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: max-content; gap: 8px; align-content: start; }
      .card { background: var(--panel2); border: 1px solid rgba(255,255,255,0.08); border-radius: var(--r); cursor: pointer; overflow: hidden; text-align: left;
        color: var(--text); padding: 0; font: inherit; }
      .card:hover { border-color: var(--gold); }
      .card.on { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; background: #2c2213; }
      .thumb { height: 74px; background: #0c0905 center / cover no-repeat; display: grid; place-items: center; color: #8a7a5c; font-size: 24px; }
      .card .t { padding: 7px 8px 8px; font-size: 13px; line-height: 1.3; font-weight: 600; }
      .badge { display: inline-block; margin-top: 5px; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid; font-weight: 600; background: rgba(0,0,0,0.45); }
      .b-jeu { color: var(--green); } .b-verdict { color: var(--amber); } .b-ancien { color: var(--grey); } .b-parked { color: #8fb4d8; }
      /* the piece's bar (top) and the tools (right) */
      #bar { position: fixed; left: 346px; right: 312px; top: 12px; z-index: 9; background: var(--panel); border: 1px solid var(--line);
        border-radius: var(--r); padding: 10px 14px; }
      #bar h2 { margin: 0; font-size: 18px; color: var(--gold2); font-weight: 700; }
      #bar .note { color: var(--text); margin-top: 4px; font-size: 13px; }
      #tabs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
      #tools { position: fixed; right: 12px; top: 12px; bottom: 12px; width: 276px; z-index: 9; display: flex; flex-direction: column; gap: 10px;
        overflow-y: auto; }
      .box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
      .box h3 { margin: 0 0 8px; font-size: 12px; color: var(--gold2); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
      .box h4 { margin: 8px 0 5px; font-size: 11px; color: var(--gold2); font-weight: 600; }
      .btns { display: flex; flex-wrap: wrap; gap: 5px; }
      .btn { border: 1px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 6px; padding: 5px 9px; cursor: pointer;
        font: inherit; font-size: 13px; }
      .btn:hover { border-color: var(--gold); } .btn.on { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 600; }
      table.stats { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
      table.stats td { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
      table.stats td:last-child { text-align: right; color: var(--gold2); }
      table.stats tr.h td { color: var(--gold); font-size: 12px; font-weight: 700; text-transform: uppercase; padding-top: 8px; }
      input[type=range] { width: 100%; accent-color: var(--gold); }
      .keys { color: var(--dim); font-size: 12px; }
      #loading { position: fixed; left: 50%; top: 50%; transform: translate(calc(-50% + 165px), -50%); z-index: 20; background: var(--panel);
        border: 1px solid var(--line); border-radius: var(--r); padding: 10px 16px; color: var(--gold2); display: none; }
      #err { position: fixed; left: 346px; bottom: 12px; z-index: 30; max-width: 680px; white-space: pre-wrap; color: #ff9a8c;
        font: 12px ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <aside id="side">
      <header>
        <h1>Lab</h1>
        <div class="sub">Every asset in the game</div>
        <nav id="sections"></nav>
        <div class="srow"><input id="search" type="search" placeholder="Search… (/)" autocomplete="off" /><button id="browseAll" title="Tab">⊞ Browse all</button></div>
      </header>
      <div class="filters" id="filters"></div>
      <div id="count"></div>
      <div id="list"></div>
    </aside>
    <div id="bar"><h2 id="title">—</h2><div class="note" id="note"></div><div id="tabs"></div></div>
    <div id="tools"></div>
    <div id="loading">Loading…</div>
    <pre id="err"></pre>
    <script type="module">
      try {
        const { startLab } = await import("/games/alg-rts/lab.js");
        window.__LAB = await startLab();
      } catch (e) {
        console.error("[lab] failed to start", e);
        document.getElementById("err").textContent = e?.stack || e?.message || String(e);
      }
    </script>
  </body>
</html>
