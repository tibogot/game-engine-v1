<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- THE ICON STUDIO (iconStudio.js, 2026-10-22 — you: "some of our assets are really good looking now, do we still
         need images? thumbnails of them would look cool"): the HUD's icons RENDERED from the game's own models, one
         house style; shown at their real size beside today's silhouettes. -->
    <title>Icon studio — Sand &amp; Blood</title>
    <link rel="icon" href="data:," />
    <style>
      :root { --bg: #0b0906; --panel: #15110c; --line: rgba(240, 200, 120, 0.35); --text: #fbf6ea; --dim: #c9bb9c; --gold: #f2c45a;
        font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
      html, body { margin: 0; background: var(--bg); color: var(--text); }
      header { padding: 16px 22px 6px; }
      h1 { margin: 0; font-size: 16px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }
      .sub { color: var(--dim); font-size: 13px; }
      #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; padding: 14px 22px 30px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
      .card h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); }
      .row { display: flex; align-items: flex-end; gap: 14px; }
      .big { width: 128px; height: 128px; border-radius: 10px; }
      .sizes { display: flex; flex-direction: column; gap: 6px; }
      .sizes .lbl { color: var(--dim); font-size: 11px; }
      /* a command-card button as the HUD draws it (battleHud) */
      .btn { position: relative; width: 52px; height: 52px; border-radius: 6px; border: 1px solid rgba(242, 196, 90, 0.55); background: #120e09;
        display: grid; place-items: center; overflow: hidden; }
      .btn img { width: 48px; height: 48px; border-radius: 4px; }
      .btn .mask { width: 34px; height: 34px; background: var(--gold); -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
      .btn .key { position: absolute; right: 3px; bottom: 1px; font-size: 10px; color: var(--gold); text-shadow: 0 0 2px #000; }
      .pair { display: flex; gap: 10px; align-items: center; }
      .pair span { color: var(--dim); font-size: 11px; }
      #status { padding: 0 22px; color: var(--dim); }
    </style>
  </head>
  <body>
    <header>
      <h1>Icon studio</h1>
      <div class="sub">The HUD's icons rendered from the game's own models, one house style. Each at 128 px, and as the command
        card shows it (48 px) beside today's silhouette.</div>
    </header>
    <div id="status">Rendering…</div>
    <div id="grid"></div>
    <script type="module">
      try {
        const { startIconStudio } = await import("/games/alg-rts/iconStudio.js");
        window.__ICONS = await startIconStudio();
      } catch (e) {
        console.error("[icons] failed", e);
        document.getElementById("status").textContent = e?.stack || e?.message || String(e);
      }
    </script>
  </body>
</html>
