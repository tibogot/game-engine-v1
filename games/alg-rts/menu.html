<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sand &amp; Blood</title>
    <link rel="icon" href="data:," />
    <!-- THE MAIN MENU (2026-10-09, you: "a main menu where we choose the maps and the first
         tutorial mission"). No 3D: it opens at once; a choice loads the game (alg.html?map=…),
         its loading screen and its briefing as before. The game page still opens on its own. -->
    <link rel="preload" as="image" href="/games/alg-rts/menu/menualg2.webp" />
    <link rel="preload" as="image" href="/games/alg-rts/menu/sandlogo.webp" />
    <link rel="preload" as="font" type="font/woff2" href="/games/alg-rts/fonts/bebas-neue-latin-400.woff2" crossorigin />
    <style>
      /* THE TITLES in Bebas Neue (you, 2026-10-11), the game's own copy (public/games/alg-rts/fonts/,
         SIL OFL — OFL.txt beside it): one weight, so no bold asked of it; the rest stays Segoe UI. */
      @font-face { font-family: "Bebas Neue"; font-style: normal; font-weight: 400; font-display: swap;
        src: url(/games/alg-rts/fonts/bebas-neue-latin-400.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Bebas Neue"; font-style: normal; font-weight: 400; font-display: swap;
        src: url(/games/alg-rts/fonts/bebas-neue-latin-ext-400.woff2) format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      :root {
        --brass: #c9a54a; --brass-hi: #f1dfa6; --text: #eadfc8; --dim: #a8987a;
        --panel: rgba(16, 13, 9, 0.84); --edge: rgba(201, 165, 74, 0.35); --edge-hi: rgba(201, 165, 74, 0.8);
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0a07; color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
      /* The art MIRRORED (you, 2026-10-11): the soldiers on the right, the open plain on the left
         under the menu. scaleX(-1) rides in the drift's transform, so the two don't fight. */
      .art { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 20% 20%;
        transform: scaleX(-1); animation: drift 40s ease-out forwards; }
      @keyframes drift { from { transform: scale(-1, 1); } to { transform: scale(-1.06, 1.06); } }
      .shade { position: fixed; inset: 0; background:
        linear-gradient(to right, rgba(10, 8, 5, 0.1) 40%, rgba(10, 8, 5, 0.86) 72%),
        linear-gradient(to top, rgba(10, 8, 5, 0.7) 0%, rgba(10, 8, 5, 0) 30%); }
      /* THE SMOKE (you, 2026-10-11: black smoke on the left so the text reads): two layers of SVG
         noise (feTurbulence, tiles built in the script below), black, drifting sideways at two
         speeds; a mask keeps them on the left and fades them out past the middle. No image file. */
      .smoke { position: fixed; inset: 0; overflow: hidden; pointer-events: none; opacity: 0.9; background: rgba(8, 7, 6, 0.24);
        -webkit-mask-image: linear-gradient(to right, #000 0%, #000 34%, rgba(0, 0, 0, 0.6) 50%, transparent 72%);
        mask-image: linear-gradient(to right, #000 0%, #000 34%, rgba(0, 0, 0, 0.6) 50%, transparent 72%); }
      .smoke i { position: absolute; top: -10%; left: 0; width: calc(100% + 900px); height: 120%;
        background: var(--smoke-a) 0 0 / 900px 900px repeat; animation: roll 140s linear infinite; will-change: transform; }
      .smoke i + i { background-image: var(--smoke-b); background-size: 450px 450px; opacity: 0.75; animation-duration: 70s; }
      @keyframes roll { to { transform: translateX(-900px); } }
      /* The menu: a column on the LEFT, bare text on the art — no panels, no thumbnails; all the
         text WHITE, no shadows (you, 2026-10-11) — the smoke behind it does the reading. */
      /* Hierarchy (you, 2026-10-11): titles UPPERCASE and big, the line under them dimmer.
         The choice made goes the HUD's brass (--hud-brass, the selected tab / difficulty / language
         in the game) — no bars, no boxes. Hover: brass on everything, colour only. */
      main { position: fixed; top: 0; bottom: 0; left: clamp(16px, 5vw, 80px); width: min(620px, calc(100vw - 32px));
        display: flex; flex-direction: column; justify-content: center; gap: 4px; color: #fff; --brass-sel: #f2c94c; }
      .kicker { font-size: 13px; letter-spacing: 0.32em; text-transform: uppercase; color: #fff; margin: 0 0 14px; }
      .entry { display: block; text-align: left; padding: 14px 0; background: none; border: 0;
        color: #fff; font: inherit; cursor: pointer; transition: color 0.15s, opacity 0.15s; }
      .entry:disabled { cursor: default; opacity: 0.4; }
      .entry b { display: block; font: 400 34px/1 "Bebas Neue", "Segoe UI", sans-serif; letter-spacing: 0.04em; text-transform: uppercase; }
      .entry .sub { display: block; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.65; margin: 4px 0 2px; }
      .entry .tag { display: inline-block; font-family: "Segoe UI", system-ui, sans-serif; line-height: 1.4; margin-left: 10px; padding: 1px 6px; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 2px; vertical-align: 5px; }
      /* Every entry (main, choices, Start): brass on hover (colour only, no movement — you, 2026-10-11). */
      .entry:hover:not(:disabled), .entry:focus-visible { color: var(--brass-sel); outline: none; }
      /* The battle setup: a section label; the choices white, the one made in brass. */
      .h { margin: 20px 0 0; font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: #fff; }
      .entry[data-map] b, .entry[data-side] b { font-size: 28px; }
      .entry.sel { color: var(--brass-sel); }
      .entry[data-map]:disabled { opacity: 0.3; }
      .entry[data-side] .sub { font-size: 14px; letter-spacing: 0.05em; line-height: 1.4; opacity: 0.85; margin-top: 5px; }
      .entry.go { margin-top: 18px; }
      .entry.go b { font-size: 42px; letter-spacing: 0.08em; }
      .row { display: flex; gap: 22px; margin: 24px 0 0; }
      .small { padding: 4px 0; background: none; border: 0; color: #fff; opacity: 0.75;
        font: 600 13px "Segoe UI", system-ui, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: color 0.15s, opacity 0.15s; }
      .small:hover { opacity: 1; }
      .small.on { opacity: 1; color: var(--brass-sel); }
      .foot { position: fixed; left: clamp(16px, 5vw, 80px); bottom: 14px; font-size: 12px; color: #fff; letter-spacing: 0.06em; }
      /* THE LOGO (you, 2026-10-11: "place it top left"), lined up with the menu column; on the
         main view only — the battle setup is taller and would run into it. */
      .logo { position: fixed; top: clamp(20px, 6vh, 64px); left: clamp(16px, 5vw, 80px); width: clamp(220px, 26vw, 420px); height: auto; pointer-events: none; }
      body[data-view="battle"] .logo { display: none; }
      /* Credits: a sheet over the menu. */
      .sheet { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8, 6, 4, 0.72); }
      .sheet[hidden] { display: none; }
      .sheet > div { width: min(560px, calc(100vw - 32px)); max-height: 80vh; overflow-y: auto; padding: 18px 22px;
        background: #17120c; border: 1px solid var(--edge-hi); border-radius: 3px; font-size: 15px; line-height: 1.55; }
      .sheet h2 { margin: 0 0 10px; font-size: 14px; letter-spacing: 0.3em; text-transform: uppercase; color: #fff; }
      .sheet p { margin: 0 0 8px; color: #fff; }
      .sheet a { color: #fff; }
      @media (max-width: 720px) { .shade { background: rgba(10, 8, 5, 0.75); } main { justify-content: flex-end; padding-bottom: 40px; } }
    </style>
  </head>
  <body>
    <img class="art" src="/games/alg-rts/menu/menualg2.webp" alt="Sand &amp; Blood" />
    <!-- The dark overlay, off (you, 2026-10-11: "remove it"); its .shade style is still above. -->
    <!-- <div class="shade"></div> -->
    <div class="smoke"><i></i><i></i></div>
    <img class="logo" src="/games/alg-rts/menu/sandlogo.webp" alt="Sand &amp; Blood" />
    <main id="menu"></main>
    <div class="foot" id="foot"></div>
    <div class="sheet" id="credits" data-click hidden><div id="creditsBody"></div></div>

    <script type="module">
      import { t, LANG, LANGS, setLang } from "./i18n/i18n.js";
      import { installCursorStyle } from "./ui/cursors.js";
      document.documentElement.lang = LANG;
      // The game's own cursors from the first screen (the arrow; the hand on what takes a click).
      installCursorStyle();

      // THE SMOKE's tiles: fractal noise turned to black with the noise as its alpha (seamless:
      // stitchTiles), one broad billow layer and one finer one.
      const smokeTile = (size, freq, seed) => `url("data:image/svg+xml,${encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}"><filter id="f" x="0" y="0" width="100%" height="100%">`
        + `<feTurbulence type="fractalNoise" baseFrequency="${freq}" numOctaves="5" seed="${seed}" stitchTiles="stitch"/>`
        + `<feColorMatrix values="0 0 0 0 0.03  0 0 0 0 0.027  0 0 0 0 0.024  4.4 0 0 0 -1.2"/></filter>`
        + `<rect width="${size}" height="${size}" filter="url(#f)"/></svg>`)}")`;
      document.documentElement.style.setProperty("--smoke-a", smokeTile(900, 0.0034, 7));
      document.documentElement.style.setProperty("--smoke-b", smokeTile(450, 0.0078, 23));

      // TWO VIEWS in the one column (you, 2026-10-11: "the menu where I choose between" the sides):
      //   MAIN    Training camp · Battles · languages · credits — the same for both sides
      //   BATTLE  the map, the side (France / FLN), Start → alg.html?map=…&side=fln
      // The difficulty stays on the side's own briefing (algDifficulty.js), not asked twice here.
      // `d` (a map's blurb) is not shown (you, 2026-10-11: "we dont need it"); kept for a map card later.
      const GAME = "./alg.html";
      const TRAINING = { map: "training", title: t("Camp d'instruction"), sub: t("Instruction — 10 minutes"),
        d: t("Les bases, une à une : la caméra, les ordres, la couverture, les points, le combat, la retraite, le poste. À faire en premier.") };
      // The battle maps (layout.js ?map=; the Aurès: none). `ready: false` shows it, greyed, with its tag.
      const MAPS = [
        { map: null, ready: true, title: t("Les Aurès — 1956"), sub: t("Bataille"),
          d: t("Tenez plus de villages que le FLN dans le massif : un poste, quatre villages, une katiba qui frappe et disparaît.") },
        { map: "coast", ready: false, title: t("Côte du Constantinois — août 1955"), sub: t("Bataille"),
          d: t("La plaine et la baie de Philippeville, la veille du soulèvement."), tag: t("bientôt") },
      ];
      // The sides (algGame.js: ?side=fln, else the French).
      const SIDES = [
        { side: "fr", title: t("France"), sub: t("Tenir le poste et les villages — renforts, blindés, appui aérien") },
        { side: "fln", title: t("FLN"), sub: t("Frapper depuis la grotte et disparaître — une seule bourse, le ravitaillement") },
      ];

      // The last side and map chosen, remembered (a convenience: the menu works without it).
      const pick = { map: 0, side: "fr" };
      try { Object.assign(pick, JSON.parse(localStorage.getItem("alg-menu-pick") || "{}")); } catch { /* private window */ }
      if (!MAPS[pick.map]?.ready) pick.map = 0;
      if (!SIDES.some((s) => s.side === pick.side)) pick.side = "fr";

      const entry = (attrs, e, on = false) => `<button class="entry${on ? " sel" : ""}" ${attrs}>
          <span><b>${e.title}${e.tag && !e.ready ? `<span class="tag">${e.tag}</span>` : ""}</b>${e.sub ? `<span class="sub">${e.sub}</span>` : ""}</span>
        </button>`;
      const menu = document.getElementById("menu");
      let view = "main";
      function render() {
        document.body.dataset.view = view;
        if (view === "main") {
          menu.innerHTML = `<div class="kicker">${t("Algérie, 1954-1962")}</div>`
            + entry(`data-a="training"`, TRAINING)
            + entry(`data-a="battle"`, { title: t("Batailles"), sub: t("Choisir la carte et le camp") })
            + `<div class="row">${LANGS.map((l) => `<button class="small${l.key === LANG ? " on" : ""}" data-lang="${l.key}">${l.label}</button>`).join("")}
                 <button class="small" data-a="credits">${t("Crédits")}</button></div>`;
        } else {
          menu.innerHTML = `<div class="kicker">${t("Bataille")}</div>`
            + `<div class="h">${t("Carte")}</div>`
            + MAPS.map((m, i) => entry(`data-map="${i}" ${m.ready ? "" : "disabled"}`, { ...m, sub: "" }, i === pick.map)).join("")
            + `<div class="h">${t("Camp")}</div>`
            + SIDES.map((s) => entry(`data-side="${s.side}"`, s, s.side === pick.side)).join("")
            + `<button class="entry go" data-a="start"><b>${t("Commencer")}</b></button>`
            + `<div class="row"><button class="small" data-a="back">${t("Retour")}</button></div>`;
        }
      }
      render();
      document.getElementById("foot").textContent = t("Sand & Blood — un jeu de stratégie en temps réel. Prototype.");

      function start(map, side) {
        const q = new URLSearchParams();
        if (map) q.set("map", map);
        if (side === "fln") q.set("side", "fln");
        location.href = q.size ? `${GAME}?${q}` : GAME;
      }
      menu.addEventListener("click", (ev) => {
        const b = ev.target.closest("button");
        if (!b || b.disabled) return;
        if (b.dataset.lang) { if (b.dataset.lang !== LANG) setLang(b.dataset.lang); return; }
        const a = b.dataset.a;
        if (a === "credits") { document.getElementById("credits").hidden = false; return; }
        if (a === "training") return start(TRAINING.map, "fr");   // the training teaches the French side
        if (a === "battle") { view = "battle"; render(); return; }
        if (a === "back") { view = "main"; render(); return; }
        if (b.dataset.map) pick.map = +b.dataset.map;
        if (b.dataset.side) pick.side = b.dataset.side;
        try { localStorage.setItem("alg-menu-pick", JSON.stringify(pick)); } catch { /* private window */ }
        if (a === "start") return start(MAPS[pick.map].map, pick.side);
        render();
        menu.querySelector(`[data-map="${b.dataset.map}"], [data-side="${b.dataset.side}"]`)?.focus();
      });

      // CREDITS (the assets' own files keep the details: icons/CREDITS.md, the sounds' manifest).
      document.getElementById("creditsBody").innerHTML = `<h2>${t("Crédits")}</h2>`
        + `<p>${t("Icônes de l'interface : game-icons.net (Lorc, Delapouite, Skoll…), licence CC BY 3.0.")}</p>`
        + `<p>${t("Sons : contributeurs de freesound.org (CC0 / CC BY, la liste dans le manifeste des sons) ; voix : GameDev Market Military Voice Pack.")}</p>`
        + `<p>${t("Textures du sol et de la roche : Poly Haven et ambientCG (CC0).")}</p>`
        + `<p>${t("Moteur, cartes, unités, effets : faits pour ce jeu (three.js, WebGPU).")}</p>`
        + `<p style="color:var(--dim)">${t("Cliquez pour fermer.")}</p>`;
      document.getElementById("credits").addEventListener("click", () => { document.getElementById("credits").hidden = true; });
      addEventListener("keydown", (ev) => {
        // Enter on the battle setup, nothing focused: Start. (No button is focused for you on
        // load — Chrome draws a focused one as chosen, in brass; you, 2026-10-11: "why is
        // training camp already selected".)
        if (ev.key === "Enter" && view === "battle" && document.activeElement === document.body) {
          return start(MAPS[pick.map].map, pick.side);
        }
        if (ev.key !== "Escape") return;
        const credits = document.getElementById("credits");
        if (!credits.hidden) credits.hidden = true;
        else if (view !== "main") { view = "main"; render(); }   // Esc on the battle setup: back
      });
    </script>
  </body>
</html>
