<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- WEAPON LAB (weaponLab.js): our weapons against the gun pack, in the game's sun, shadow and
         exposure — no map, loads in seconds. -->
    <base href="/v3/" />
    <title>Weapon Lab — Sand &amp; Blood</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #16110c; }
      #game { position: fixed; inset: 0; }
      #err { position: fixed; left: 280px; top: 12px; z-index: 60; max-width: 680px; white-space: pre-wrap;
        color: #ff9a8c; font: 12px ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <pre id="err"></pre>
    <script type="module">
      try {
        const { startWeaponLab } = await import("/games/alg-rts/weaponLab.js");
        window.__WLAB = await startWeaponLab(document.getElementById("game"));
      } catch (e) {
        console.error("[weapon lab] failed to start", e);
        document.getElementById("err").textContent = e?.stack || e?.message || String(e);
      }
    </script>
  </body>
</html>
