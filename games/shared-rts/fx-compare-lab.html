<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX compare lab</title>
<link rel="icon" href="/favicon.svg">
<style>
	html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #e8dcc4; font: 12px/1.35 "Segoe UI", system-ui, sans-serif; }
	#app, #app canvas { position: absolute; inset: 0; display: block; }
	#panel { position: absolute; top: 10px; right: 10px; width: 290px; max-height: calc(100% - 20px); overflow: auto; padding: 10px 12px; background: rgba(22, 17, 12, 0.9); border-radius: 8px; }
	#panel h2 { margin: 0 0 2px; font-size: 13px; }
	#panel .src { margin: 0 0 6px; color: #a8987c; font-size: 11px; }
	#panel h3 { margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #a8987c; }
	.row { display: grid; grid-template-columns: 124px 1fr 42px; align-items: center; gap: 6px; margin: 3px 0; }
	.row input[type=range] { width: 100%; }
	.row output { text-align: right; font-variant-numeric: tabular-nums; }
	.views { display: flex; flex-wrap: wrap; gap: 4px; }
	.views button { font: inherit; color: inherit; background: #3a2e20; border: 1px solid #5a4630; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
	.views button.on { background: #6a5232; }
	.views button:hover { background: #4a3a28; }
	#status { margin: 8px 0 0; font: 11px/1.4 ui-monospace, monospace; white-space: pre-wrap; color: #cbbd9f; }
	.tag { position: absolute; pointer-events: none; color: #fff; text-shadow: 0 1px 3px #000; font-weight: 600; letter-spacing: 0.04em; transform: translate(-50%, 0); white-space: nowrap; }
</style>
</head>
<body>
<div id="app"></div>
<div id="panel">
	<h2>FX compare lab</h2>
	<p class="src">LEFT: the game's own effects (shared-rts combatFx + lit smoke, flameField — what alg-rts plays). RIGHT: the Fire Pro books baked in v3/fire-bake-lab. Same sun, same RTS camera. Nothing in the game changes.</p>
</div>
<script type="module" src="./fxCompareLab.js"></script>
</body>
</html>
