<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX timeline lab</title>
<link rel="icon" href="/favicon.svg">
<style>
	:root {
		--bg: #15120e; --panel: #1f1a14; --panel2: #2a231a; --line: #3a3024; --text: #ece2cc; --dim: #a3957a; --faint: #6f644f;
		--accent: #e3a04a; --accent2: #f6c27a; --sel: #f2c46d; --danger: #d0604c;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
	button, select, input { font: inherit; color: inherit; }
	button { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
	button:hover:not(:disabled) { background: #362d22; border-color: #4d3f2e; }
	button:disabled { opacity: 0.4; cursor: default; }
	button.on { background: #5b4426; border-color: var(--accent); color: #fff; }
	button.primary { background: #7a5424; border-color: var(--accent); color: #fff; }
	button.primary:hover { background: #8e6229; }
	button.icon { padding: 3px 7px; min-width: 28px; }
	select, input[type=text], input[type=number] { background: #120f0b; border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
	input[type=number] { width: 66px; text-align: right; font-variant-numeric: tabular-nums; }
	input[type=range] { accent-color: var(--accent); }
	kbd { font: 11px ui-monospace, monospace; background: #120f0b; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--dim); }

	#app { display: grid; height: 100%; grid-template-rows: 48px 1fr var(--tl-h, 250px); grid-template-columns: 1fr 340px; }
	/* ── top bar ── */
	#top { grid-column: 1 / 3; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
	#top .title { font-weight: 700; letter-spacing: 0.04em; color: var(--accent2); margin-right: 6px; }
	#top .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
	#fxName { width: 200px; font-weight: 600; }
	#dirty { color: var(--accent); font-size: 18px; line-height: 1; visibility: hidden; }
	#dirty.show { visibility: visible; }
	#top .spacer { flex: 1; }
	/* ── view ── */
	#view { position: relative; overflow: hidden; background: #000; }
	#view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
	#viewTips { position: absolute; left: 10px; top: 10px; padding: 6px 10px; background: rgba(21, 18, 14, 0.78); border-radius: 6px; color: var(--dim); font-size: 12px; pointer-events: none; }
	#cam { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; }
	#cam button { background: rgba(31, 26, 20, 0.85); }
	#toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); padding: 7px 14px; background: #2f2618; border: 1px solid var(--accent); border-radius: 6px; opacity: 0; transition: opacity 0.25s; pointer-events: none; }
	#toast.show { opacity: 1; }
	/* ── inspector ── */
	#insp { grid-row: 2 / 4; grid-column: 2; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 12px 14px 20px; }
	#insp h2 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
	#insp h2 .ic { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: #1a140c; font-size: 15px; }
	#insp h3 { margin: 16px 0 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
	#insp .kindHint { margin: 6px 0 0; color: var(--dim); font-size: 12px; }
	.field { margin: 8px 0; }
	.field .lab { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
	.field .lab span { cursor: help; }
	.field .lab span.mod::after { content: " •"; color: var(--accent); }
	.field .ctl { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
	.field .ctl input[type=range] { flex: 1; min-width: 0; }
	.field .unit { color: var(--faint); font-size: 11px; width: 38px; }
	.field .hint { color: var(--faint); font-size: 11px; margin-top: 2px; }
	.field select { width: 100%; }
	.field input[type=color] { width: 44px; height: 26px; padding: 0 2px; background: #120f0b; border: 1px solid var(--line); border-radius: 5px; }
	.field .own { color: var(--dim); font-size: 12px; }
	#insp .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
	#insp .empty p { color: var(--dim); margin: 8px 0; }
	#insp .keys { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font-size: 12px; color: var(--dim); }
	/* ── timeline ── */
	#tl { grid-column: 1; display: grid; grid-template-rows: 40px 22px 1fr; background: var(--panel); border-top: 1px solid var(--line); min-height: 0; position: relative; }
	#tlResize { position: absolute; left: 0; right: 0; top: -4px; height: 8px; cursor: ns-resize; z-index: 5; }
	#tlBar { display: flex; align-items: center; gap: 6px; padding: 0 10px; border-bottom: 1px solid var(--line); }
	#time { font: 600 13px ui-monospace, monospace; color: var(--accent2); min-width: 120px; }
	#tlBar .spacer { flex: 1; }
	#tlBar label { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
	#ruler, #rows { display: grid; grid-template-columns: 210px 1fr; min-height: 0; }
	#ruler .left { border-right: 1px solid var(--line); font-size: 11px; color: var(--faint); padding: 3px 8px; }
	#rulerLane { position: relative; cursor: ew-resize; background: #19150f; border-bottom: 1px solid var(--line); overflow: hidden; }
	#rulerLane .tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid #3a3024; font-size: 10px; color: var(--faint); padding-left: 3px; }
	#rulerLane .tick.minor { top: 15px; color: transparent; }
	#rows { overflow-y: auto; align-content: start; position: relative; }
	.trk { display: contents; }
	.trk .name { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 6px 0 8px; border-right: 1px solid var(--line); border-bottom: 1px solid #2a231a; cursor: pointer; }
	.trk .name .ic { width: 18px; text-align: center; }
	.trk .name .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.trk .name button { padding: 0 5px; min-width: 0; border: none; background: none; color: var(--faint); font-size: 13px; }
	.trk .name button:hover { color: var(--text); background: none; }
	.trk.sel .name { background: #2d2418; }
	.trk.off .name .nm, .trk.off .name .ic { opacity: 0.4; text-decoration: line-through; }
	.trk .lane { position: relative; height: 34px; border-bottom: 1px solid #2a231a; }
	.trk.sel .lane { background: #211b13; }
	.bar { position: absolute; top: 5px; height: 24px; border-radius: 5px; cursor: grab; display: flex; align-items: center; padding: 0 9px; font-size: 12px; color: #1a140c; font-weight: 600; white-space: nowrap; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25); }
	.bar:active { cursor: grabbing; }
	.trk.sel .bar { box-shadow: 0 0 0 2px var(--sel); }
	.trk.off .bar { opacity: 0.35; }
	.bar .edge { position: absolute; top: 0; bottom: 0; width: 8px; cursor: ew-resize; }
	.bar .edge.l { left: 0; } .bar .edge.r { right: 0; }
	.bar .edge:hover { background: rgba(255,255,255,0.35); }
	#playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #ff5b45; pointer-events: none; z-index: 4; }
	#playhead::before { content: ""; position: absolute; top: 0; left: -5px; border: 6px solid transparent; border-top-color: #ff5b45; }
	#tlEmpty { grid-column: 1 / 3; padding: 20px; color: var(--dim); text-align: center; }
	#dragTip { position: fixed; padding: 2px 7px; background: #120f0b; border: 1px solid var(--accent); border-radius: 4px; font: 11px ui-monospace, monospace; pointer-events: none; display: none; z-index: 20; }
	/* ── menus ── */
	.menu { position: fixed; z-index: 30; background: var(--panel); border: 1px solid #4d3f2e; border-radius: 8px; padding: 6px; box-shadow: 0 8px 26px rgba(0,0,0,0.5); min-width: 260px; display: none; }
	.menu .it { display: grid; grid-template-columns: 26px 1fr; gap: 2px 8px; padding: 7px 8px; border-radius: 6px; cursor: pointer; }
	.menu .it:hover { background: #2d2418; }
	.menu .it .ic { grid-row: 1 / 3; width: 24px; height: 24px; border-radius: 5px; display: grid; place-items: center; color: #1a140c; }
	.menu .it small { color: var(--dim); }
	.menu .head { padding: 4px 8px; font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.08em; }
</style>
</head>
<body>
<div id="app">
	<div id="top">
		<span class="title">FX TIMELINE</span>
		<input id="fxName" type="text" spellcheck="false" title="The effect's name (it is saved under it)">
		<span id="dirty" title="Changed since the last save">●</span>
		<button id="btnStart" title="Start from one of the ready-made effects">Start from… ▾</button>
		<button id="btnLoad" title="Open an effect you saved">Open… ▾</button>
		<button id="btnSave" class="primary" title="Save (Ctrl+S)">Save</button>
		<span class="sep"></span>
		<button id="btnUndo" class="icon" title="Undo (Ctrl+Z)">↶</button>
		<button id="btnRedo" class="icon" title="Redo (Ctrl+Y)">↷</button>
		<span class="spacer"></span>
		<button id="btnSound" title="Hear the sound layers">🔊 Sound on</button>
		<button id="btnCopy" title="Copy the effect as JSON (to paste into a game or a message)">Copy JSON</button>
	</div>
	<div id="view">
		<div id="viewTips">Drag to orbit · wheel to zoom · <kbd>Space</kbd> play / pause</div>
		<div id="toast"></div>
		<div id="cam">
			<button data-cam="rts" class="on" title="The RTS camera, as you play">RTS view</button>
			<button data-cam="close" title="Close up on the effect">Close</button>
			<button data-cam="side" title="From the side, at ground level">Side</button>
		</div>
	</div>
	<div id="insp"></div>
	<div id="tl">
		<div id="tlResize" title="Drag to resize the timeline"></div>
		<div id="tlBar">
			<button id="btnPlay" class="primary icon" title="Play / pause (Space)">▶</button>
			<button id="btnRestart" class="icon" title="From the start (Home)">⏮</button>
			<button id="btnLoop" class="on" title="Play it again and again">⟳ Repeat</button>
			<span id="time">0.00 / 0.00 s</span>
			<span class="sep" style="width:1px;height:22px;background:var(--line)"></span>
			<label>Speed
				<select id="speed" title="Slow motion: see every frame">
					<option value="1">×1</option><option value="0.5">×½</option><option value="0.25">×¼</option><option value="0.1">×0.1</option>
				</select>
			</label>
			<span class="spacer"></span>
			<label title="Snap bars to 0.05 s (hold Shift while dragging to place freely)"><input id="snap" type="checkbox" checked> Snap</label>
			<label>Zoom <input id="zoom" type="range" min="40" max="400" step="1" value="120" style="width:110px"></label>
			<button id="btnAdd" class="primary" title="Add a layer to the effect">+ Add layer</button>
		</div>
		<div id="ruler"><div class="left">LAYERS</div><div id="rulerLane"></div></div>
		<div id="rows"></div>
	</div>
</div>
<div id="menuAdd" class="menu"></div>
<div id="menuStart" class="menu"></div>
<div id="menuLoad" class="menu"></div>
<div id="dragTip"></div>
<script type="module" src="./fxTimelineLab.js"></script>
</body>
</html>
