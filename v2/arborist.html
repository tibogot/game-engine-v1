        makeDefaultCluster(false, 0, 1.5, 0),
      ];

      // Backfill shaping fields added later (independent Z radius, uniform scale,
      // ellipsoid lean) so old presets / inline defs always have them defined.
      function normalizeCluster(c) {
        if (c.rz == null) c.rz = c.rx;
        if (c.scale == null) c.scale = 1;
        if (c.leanX == null) c.leanX = 0;
        if (c.leanZ == null) c.leanZ = 0;
      }
      clusterDefs.forEach(normalizeCluster);

      // ─── UNDO / REDO ─────────────────────────────────────────────────────────────
      const undoStack = [];
      const redoStack = [];
      const MAX_UNDO = 40;

      function captureState() {
        return {
          clusters: clusterDefs.map((c) => ({ ...c })),
          material: {
            bottomColor: params.bottomColor,
            topColor: params.topColor,
            colorVar: params.colorVar,
            roughness: params.roughness,
            alphaCutoff: params.alphaCutoff,
            sssColor: params.sssColor,
            sssStr: params.sssStr,
            sssPow: params.sssPow,
            rimColor: params.rimColor,
            rimStr: params.rimStr,
            rimPow: params.rimPow,
            aoStr: params.aoStr,
            normalBias: params.normalBias,
            leafWarp: params.leafWarp,
            billboardLeaves: params.billboardLeaves,
            billboardYawOnly: params.billboardYawOnly,
          },
          wind: {
            windSpeed: params.windSpeed,
            windStr: params.windStr,
            windMicro: params.windMicro,
          },
          trunkScale: params.trunkScale,
          canopyScale: params.canopyScale,
          trunkMaterial: {
            botColor: params.trunkBotColor,
            topColor: params.trunkTopColor,
            gradHeight: params.trunkGradHeight,
            roughness: params.trunkRoughness,
            useGlb: params.useGlbTrunkMat,
          },
          bushMode: params.bushMode,
        };
      }

      // Swap loaded trunks between the procedural bark material and their own GLB
      // material, per params.useGlbTrunkMat. defaultTrunk has no GLB material, so it
      // always keeps the procedural one.
      function applyTrunkMatChoice() {
        const useGlb = params.useGlbTrunkMat;
        [trunkRoot, trunkLod1Root].forEach((root) => {
          if (!root) return;
          root.traverse((o) => {
            if (o.isMesh) {
              o.material =
                useGlb && o.userData.origMat ? o.userData.origMat : trunkMat;
            }
          });
        });
      }

      function applyTrunkMaterial(tm) {
        if (!tm) return;
        if (tm.useGlb != null) params.useGlbTrunkMat = tm.useGlb;
        if (tm.botColor != null) {
          params.trunkBotColor = tm.botColor;
          uTrunkBot.value.set(tm.botColor);
        }
        if (tm.topColor != null) {
          params.trunkTopColor = tm.topColor;
          uTrunkTop.value.set(tm.topColor);
        }
        if (tm.gradHeight != null) {
          params.trunkGradHeight = tm.gradHeight;
          uTrunkGradH.value = tm.gradHeight;
        }
        if (tm.roughness != null) {
          params.trunkRoughness = tm.roughness;
          uTrunkRough.value = tm.roughness;
        }
        applyTrunkMatChoice();
      }

      function restoreState(state) {
        state.clusters.forEach((c, i) => {
          if (i < clusterDefs.length) {
            Object.assign(clusterDefs[i], c);
            normalizeCluster(clusterDefs[i]);
          }
        });
        if (state.canopyScale != null) params.canopyScale = state.canopyScale;
        applyTrunkMaterial(state.trunkMaterial);
        if (state.material) {
          const m = state.material;
          params.bottomColor = m.bottomColor;
          uBottomColor.value.set(m.bottomColor);
          params.topColor = m.topColor;
          uTopColor.value.set(m.topColor);
          params.colorVar = m.colorVar;
          uColorVar.value = m.colorVar;
          params.roughness = m.roughness;
          leafMat.roughness = m.roughness;
          params.alphaCutoff = m.alphaCutoff;
          uAlphaCutoff.value = m.alphaCutoff;
          params.sssColor = m.sssColor;
          uSssColor.value.set(m.sssColor);
          params.sssStr = m.sssStr;
          uSssStr.value = m.sssStr;
          params.sssPow = m.sssPow;
          uSssPow.value = m.sssPow;
          params.rimColor = m.rimColor;
          uRimColor.value.set(m.rimColor);
          params.rimStr = m.rimStr;
          uRimStr.value = m.rimStr;
          params.rimPow = m.rimPow;
          uRimPow.value = m.rimPow;
          params.aoStr = m.aoStr;
          uAoStr.value = m.aoStr;
          if (m.normalBias != null) {
            params.normalBias = m.normalBias;
            uNormalBias.value = m.normalBias;
          }
          if (m.leafWarp != null) {
            params.leafWarp = m.leafWarp;
            uLeafWarp.value = m.leafWarp;
          }
          if (m.billboardLeaves != null) {
            params.billboardLeaves = m.billboardLeaves;
            uBillboard.value = m.billboardLeaves ? 1.0 : 0.0;
          }
          if (m.billboardYawOnly != null) {
            params.billboardYawOnly = m.billboardYawOnly;
            uBillboardYaw.value = m.billboardYawOnly ? 1.0 : 0.0;
          }
        }
        if (state.wind) {
          params.windSpeed = state.wind.windSpeed;
          uWindSpeed.value = state.wind.windSpeed;
          params.windStr = state.wind.windStr;
          uWindStr.value = state.wind.windStr;
          params.windMicro = state.wind.windMicro;
          uWindMicro.value = state.wind.windMicro;
        }
        if (state.trunkScale != null) {
          params.trunkScale = state.trunkScale;
          trunkScale = state.trunkScale;
          (trunkRoot || defaultTrunk).scale.setScalar(state.trunkScale);
        }
        if (state.bushMode != null) {
          params.bushMode = state.bushMode;
          defaultTrunk.visible = !state.bushMode && !trunkRoot;
          if (trunkRoot) trunkRoot.visible = !state.bushMode;
        }
        uiRefresh();
        buildFoliage(true);
      }

      function pushUndo() {
        undoStack.push(captureState());
        if (undoStack.length > MAX_UNDO) undoStack.shift();
        redoStack.length = 0;
      }

      function undo() {
        if (undoStack.length === 0) return;
        redoStack.push(captureState());
        restoreState(undoStack.pop());
        infoEl.textContent = `Undo (${undoStack.length} left)`;
      }

      function redo() {
        if (redoStack.length === 0) return;
        undoStack.push(captureState());
        restoreState(redoStack.pop());
        infoEl.textContent = `Redo (${redoStack.length} left)`;
      }

      window.addEventListener("keydown", (e) => {
        if (e.ctrlKey && e.key === "z") {
          e.preventDefault();
          undo();
        }
        if (e.ctrlKey && e.key === "y") {
          e.preventDefault();
          redo();
        }
      });

      let _undoTimer = null;
      function scheduleUndo() {
        if (_undoTimer) clearTimeout(_undoTimer);
        _undoTimer = setTimeout(() => {
          pushUndo();
          _undoTimer = null;
        }, 400);
      }

      // ─── DETERMINISTIC RNG ──────────────────────────────────────────────────────
      // LCG matching v2/core/foliage/foliageSampler.js exactly. The aRand and
      // per-leaf jitter use the SAME fixed seeds as v2 (77777 and 42) so that
      // the JSON preset reproduces the same tree in arborist and v2.
      function createLcg(seed) {
        let s = (seed * 1664525 + 1013904223) >>> 0;
        return () => {
          s = (s * 1664525 + 1013904223) >>> 0;
          return s / 0xffffffff;
        };
      }

      // ─── ELLIPSOID SAMPLER ───────────────────────────────────────────────────────
      const _leanEuler = new THREE.Euler();
      const _leanQuat = new THREE.Quaternion();
      const _leanVec = new THREE.Vector3();
      const SAMPLE_DEG2RAD = Math.PI / 180;

      function sampleCluster(c, seedOffset) {
        let lcg = (seedOffset * 1664525 + 1013904223) >>> 0;
        const rng = () => {
          lcg = (lcg * 1664525 + 1013904223) >>> 0;
          return lcg / 0xffffffff;
        };

        // Uniform size multiplier: per-cluster scale x global canopy scale.
        const cs = (c.scale ?? 1) * (params.canopyScale ?? 1);
        const effRx = c.rx * cs;
        const effRy = c.ry * cs;
        const effRz = (c.rz ?? c.rx) * cs;
        // Ellipsoid lean (orientation): rotate each sampled offset before adding
        // the cluster center, so the whole blob tilts off vertical.
        const leanX = (c.leanX ?? 0) * SAMPLE_DEG2RAD;
        const leanZ = (c.leanZ ?? 0) * SAMPLE_DEG2RAD;
        const hasLean = leanX !== 0 || leanZ !== 0;
        if (hasLean) {
          _leanEuler.set(leanX, 0, leanZ, "XYZ");
          _leanQuat.setFromEuler(_leanEuler);
        }

        const positions = [];
        const maxTry = c.count * 12;
        let tries = 0;

        // NOTE: rng() draw order (ux, uy, uz, then shell) is unchanged from the
        // original so the per-leaf rand/jitter stream stays aligned with v2's
        // foliageSampler. The new scale/rz/lean only transform the POSITION.
        while (positions.length < c.count && tries++ < maxTry) {
          const ux = rng() * 2 - 1;
          const uy = rng() * 2 - 1;
          const uz = rng() * 2 - 1;
          const d = Math.sqrt(ux * ux + uy * uy + uz * uz);
          if (d > 1.0) continue;
          const innerR = 1.0 - c.shellThick;
          if (d < innerR && rng() < c.shell) continue;

          let ox = ux * effRx;
          let oy = uy * effRy;
          let oz = uz * effRz;
          if (hasLean) {
            _leanVec.set(ox, oy, oz).applyQuaternion(_leanQuat);
            ox = _leanVec.x;
            oy = _leanVec.y;
            oz = _leanVec.z;
          }

          positions.push({
            x: c.x + ox,
            y: c.y + oy,
            z: c.z + oz,
            leafSize: c.leafSize,
            scaleVar: c.scaleVar,
            tiltMax: c.tiltMax,
          });
        }
        return positions;
      }

      // ─── FOLIAGE MESH BUILDER ────────────────────────────────────────────────────
      let leavesMesh = null;

      function sampleAllPositions() {
        const allPos = [];
        const allRands = [];
        // 4 jitter values per leaf, in v2's consumption order: [rotY01, tiltX01, tiltZ01, scale01].
        // Pre-computed so LOD0/LOD1/LOD2 share identical per-leaf jitter for the same leaf index.
        const allJitter = [];
        // First pass: positions + aRand. Mirrors v2/foliageSampler.sampleAllClusters().
        const randRng = createLcg(77777);
        clusterDefs.forEach((c, ci) => {
          if (!c.enabled) return;
          sampleCluster(c, ci * 999983 + 12345).forEach((p) => {
            allPos.push(p);
            allRands.push(randRng(), randRng());
          });
        });
        // Second pass: per-leaf jitter. Mirrors v2/foliageSampler.buildAllFoliageLods().
        const jitterRng = createLcg(42);
        for (let i = 0; i < allPos.length; i++) {
          allJitter.push(jitterRng(), jitterRng(), jitterRng(), jitterRng());
        }
        return { allPos, allRands, allJitter };
      }

      function buildLeafMesh(positions, rands, jitter, scaleMul, xOffset) {
        const n = positions.length;
        if (n === 0) return null;

        const useBillboard = params.billboardLeaves;

        const geo = new THREE.PlaneGeometry(1, 1);
        const randData = new Float32Array(rands);
        geo.setAttribute(
          "aRand",
          new THREE.InstancedBufferAttribute(randData, 2),
        );
        const scaleData = new Float32Array(n);
        for (let i = 0; i < n; i++) scaleData[i] = 1;
        geo.setAttribute(
          "aLeafScale",
          new THREE.InstancedBufferAttribute(scaleData, 1),
        );

        const centerData = new Float32Array(n * 3);
        for (let i = 0; i < n; i++) {
          const p = positions[i];
          centerData[i * 3] = p.x + xOffset;
          centerData[i * 3 + 1] = p.y;
          centerData[i * 3 + 2] = p.z;
        }
        geo.setAttribute(
          "aLeafCenter",
          new THREE.InstancedBufferAttribute(centerData, 3),
        );

        // Per-leaf atlas cell (one preset/tree = one cell here; per-tree-type in v2).
        const idxData = new Float32Array(n).fill(atlasCellIndex);
        geo.setAttribute(
          "aAtlasIndex",
          new THREE.InstancedBufferAttribute(idxData, 1),
        );

        const mesh = new THREE.InstancedMesh(geo, leafMat, n);
        mesh.frustumCulled = false;
        mesh.castShadow = true;
        mesh.receiveShadow = false;

        const dummy = new THREE.Object3D();
        const DEG2RAD = Math.PI / 180;

        positions.forEach((p, i) => {
          // Jitter consumption order matches v2/foliageSampler.buildAllFoliageLods:
          // j0 = rotY, j1 = tiltX, j2 = tiltZ, j3 = scale.
          const j0 = jitter[i * 4];
          const j1 = jitter[i * 4 + 1];
          const j2 = jitter[i * 4 + 2];
          const j3 = jitter[i * 4 + 3];
          dummy.position.set(p.x + xOffset, p.y, p.z);
          const s = Math.max(
            0.05,
            p.leafSize * scaleMul * (1 + (j3 - 0.5) * 2 * p.scaleVar),
          );
          if (useBillboard) {
            dummy.rotation.set(0, 0, 0);
            dummy.scale.set(1, 1, 1);
            scaleData[i] = s;
          } else {
            dummy.rotation.order = "YXZ";
            dummy.rotation.y = j0 * Math.PI * 2;
            dummy.rotation.x = (j1 - 0.5) * p.tiltMax * DEG2RAD * 2;
            dummy.rotation.z = (j2 - 0.5) * p.tiltMax * DEG2RAD * 2;
            dummy.scale.setScalar(s);
            scaleData[i] = 1;
          }
          dummy.updateMatrix();
          mesh.setMatrixAt(i, dummy.matrix);
        });

        geo.attributes.aLeafScale.needsUpdate = true;
        mesh.instanceMatrix.needsUpdate = true;
        return mesh;
      }

      function buildFoliage(skipUndo) {
        uBillboard.value = params.billboardLeaves ? 1.0 : 0.0;
        uBillboardYaw.value = params.billboardYawOnly ? 1.0 : 0.0;

        // Clean up main foliage
        if (leavesMesh) {
          scene.remove(leavesMesh);
          leavesMesh.geometry.dispose();
          leavesMesh = null;
        }
        // Clean up LOD previews
        clearLodPreviews();

        const { allPos, allRands, allJitter } = sampleAllPositions();
        const n = allPos.length;

        if (n > 0) {
          // Compute bounds for shaders
          let yMin = Infinity,
            yMax = -Infinity;
          let xMin = Infinity,
            xMax = -Infinity,
            zMin = Infinity,
            zMax = -Infinity;
          allPos.forEach((p) => {
            if (p.y < yMin) yMin = p.y;
            if (p.y > yMax) yMax = p.y;
            if (p.x < xMin) xMin = p.x;
            if (p.x > xMax) xMax = p.x;
            if (p.z < zMin) zMin = p.z;
            if (p.z > zMax) zMax = p.z;
          });
          uYMin.value = yMin - 0.3;
          uYMax.value = yMax + 0.5;
          // Canopy center + radius for sphere normals and sphere AO
          const cx = (xMin + xMax) * 0.5;
          const cy = (yMin + yMax) * 0.5;
          const cz = (zMin + zMax) * 0.5;
          uCanopyCenter.value.set(cx, cy, cz);
          const ext = Math.max(xMax - xMin, yMax - yMin, zMax - zMin);
          uAoRadius.value = ext * 0.62;

          // Build main tree (LOD0) — at origin or offset if LOD preview
          const xOff = lodPreview ? -LOD_SPACING : 0;
          leavesMesh = buildLeafMesh(allPos, allRands, allJitter, 1.0, xOff);
          if (leavesMesh) scene.add(leavesMesh);

          // Build LOD previews if active
          if (lodPreview) {
            buildLodPreviews(allPos, allRands, allJitter);
          }
        }

        updateStats();
        updateClusterHelpers();
        updateLodTrunkVisibility();
      }

      // ─── LOD PREVIEW SYSTEM ─────────────────────────────────────────────────────
      let lodPreview = false;
      let lodMesh1 = null;
      let lodMesh2 = null;
      let lodTrunk0Clone = null;
      let lodTrunk1Clone = null;
      let lodTrunk2Clone = null;

      const lodGroundLabels = [];

      function lodLabelRoundRect(ctx, x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.arcTo(x + w, y, x + w, y + h, rr);
        ctx.arcTo(x + w, y + h, x, y + h, rr);
        ctx.arcTo(x, y + h, x, y, rr);
        ctx.arcTo(x, y, x + w, y, rr);
        ctx.closePath();
      }

      function createLodGroundLabel() {
        const canvas = document.createElement("canvas");
        const W = 640;
        const H = 176;
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext("2d");
        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        const mat = new THREE.MeshBasicMaterial({
          map: tex,
          transparent: true,
          depthWrite: false,
          toneMapped: false,
        });
        const geo = new THREE.PlaneGeometry(5.8, 1.6);
        geo.rotateX(-Math.PI / 2);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.renderOrder = 25;
        const label = { mesh, canvas, ctx, tex, W, H };
        label.redraw = (title, sub) => {
          const { ctx, tex, W, H } = label;
          ctx.clearRect(0, 0, W, H);
          lodLabelRoundRect(ctx, 8, 8, W - 16, H - 16, 14);
          ctx.fillStyle = "rgba(12, 18, 12, 0.9)";
          ctx.fill();
          ctx.strokeStyle = "rgba(100, 160, 95, 0.5)";
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.fillStyle = "#e8f0e4";
          ctx.font = "bold 26px Segoe UI, system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(title, W / 2, 56);
          ctx.fillStyle = "#9cb090";
          ctx.font = "17px Consolas, monospace";
          ctx.fillText(sub, W / 2, 112);
          tex.needsUpdate = true;
        };
        return label;
      }

      function ensureLodGroundLabels() {
        if (lodGroundLabels.length) return;
        for (let i = 0; i < 3; i++) {
          const lb = createLodGroundLabel();
          lodGroundLabels.push(lb);
          scene.add(lb.mesh);
          lb.mesh.visible = false;
        }
      }

      function setLodGroundLabelsVisible(visible) {
        ensureLodGroundLabels();
        lodGroundLabels.forEach((lb) => {
          lb.mesh.visible = visible;
        });
      }

      function decimatePositions(allPos, allRands, allJitter, keep) {
        const subPos = [];
        const subRands = [];
        const subJitter = [];
        const step = Math.max(1, Math.round(1 / keep));
        for (let i = 0; i < allPos.length; i += step) {
          subPos.push(allPos[i]);
          subRands.push(allRands[i * 2], allRands[i * 2 + 1]);
          subJitter.push(
            allJitter[i * 4],
            allJitter[i * 4 + 1],
            allJitter[i * 4 + 2],
            allJitter[i * 4 + 3],
          );
        }
        return { subPos, subRands, subJitter };
      }

      function buildLodPreviews(allPos, allRands, allJitter) {
        // LOD1: 50% leaves, 1.414× bigger
        const lod1 = decimatePositions(allPos, allRands, allJitter, 0.5);
        lodMesh1 = buildLeafMesh(
          lod1.subPos,
          lod1.subRands,
          lod1.subJitter,
          1.414,
          0,
        );
        if (lodMesh1) scene.add(lodMesh1);

        // LOD2: 25% leaves, 2× bigger
        const lod2 = decimatePositions(allPos, allRands, allJitter, 0.25);
        lodMesh2 = buildLeafMesh(
          lod2.subPos,
          lod2.subRands,
          lod2.subJitter,
          2.0,
          LOD_SPACING,
        );
        if (lodMesh2) scene.add(lodMesh2);

        // Update stats
        params.lod1Leaves = lod1.subPos.length;
        params.lod2Leaves = lod2.subPos.length;

        // Clone trunks for LOD preview columns
        cloneTrunksForLod();

        updateLodLabels();
      }

      function cloneTrunksForLod() {
        clearLodTrunkClones();

        const srcTrunk = trunkRoot || defaultTrunk;
        const showTrunk = !params.bushMode;

        // LOD0 trunk (left)
        if (showTrunk) {
          lodTrunk0Clone = srcTrunk.clone();
          lodTrunk0Clone.visible = true;
          lodTrunk0Clone.position.x = -LOD_SPACING;
          if (srcTrunk === defaultTrunk) lodTrunk0Clone.position.y = 2.5;
          lodTrunk0Clone.scale.setScalar(trunkScale);
          scene.add(lodTrunk0Clone);
        }

        // LOD1 trunk (center) — use LOD1 trunk if loaded, else same as LOD0
        if (showTrunk) {
          const src1 = trunkLod1Root || srcTrunk;
          lodTrunk1Clone = src1.clone();
          lodTrunk1Clone.visible = true;
          lodTrunk1Clone.position.x = 0;
          if (src1 === defaultTrunk) lodTrunk1Clone.position.y = 2.5;
          lodTrunk1Clone.scale.setScalar(trunkScale);
          scene.add(lodTrunk1Clone);
        }

        // LOD2 trunk (right) — always use LOD1 trunk (lowest detail)
        if (showTrunk) {
          const src2 = trunkLod1Root || srcTrunk;
          lodTrunk2Clone = src2.clone();
          lodTrunk2Clone.visible = true;
          lodTrunk2Clone.position.x = LOD_SPACING;
          if (src2 === defaultTrunk) lodTrunk2Clone.position.y = 2.5;
          lodTrunk2Clone.scale.setScalar(trunkScale);
          scene.add(lodTrunk2Clone);
        }
      }

      function clearLodTrunkClones() {
        if (lodTrunk0Clone) {
          scene.remove(lodTrunk0Clone);
          lodTrunk0Clone = null;
        }
        if (lodTrunk1Clone) {
          scene.remove(lodTrunk1Clone);
          lodTrunk1Clone = null;
        }
        if (lodTrunk2Clone) {
          scene.remove(lodTrunk2Clone);
          lodTrunk2Clone = null;
        }
      }

      function clearLodPreviews() {
        if (lodMesh1) {
          scene.remove(lodMesh1);
          lodMesh1.geometry.dispose();
          lodMesh1 = null;
        }
        if (lodMesh2) {
          scene.remove(lodMesh2);
          lodMesh2.geometry.dispose();
          lodMesh2 = null;
        }
        clearLodTrunkClones();
      }

      function updateLodTrunkVisibility() {
        if (lodPreview) {
          // Hide main trunk in LOD preview (clones handle it)
          defaultTrunk.visible = false;
          if (trunkRoot) trunkRoot.visible = false;
        } else {
          defaultTrunk.visible = !params.bushMode && !trunkRoot;
          if (trunkRoot) trunkRoot.visible = !params.bushMode;
        }
      }

      function updateLodLabels() {
        ensureLodGroundLabels();
        if (!lodPreview) {
          setLodGroundLabelsVisible(false);
          return;
        }

        const offsets = [-LOD_SPACING, 0, LOD_SPACING];
        const n0 = leavesMesh ? leavesMesh.count : 0;
        const n1 = params.lod1Leaves || 0;
        const n2 = params.lod2Leaves || 0;
        const trunkLod1Str = trunkLod1Root ? "LOD1 trunk" : "same trunk";
        const titles = [
          "LOD 0 — Full Detail",
          "LOD 1 — Half Density",
          "LOD 2 — Quarter Density",
        ];
        const subs = [
          `${n0} leaves · < ${params.lodDist1}m · full trunk`,
          `${n1} leaves · 1.4× size · ${params.lodDist1}-${params.lodDist2}m · ${trunkLod1Str}`,
          `${n2} leaves · 2× size · ${params.lodDist2}m+ · ${trunkLod1Str}`,
        ];

        offsets.forEach((xOff, i) => {
          lodGroundLabels[i].mesh.position.set(xOff, 0.02, LOD_LABEL_Z);
          lodGroundLabels[i].redraw(titles[i], subs[i]);
        });
        setLodGroundLabelsVisible(true);
      }

      function toggleLodPreview(on) {
        lodPreview = on;
        if (on) {
          // Shift + back off when an impostor 4th column is present.
          const cx = impostorMesh ? LOD_SPACING * 0.9 : 0;
          controls.target.set(cx, 3, 0);
          camera.position.set(cx, 6, impostorMesh ? 32 : 22);
          controls.update();
        } else {
          controls.target.set(0, 3, 0);
          camera.position.set(7, 5, 10);
          controls.update();
        }
        buildFoliage(true);
        updateLodLabels();
      }

      // ─── CLUSTER WIREFRAME HELPERS ───────────────────────────────────────────────
      const HELPER_COLORS = [
        0xffff00, 0x00ffff, 0xff8800, 0xff44ff, 0x44ff44, 0x4488ff,
      ];
      let showHelpers = false;

      const clusterHelpers = clusterDefs.map((c, i) => {
        const sGeo = new THREE.SphereGeometry(1, 14, 7);
        const wfGeo = new THREE.WireframeGeometry(sGeo);
        const line = new THREE.LineSegments(
          wfGeo,
          new THREE.LineBasicMaterial({
            color: HELPER_COLORS[i % HELPER_COLORS.length],
            transparent: true,
            opacity: 0.22,
          }),
        );
        scene.add(line);
        return line;
      });

      const markerGeo = new THREE.SphereGeometry(0.18, 8, 6);
      const clusterMarkers = clusterDefs.map((c, i) => {
        const mat = new THREE.MeshBasicMaterial({
          color: HELPER_COLORS[i % HELPER_COLORS.length],
          transparent: true,
          opacity: 0.6,
        });
        const mesh = new THREE.Mesh(markerGeo, mat);
        mesh.userData.clusterIdx = i;
        scene.add(mesh);
        return mesh;
      });

      function updateClusterHelpers() {
        const xOff = lodPreview ? -LOD_SPACING : 0;
        const DEG2RAD = Math.PI / 180;
        clusterDefs.forEach((c, i) => {
          const cs = (c.scale ?? 1) * (params.canopyScale ?? 1);
          clusterHelpers[i].position.set(c.x + xOff, c.y, c.z);
          clusterHelpers[i].scale.set(
            c.rx * cs,
            c.ry * cs,
            (c.rz ?? c.rx) * cs,
          );
          clusterHelpers[i].rotation.set(
            (c.leanX ?? 0) * DEG2RAD,
            0,
            (c.leanZ ?? 0) * DEG2RAD,
          );
          clusterHelpers[i].visible = showHelpers && c.enabled;
          clusterMarkers[i].position.set(c.x + xOff, c.y, c.z);
          clusterMarkers[i].visible = showHelpers && c.enabled;
        });
      }
      // NOTE: do NOT call updateClusterHelpers() here — it reads params.canopyScale,
      // and `params` is a const declared further down (TDZ). The initial build runs
      // it after params exists (buildFoliage -> updateClusterHelpers), and helpers
      // are hidden by default, so positioning before then isn't needed.

      // ─── DRAG CLUSTER MARKERS ────────────────────────────────────────────────────
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      let dragCluster = -1;
      let dragPlane = new THREE.Plane();
      let dragOffset = new THREE.Vector3();
      const _intersect = new THREE.Vector3();

      renderer.domElement.addEventListener("pointerdown", (e) => {
        if (e.button !== 0 || !showHelpers) return;
        mouse.x = (e.clientX / innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const hits = raycaster.intersectObjects(
          clusterMarkers.filter((m, i) => clusterDefs[i].enabled),
        );
        if (hits.length > 0) {
          const idx = hits[0].object.userData.clusterIdx;
          dragCluster = idx;
          pushUndo();
          controls.enabled = false;
          dragPlane.setFromNormalAndCoplanarPoint(
            camera.getWorldDirection(new THREE.Vector3()).negate(),
            hits[0].object.position,
          );
          raycaster.ray.intersectPlane(dragPlane, _intersect);
          dragOffset.copy(hits[0].object.position).sub(_intersect);
          e.stopPropagation();
        }
      });

      renderer.domElement.addEventListener("pointermove", (e) => {
        if (dragCluster < 0) return;
        mouse.x = (e.clientX / innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        if (raycaster.ray.intersectPlane(dragPlane, _intersect)) {
          _intersect.add(dragOffset);
          const xOff = lodPreview ? -LOD_SPACING : 0;
          const c = clusterDefs[dragCluster];
          c.x = Math.round((_intersect.x - xOff) * 20) / 20;
          c.y = Math.max(0, Math.round(_intersect.y * 20) / 20);
          c.z = Math.round(_intersect.z * 20) / 20;
          buildFoliage(true);
          uiRefresh();
        }
      });

      renderer.domElement.addEventListener("pointerup", () => {
        if (dragCluster >= 0) {
          dragCluster = -1;
          controls.enabled = true;
        }
      });

      // ─── TRUNK GLB LOADER ────────────────────────────────────────────────────────
      // Add entries here when you drop new GLBs into public/models/trunks/.
      const TRUNK_DIR = "models/trunks/";
      const TRUNK_MODELS = [
        { name: "Custom Tree 3", file: "customtree3_compressed.glb" },
        { name: "Trees 6", file: "TREES6_compressed.glb" },
        { name: "Seed 2279", file: "trunk_seed2279.glb" },
      ];

      function trunkUrl(fileName) {
        return resolvePublicPath(TRUNK_DIR + fileName);
      }

      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath(
        "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/libs/draco/",
      );
      const gltfLoader = new GLTFLoader();
      gltfLoader.setDRACOLoader(dracoLoader);
      let trunkScale = 1.0;
      let trunkFileName = "";
      let trunkLod1FileName = "";
      let trunkPickerBtns = [];
      const trunkGlbCache = new Map();
      let _bushYShift = 0;

      function cacheTrunkTemplate(file, scene) {
        if (!trunkGlbCache.has(file)) trunkGlbCache.set(file, scene);
      }

      function cloneTrunkTemplate(file) {
        const template = trunkGlbCache.get(file);
        if (!template) return null;
        const clone = template.clone(true);
        applyTrunkMeshes(clone, false);
        return clone;
      }

      function applyTrunkLod0(gltf, displayName) {
        if (trunkRoot) scene.remove(trunkRoot);
        defaultTrunk.visible = false;
        trunkRoot = gltf.scene;
        trunkRoot.scale.setScalar(trunkScale);
        trunkRoot.visible = !params.bushMode && !lodPreview;
        applyTrunkMeshes(trunkRoot, params.useGlbTrunkMat);
        scene.add(trunkRoot);

        trunkFileName = displayName;

        const box = new THREE.Box3().setFromObject(trunkRoot);
        const h = box.max.y - box.min.y;
        let tris = 0;
        trunkRoot.traverse((o) => {
          if (o.isMesh && o.geometry.index)
            tris += o.geometry.index.count / 3;
        });
        params.trunkTris = Math.round(tris);

        infoEl.textContent =
          `Trunk LOD0: ${displayName} — ${tris} tris, height: ${h.toFixed(2)}  |  ` +
          `Tip Y ≈ ${box.max.y.toFixed(2)}  |  ` +
          `Suggested Cluster 1 Y: ${(box.max.y * 0.85).toFixed(2)}`;

        updateTrunkPickerSelection();
        if (lodPreview) buildFoliage(true);
        uiRefresh();
      }

      function applyTrunkLod1(gltf, displayName) {
        if (trunkLod1Root) scene.remove(trunkLod1Root);
        trunkLod1Root = gltf.scene;
        trunkLod1Root.scale.setScalar(trunkScale);
        trunkLod1Root.visible = false;
        applyTrunkMeshes(trunkLod1Root, params.useGlbTrunkMat);

        trunkLod1FileName = displayName;

        let tris = 0;
        trunkLod1Root.traverse((o) => {
          if (o.isMesh && o.geometry.index)
            tris += o.geometry.index.count / 3;
        });
        params.trunkLod1Tris = Math.round(tris);

        infoEl.textContent = `Trunk LOD1: ${displayName} — ${tris} tris (${((tris / Math.max(1, params.trunkTris)) * 100).toFixed(0)}% of LOD0)`;

        if (lodPreview) buildFoliage(true);
        uiRefresh();
      }

      function applyTrunkMeshes(root, useGlbMat) {
        root.traverse((o) => {
          if (o.isMesh) {
            o.castShadow = true;
            o.receiveShadow = true;
            o.userData.origMat = o.material;
            o.material = useGlbMat ? o.userData.origMat : trunkMat;
          }
        });
      }

      function updateTrunkPickerSelection() {
        trunkPickerBtns.forEach(({ file, img }) => {
          const active = file
            ? file === trunkFileName
            : !trunkFileName && !trunkRoot;
          img.classList.toggle("active", active);
        });
      }

      function resetToDefaultTrunk() {
        if (trunkRoot) {
          scene.remove(trunkRoot);
          trunkRoot = null;
        }
        if (trunkLod1Root) {
          scene.remove(trunkLod1Root);
          trunkLod1Root = null;
        }
        defaultTrunk.visible = !params.bushMode && !lodPreview;
        trunkFileName = "";
        trunkLod1FileName = "";
        params.trunkTris = 0;
        params.trunkLod1Tris = 0;
        updateTrunkPickerSelection();
        if (lodPreview) buildFoliage(true);
        uiRefresh();
        infoEl.textContent = "Trunk reset to default cylinder";
      }

      function loadBuiltInTrunk(model, { undo = true } = {}) {
        if (undo) pushUndo();
        const cached = trunkGlbCache.get(model.file);
        if (cached) {
          applyTrunkLod0({ scene: cached.clone(true) }, model.file);
          return;
        }
        gltfLoader.load(
          trunkUrl(model.file),
          (gltf) => {
            cacheTrunkTemplate(model.file, gltf.scene);
            applyTrunkLod0({ scene: gltf.scene.clone(true) }, model.file);
          },
          undefined,
          (err) => {
            console.error("Built-in trunk load error:", model.file, err);
            infoEl.textContent = `Could not load trunk: ${model.file}`;
          },
        );
      }

      function loadTrunkByFileName(fileName) {
        const model = TRUNK_MODELS.find((m) => m.file === fileName);
        if (model) {
          loadBuiltInTrunk(model, { undo: false });
          return;
        }
        if (trunkGlbCache.has(fileName)) {
          applyTrunkLod0(
            { scene: trunkGlbCache.get(fileName).clone(true) },
            fileName,
          );
          return;
        }
        gltfLoader.load(
          trunkUrl(fileName),
          (gltf) => {
            cacheTrunkTemplate(fileName, gltf.scene);
            applyTrunkLod0({ scene: gltf.scene.clone(true) }, fileName);
          },
          undefined,
          (err) => {
            console.error("Trunk load error:", fileName, err);
            infoEl.textContent = `Could not load trunk: ${fileName}`;
          },
        );
      }

      function loadTrunkLod1ByFileName(fileName) {
        gltfLoader.load(
          trunkUrl(fileName),
          (gltf) => applyTrunkLod1(gltf, fileName),
          undefined,
          (err) => console.error("Trunk LOD1 load error:", fileName, err),
        );
      }

      function buildTrunkPicker(parent) {
        const label = document.createElement("div");
        label.className = "tex-gallery-label";
        label.textContent = "Built-in trunks";
        parent.appendChild(label);

        const gallery = document.createElement("div");
        gallery.className = "tex-gallery trunk-gallery";
        parent.appendChild(gallery);

        trunkPickerBtns = [];

        const addItem = (file, name, onClick) => {
          const wrap = document.createElement("div");
          wrap.className = "tex-item";
          const img = document.createElement("img");
          img.alt = name;
          img.title = name;
          img.draggable = false;
          img.addEventListener("click", onClick);
          wrap.appendChild(img);
          const cap = document.createElement("div");
          cap.className = "tex-label";
          cap.textContent = name;
          wrap.appendChild(cap);
          gallery.appendChild(wrap);
          trunkPickerBtns.push({ file, img, cap });
        };

        addItem("", "Cylinder", () => {
          pushUndo();
          resetToDefaultTrunk();
        });

        TRUNK_MODELS.forEach((model) => {
          addItem(model.file, model.name, () => loadBuiltInTrunk(model));
        });

        updateTrunkPickerSelection();
      }

      async function preloadTrunkGlbs() {
        await Promise.all(
          TRUNK_MODELS.map(
            (model) =>
              new Promise((resolve) => {
                if (trunkGlbCache.has(model.file)) {
                  resolve();
                  return;
                }
                gltfLoader.load(
                  trunkUrl(model.file),
                  (gltf) => {
                    cacheTrunkTemplate(model.file, gltf.scene);
                    resolve();
                  },
                  undefined,
                  (err) => {
                    console.warn("[Arborist] trunk preload failed:", model.file, err);
                    resolve();
                  },
                );
              }),
          ),
        );
      }

      async function bakeTrunkPickerThumbnails() {
        const items = [
          {
            key: "",
            make: () => {
              const m = defaultTrunk.clone();
              m.position.set(0, 0, 0);
              return m;
            },
          },
          ...TRUNK_MODELS.map((model) => ({
            key: model.file,
            make: () => cloneTrunkTemplate(model.file) ?? new THREE.Group(),
          })),
        ];

        const thumbs = await bakeObjectThumbnails({
          renderer,
          items,
          environment: scene.environment,
          environmentIntensity: scene.environmentIntensity ?? 0.35,
          size: 256,
          fill: 0.9,
        });

        trunkPickerBtns.forEach(({ file, img }) => {
          const url = thumbs.get(file);
          if (url) img.src = url;
        });
      }

      function loadTrunk(file) {
        pushUndo();
        const url = URL.createObjectURL(file);
        gltfLoader.load(
          url,
          (gltf) => {
            applyTrunkLod0(gltf, file.name);
            URL.revokeObjectURL(url);
          },
          undefined,
          (err) => {
            URL.revokeObjectURL(url);
            console.error("Trunk load error:", err);
          },
        );
      }

      function loadTrunkLod1(file) {
        const url = URL.createObjectURL(file);
        gltfLoader.load(
          url,
          (gltf) => {
            applyTrunkLod1(gltf, file.name);
            URL.revokeObjectURL(url);
          },
          undefined,
          (err) => {
            URL.revokeObjectURL(url);
            console.error("Trunk LOD1 load error:", err);
          },
        );
      }

      // ─── PARAMS ──────────────────────────────────────────────────────────────────
      const params = {
        bgColor: "#87ceeb",
        sunIntensity: 2.2,
        ambientInt: 0.8,
        sunX: 5,
        sunY: 12,
        sunZ: 4,
        showGround: true,
        showHelpers: false,
        showFog: false,
        bushMode: false,
        trunkScale: 1.0,
        canopyScale: 1.0,
        trunkBotColor: "#4a2f17",
        trunkTopColor: "#6b4a2b",
        trunkGradHeight: 6.0,
        trunkRoughness: 0.9,
        useGlbTrunkMat: false,
        bottomColor: "#2d5a1b",
        topColor: "#5aaa2a",
        colorVar: 0.12,
        roughness: 1.0,
        alphaCutoff: 0.45,
        sssColor: "#c8e070",
        sssStr: 0.0,
        sssPow: 2.0,
        rimColor: "#c8ffaa",
        rimStr: 0.07,
        rimPow: 2.5,
        aoStr: 0.7,
        normalBias: 1.0,
        leafWarp: 0.28,
        windSpeed: 0.9,
        windStr: 0.0,
        windMicro: 0.0,
        presetName: "treetest1",
        leafTexFile: "",
        trunkTris: 0,
        trunkLod1Tris: 0,
        totalLeaves: 0,
        totalLeafTris: 0,
        lod1Leaves: 0,
        lod2Leaves: 0,
        activePreset: "",
        lodPreview: false,
        lodDist1: 80,
        lodDist2: 200,
        billboardLeaves: true,
        billboardYawOnly: false,
      };

      // --- WORLD LIGHTING (procedural day/night sky, mirrors v2) ---
      const PROC_SKY = {
        ...SKY_DEFAULTS,
        timeOfDay: 9.5,
        hazeHeight: 0.12,
        autoAdvance: false,
        daySpeed: 0.5,
      };
      const worldLight = {
        dirColor: "#fff5e0",
        dirIntensity: 2.2,
        moonIntensity: 0.3,
        hemiSky: "#c8e0ff",
        hemiGround: "#88aa55",
        hemiIntensity: 0.4,
        sunDistance: 20,
        exposure: 1.0,
        envIntensity: 0.4,
      };
      // Dome horizon haze (the visible "world fog" on the sky dome).
      const worldFog = {
        enabled: false,
        density: 0.0006,
        color: "#aebfc8",
        hazeHeight: 0.12,
      };
      // "studio" = original neutral rig (best for authoring colour/shape);
      // "world"  = v2 sky + sun + ACES tonemap (best for validating final look).
      let lightingMode = "world";
      let _todHandle = null;

      const dayNightSky = createDayNightSky();
      dayNightSky.mesh.visible = false;
      scene.add(dayNightSky.mesh);

      const _worldSunDir = new THREE.Vector3();
      const _worldMoonDir = new THREE.Vector3();
      const _worldEffDir = new THREE.Vector3();
      const _worldFog = {
        enabled: false,
        color: new THREE.Color(),
        density: 0.0003,
        hazeHeight: 0.12,
      };
      const SKY_TILT = 0.28; // matches v2 setTimeOfDay / daynight-sky lab

      function worldSunDirFromTime(t, out) {
        const ang = (t / 24) * Math.PI * 2;
        return out.set(Math.sin(ang), -Math.cos(ang), SKY_TILT).normalize();
      }

      function driveWorldLighting(timeSec, dt) {
        if (PROC_SKY.autoAdvance) {
          PROC_SKY.timeOfDay =
            (PROC_SKY.timeOfDay + PROC_SKY.daySpeed * dt) % 24;
          if (_todHandle) _todHandle.refresh();
        }
        worldSunDirFromTime(PROC_SKY.timeOfDay, _worldSunDir);
        _worldMoonDir.copy(_worldSunDir).negate();
        if (Math.abs(PROC_SKY.timeOfDay - _envLastTOD) > 0.15) {
          _envLastTOD = PROC_SKY.timeOfDay;
          _envNeeds = true; // sun moved -> sky IBL is stale
        }
        const sunUp = _worldSunDir.y;
        if (sunUp < 0) {
          // Night: relight by the moon (sun antipode); fade in near the horizon.
          _worldEffDir.copy(_worldMoonDir);
          sun.position
            .copy(_worldEffDir)
            .multiplyScalar(worldLight.sunDistance);
          sun.color.set(PROC_SKY.moonColor);
          sun.intensity =
            worldLight.moonIntensity *
            THREE.MathUtils.smoothstep(-sunUp, 0, 0.15);
        } else {
          _worldEffDir.copy(_worldSunDir);
          sun.position
            .copy(_worldSunDir)
            .multiplyScalar(worldLight.sunDistance);
          sun.color.set(worldLight.dirColor);
          sun.intensity =
            worldLight.dirIntensity *
            THREE.MathUtils.smoothstep(sunUp, -0.05, 0.1);
        }
        hemi.color.set(worldLight.hemiSky);
        hemi.groundColor.set(worldLight.hemiGround);
        hemi.intensity = worldLight.hemiIntensity;
        // Leaf SSS / rim track the dominant key light (sun by day, moon by night).
        uSunDir.value.copy(_worldEffDir).normalize();
        _worldFog.enabled = worldFog.enabled;
        _worldFog.color.set(worldFog.color);
        _worldFog.density = worldFog.density;
        _worldFog.hazeHeight = worldFog.hazeHeight;
        dayNightSky.update(PROC_SKY, {
          time: timeSec,
          sunDir: _worldSunDir,
          moonDir: _worldMoonDir,
          camera,
          fog: _worldFog,
        });
      }

      // --- Sky-derived IBL (PMREM from the dome) for the PBR trunk + ground ---
      // Mirrors v2: clone the dome into an env scene at the origin, render a small
      // cube, convolve to a REUSED PMREM RT (reuse avoids WebGPU device-loss while
      // scrubbing). Leaves opt out (envMapIntensity = 0); trunk + ground pick it up.
      let _envScene = null,
        _envCubeRT = null,
        _envCubeCam = null,
        _envRT = null,
        _pmrem = null;
      let _envFace = -1,
        _envIdle = 0,
        _envNeeds = false,
        _envLastTOD = -999;
      const ENV_IDLE = 1.0; // seconds between re-bake cycles

      function ensureEnvRig() {
        if (_envCubeRT) return;
        _envScene = new THREE.Scene();
        const domeClone = dayNightSky.mesh.clone(); // shares the live material/uniforms
        domeClone.position.set(0, 0, 0);
        _envScene.add(domeClone);
        _envCubeRT = new THREE.CubeRenderTarget(64, {
          type: THREE.HalfFloatType,
        });
        _envCubeCam = new THREE.CubeCamera(0.1, 20000, _envCubeRT);
        _envCubeCam.updateMatrixWorld(true);
        _pmrem = _pmrem ?? new THREE.PMREMGenerator(renderer);
      }
      function renderEnvFace(face) {
        ensureEnvRig();
        const prev = renderer.getRenderTarget();
        renderer.setRenderTarget(_envCubeRT, face);
        renderer.render(_envScene, _envCubeCam.children[face]);
        renderer.setRenderTarget(prev);
      }
      function convolveEnv() {
        _envRT = _pmrem.fromCubemap(_envCubeRT.texture, _envRT); // REUSE the RT (no churn)
        if (lightingMode === "world") scene.environment = _envRT.texture;
      }
      // Amortized: one cube face per frame, convolve on the 6th, then idle.
      function updateEnvBake(dt) {
        if (_envFace < 0) {
          if (!_envNeeds && !PROC_SKY.autoAdvance) return;
          _envIdle -= dt;
          if (_envIdle > 0) return;
          _envNeeds = false;
          _envFace = 0;
        }
        renderEnvFace(_envFace);
        _envFace++;
        if (_envFace >= 6) {
          convolveEnv();
          _envFace = -1;
          _envIdle = ENV_IDLE;
        }
      }

      function applyLightingMode() {
        const world = lightingMode === "world";
        dayNightSky.mesh.visible = world;
        if (world) {
          scene.background = null; // the sky dome is the backdrop
          renderer.toneMappingExposure = worldLight.exposure;
          scene.environmentIntensity = worldLight.envIntensity;
          scene.environment = _envRT ? _envRT.texture : null;
          _envNeeds = true; // (re)bake the sky IBL on entering world mode
        } else {
          scene.background = new THREE.Color(params.bgColor);
          renderer.toneMappingExposure = 1.0;
          scene.environment = null; // no sky IBL in the neutral studio rig
          // Restore the neutral studio rig.
          hemi.color.set("#b8dfff");
          hemi.groundColor.set("#3d6b20");
          hemi.intensity = params.ambientInt;
          sun.color.set("#fff8e8");
          sun.intensity = params.sunIntensity;
          sun.position.set(params.sunX, params.sunY, params.sunZ);
          uSunDir.value.set(params.sunX, params.sunY, params.sunZ).normalize();
        }
      }
      applyLightingMode();

      function updateStats() {
        const n = leavesMesh ? leavesMesh.count : 0;
        params.totalLeaves = n;
        params.totalLeafTris = n * 2;
        params.lod1Leaves = lodMesh1 ? lodMesh1.count : 0;
        params.lod2Leaves = lodMesh2 ? lodMesh2.count : 0;
        uiRefresh();
      }

      function applyBushMode(enabled) {
        defaultTrunk.visible = !enabled && !trunkRoot && !lodPreview;
        if (trunkRoot) trunkRoot.visible = !enabled && !lodPreview;

        if (enabled) {
          const enabledClusters = clusterDefs.filter((c) => c.enabled);
          const minBottom = enabledClusters.length
            ? Math.min(...enabledClusters.map((c) => c.y - c.ry))
            : 0;
          _bushYShift = Math.max(0, minBottom);
          if (_bushYShift > 0) {
            clusterDefs.forEach((c) => {
              c.y -= _bushYShift;
            });
            buildFoliage(true);
            uiRefresh();
          }
        } else {
          if (_bushYShift > 0) {
            clusterDefs.forEach((c) => {
              c.y += _bushYShift;
            });
            _bushYShift = 0;
            buildFoliage(true);
            uiRefresh();
          }
        }
      }

      // ─── PRESET SAVE / LOAD ──────────────────────────────────────────────────────
      const DEFAULT_PRESET = "tree-presets/treetest1.json";
      // Add entries when you save new JSON presets into public/tree-presets/.
      const SAVED_TREE_PRESETS = [
        { label: "Tree Test 1", file: "tree-presets/treetest1.json" },
        { label: "Tree Test 2", file: "tree-presets/treetest2.json" },
        { label: "Tree Test 3", file: "tree-presets/treetest3.json" },
        { label: "Tree Test 4", file: "tree-presets/treetest4.json" },
        { label: "Bush Test 1", file: "tree-presets/bushtest1.json" },
        { label: "Bush Test 2", file: "tree-presets/bushtest2.json" },
      ];

      async function fetchPresetJson(relativePath) {
        const resp = await fetch(resolvePublicPath(relativePath));
        if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
        return resp.json();
      }

      async function loadSavedPreset(entry, { undo = true } = {}) {
        if (undo) pushUndo();
        const data = await fetchPresetJson(entry.file);
        params.activePreset = entry.label;
        if (data.presetName) params.presetName = data.presetName;
        applyPresetData(data);
        infoEl.textContent = `Loaded preset: ${entry.label}`;
      }

      async function loadStartupPreset() {
        try {
          applyPresetData(await fetchPresetJson(DEFAULT_PRESET));
        } catch (err) {
          console.warn(
            "[Arborist] default preset load failed; using editor defaults.",
            err,
          );
          loadLeafTexFromPath(LEAF_TEXTURES[0].path);
          buildFoliage(true);
        }
      }

      function buildPresetData() {
        return {
          presetName: params.presetName,
          trunkFile: trunkFileName,
          trunkLod1File: trunkLod1FileName,
          // Either "textures/leaves/..." (built-in, light) or "data:image/...;base64,..." (embedded, self-contained).
          leafTexture: activeLeafTexPath || activeLeafTexDataUrl || "",
          atlas: {
            enabled: uUseAtlas.value > 0.5,
            cell: atlasCellIndex,
            cols: ATLAS_COLS,
            cellPx: ATLAS_CELLPX,
            gutter: ATLAS_GUTTER,
            size: ATLAS_SIZE,
          },
          leafTextureName: params.leafTexFile || "",
          clusters: clusterDefs.map((c) => ({ ...c })),
          material: {
            bottomColor: params.bottomColor,
            topColor: params.topColor,
            colorVar: params.colorVar,
            roughness: params.roughness,
            alphaCutoff: params.alphaCutoff,
            sssColor: params.sssColor,
            sssStr: params.sssStr,
            sssPow: params.sssPow,
            rimColor: params.rimColor,
            rimStr: params.rimStr,
            rimPow: params.rimPow,
            aoStr: params.aoStr,
            normalBias: params.normalBias,
            leafWarp: params.leafWarp,
            billboardLeaves: params.billboardLeaves,
            billboardYawOnly: params.billboardYawOnly,
          },
          wind: {
            windSpeed: params.windSpeed,
            windStr: params.windStr,
            windMicro: params.windMicro,
          },
          trunkScale: params.trunkScale,
          canopyScale: params.canopyScale,
          trunkMaterial: {
            botColor: params.trunkBotColor,
            topColor: params.trunkTopColor,
            gradHeight: params.trunkGradHeight,
            roughness: params.trunkRoughness,
            useGlb: params.useGlbTrunkMat,
          },
          bushMode: params.bushMode,
          lodDistances: { lod1: params.lodDist1, lod2: params.lodDist2 },
        };
      }

      async function savePreset() {
        const json = JSON.stringify(buildPresetData(), null, 2);
        const name = (params.presetName || "preset").replace(
          /[^a-z0-9_\-]/gi,
          "_",
        );
        if (window.showSaveFilePicker) {
          try {
            const handle = await showSaveFilePicker({
              suggestedName: name + ".json",
              types: [
                {
                  description: "Tree preset",
                  accept: { "application/json": [".json"] },
                },
              ],
            });
            const writable = await handle.createWritable();
            await writable.write(json);
            await writable.close();
            infoEl.textContent = `Preset saved: ${name}.json — trunk: ${trunkFileName || "(default)"}, texture: ${activeLeafTexPath || "(custom)"}`;
          } catch (e) {
            if (e.name !== "AbortError") console.error(e);
          }
        } else {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(
            new Blob([json], { type: "application/json" }),
          );
          a.download = name + ".json";
          a.click();
        }
      }

      function applyPresetData(data) {
        if (data.clusters) {
          data.clusters.forEach((c, i) => {
            if (i < clusterDefs.length) {
              const t = clusterDefs[i];
              Object.assign(t, c);
              // Backfill shaping fields from the LOADED data's presence, so a
              // preset predating them loads clean (no stale rz/scale/lean leak).
              if (c.rz == null) t.rz = t.rx;
              if (c.scale == null) t.scale = 1;
              if (c.leanX == null) t.leanX = 0;
              if (c.leanZ == null) t.leanZ = 0;
            }
          });
          for (let i = data.clusters.length; i < clusterDefs.length; i++) {
            clusterDefs[i].enabled = false;
          }
        }
        if (data.canopyScale != null) params.canopyScale = data.canopyScale;
        applyTrunkMaterial(data.trunkMaterial);
        if (data.material) {
          const m = data.material;
          if (m.bottomColor) {
            params.bottomColor = m.bottomColor;
            uBottomColor.value.set(m.bottomColor);
          }
          if (m.topColor) {
            params.topColor = m.topColor;
            uTopColor.value.set(m.topColor);
          }
          if (m.colorVar != null) {
            params.colorVar = m.colorVar;
            uColorVar.value = m.colorVar;
          }
          if (m.roughness != null) {
            params.roughness = m.roughness;
            leafMat.roughness = m.roughness;
          }
          if (m.alphaCutoff != null) {
            params.alphaCutoff = m.alphaCutoff;
            uAlphaCutoff.value = m.alphaCutoff;
          }
          if (m.sssColor) {
            params.sssColor = m.sssColor;
            uSssColor.value.set(m.sssColor);
          }
          if (m.sssStr != null) {
            params.sssStr = m.sssStr;
            uSssStr.value = m.sssStr;
          }
          if (m.sssPow != null) {
            params.sssPow = m.sssPow;
            uSssPow.value = m.sssPow;
          }
          if (m.rimColor) {
            params.rimColor = m.rimColor;
            uRimColor.value.set(m.rimColor);
          }
          if (m.rimStr != null) {
            params.rimStr = m.rimStr;
            uRimStr.value = m.rimStr;
          }
          if (m.rimPow != null) {
            params.rimPow = m.rimPow;
            uRimPow.value = m.rimPow;
          }
          if (m.aoStr != null) {
            params.aoStr = m.aoStr;
            uAoStr.value = m.aoStr;
          }
          if (m.normalBias != null) {
            params.normalBias = m.normalBias;
            uNormalBias.value = m.normalBias;
          }
          if (m.leafWarp != null) {
            params.leafWarp = m.leafWarp;
            uLeafWarp.value = m.leafWarp;
          }
          if (m.billboardLeaves != null) {
            params.billboardLeaves = !!m.billboardLeaves;
            uBillboard.value = params.billboardLeaves ? 1.0 : 0.0;
          }
          if (m.billboardYawOnly != null) {
            params.billboardYawOnly = !!m.billboardYawOnly;
            uBillboardYaw.value = params.billboardYawOnly ? 1.0 : 0.0;
          }
        }
        if (data.wind) {
          const w = data.wind;
          if (w.windSpeed != null) {
            params.windSpeed = w.windSpeed;
            uWindSpeed.value = w.windSpeed;
          }
          if (w.windStr != null) {
            params.windStr = w.windStr;
            uWindStr.value = w.windStr;
          }
          if (w.windMicro != null) {
            params.windMicro = w.windMicro;
            uWindMicro.value = w.windMicro;
          }
        }
        if (data.trunkScale != null) {
          params.trunkScale = data.trunkScale;
          trunkScale = data.trunkScale;
          (trunkRoot || defaultTrunk).scale.setScalar(data.trunkScale);
        }
        if (data.lodDistances) {
          if (data.lodDistances.lod1 != null)
            params.lodDist1 = data.lodDistances.lod1;
          if (data.lodDistances.lod2 != null)
            params.lodDist2 = data.lodDistances.lod2;
        }
        if (data.presetName) params.presetName = data.presetName;
        if (data.trunkFile) loadTrunkByFileName(data.trunkFile);
        else resetToDefaultTrunk();
        if (data.trunkLod1File) loadTrunkLod1ByFileName(data.trunkLod1File);
        if (data.leafTexture) {
          if (data.leafTexture.startsWith("data:")) {
            loadLeafTexFromDataUrl(
              data.leafTexture,
              data.leafTextureName || "(embedded)",
            );
          } else if (data.leafTexture.startsWith("textures/")) {
            loadLeafTexFromPath(data.leafTexture);
          }
        }
        if (data.atlas && data.atlas.enabled && atlasTexture) {
          setAtlasCell(data.atlas.cell ?? 0);
          useAtlas(true);
          atlasUi.use = true;
          atlasUi.cell = data.atlas.cell ?? 0;
        }
        if (data.bushMode != null) {
          params.bushMode = data.bushMode;
          applyBushMode(data.bushMode);
        }
        uiRefresh();
        buildFoliage(true);
      }

      function loadPresetFromFile(file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            pushUndo();
            applyPresetData(JSON.parse(ev.target.result));
            infoEl.textContent = `Preset loaded from ${file.name}`;
          } catch (e) {
            infoEl.textContent = "Invalid preset file: " + e.message;
          }
        };
        reader.readAsText(file);
      }

      const infoEl = document.getElementById("info");

      // --- LEAF MASK ATLAS (open-world batching: bake N leaf masks into one image) ---
      // Arborist colours leaves procedurally (gradient + SSS/rim); the leaf PNG is
      // used ONLY as a cutout mask. So the atlas carries MASKS: each cell = one
      // leaf's mask (grayscale in RGB, A=255). v2 auto-detects channel -> reads .r.
      // 1024 / 4x4 / 256px cells, 12px gutter + 10px alpha-dilation so mips don't
      // bleed between cells. Up to 16 cells; bakes the 6 built-ins into 0..5.
      const ATLAS_SIZE = 1024;
      const ATLAS_COLS = 4;
      const ATLAS_CELLPX = 256;
      const ATLAS_GUTTER = 12;
      const ATLAS_DILATE = 10;
      const ATLAS_INNER = ATLAS_CELLPX - ATLAS_GUTTER * 2; // 232
      let atlasTexture = null; // THREE.CanvasTexture once baked
      let atlasCanvas = null; // source canvas (preview + download)
      let atlasCellMap = []; // [{ index, name, uvRect:{ox,oy,sx,sy} }]
      let _atlasPreviewImg = null;
      let _atlasSavedTex = null,
        _atlasSavedMaskInAlpha = 0;
      const atlasUi = { use: false, cell: 0 };

      function setAtlasCell(i) {
        atlasCellIndex = i | 0;
        // Per-instance now: rewrite the aAtlasIndex buffer on the live meshes.
        for (const m of [leavesMesh, lodMesh1, lodMesh2]) {
          const a = m && m.geometry.attributes.aAtlasIndex;
          if (a) {
            a.array.fill(atlasCellIndex);
            a.needsUpdate = true;
          }
        }
      }
      // Switch the live tree between its standalone leaf texture and an atlas cell.
      function useAtlas(on) {
        if (on) {
          if (!atlasTexture) {
            infoEl.textContent = "Bake the atlas first.";
            return false;
          }
          _atlasSavedTex = leafMapNode.value;
          _atlasSavedMaskInAlpha = uMaskInAlpha.value;
          leafMapNode.value = atlasTexture;
          uMaskInAlpha.value = 0; // atlas stores the mask in red
          uUseAtlas.value = 1;
          setAtlasCell(atlasCellIndex);
        } else {
          if (_atlasSavedTex) leafMapNode.value = _atlasSavedTex;
          uMaskInAlpha.value = _atlasSavedMaskInAlpha;
          uUseAtlas.value = 0;
        }
        return true;
      }

      // uv sub-rect for cell i, accounting for CanvasTexture flipY = true.
      function atlasCellRect(i) {
        const c = i % ATLAS_COLS;
        const r = (i / ATLAS_COLS) | 0;
        const s = ATLAS_INNER / ATLAS_SIZE;
        const ox = (c * ATLAS_CELLPX + ATLAS_GUTTER) / ATLAS_SIZE;
        const oy =
          ((ATLAS_COLS - 1 - r) * ATLAS_CELLPX + ATLAS_GUTTER) / ATLAS_SIZE;
        return { ox, oy, sx: s, sy: s };
      }

      function _loadImg(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error("img load failed: " + src));
          img.src = resolvePublicPath(src);
        });
      }

      // 4-neighbour max-dilation by `iters` px, then restore the interior so only
      // the gutter ring is filled (keeps the visible silhouette crisp).
      function _dilateGutter(mask, w, h, iters, x0, y0, x1, y1) {
        const orig = mask.slice();
        for (let it = 0; it < iters; it++) {
          const src = mask.slice();
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const idx = y * w + x;
              if (src[idx] >= 250) continue;
              let m = src[idx];
              if (x > 0) m = Math.max(m, src[idx - 1]);
              if (x < w - 1) m = Math.max(m, src[idx + 1]);
              if (y > 0) m = Math.max(m, src[idx - w]);
              if (y < h - 1) m = Math.max(m, src[idx + w]);
              mask[idx] = m;
            }
          }
        }
        for (let y = y0; y < y1; y++) {
          for (let x = x0; x < x1; x++) {
            mask[y * w + x] = orig[y * w + x]; // restore crisp interior
          }
        }
      }

      async function bakeLeafAtlas() {
        const sources = LEAF_TEXTURES.slice(0, ATLAS_COLS * ATLAS_COLS);
        infoEl.textContent = "Baking leaf atlas...";
        let imgs;
        try {
          imgs = await Promise.all(sources.map((t) => _loadImg(t.path)));
        } catch (e) {
          infoEl.textContent = "Atlas bake failed: " + e.message;
          return;
        }
        const cv = document.createElement("canvas");
        cv.width = ATLAS_SIZE;
        cv.height = ATLAS_SIZE;
        const ctx = cv.getContext("2d", { willReadFrequently: true });
        ctx.clearRect(0, 0, ATLAS_SIZE, ATLAS_SIZE);
        const tmp = document.createElement("canvas");
        tmp.width = ATLAS_INNER;
        tmp.height = ATLAS_INNER;
        const tctx = tmp.getContext("2d", { willReadFrequently: true });

        atlasCellMap = [];
        imgs.forEach((img, i) => {
          const c = i % ATLAS_COLS;
          const r = (i / ATLAS_COLS) | 0;
          const px0 = c * ATLAS_CELLPX;
          const py0 = r * ATLAS_CELLPX;

          // Channel choice = SAME as the live shader (detectAlphaChannel on the
          // full source image) so the atlas mask matches non-atlas rendering.
          const hasAlpha = detectAlphaChannel(img);
          // Draw at interior resolution: NO transparent gutter to contaminate the
          // read. (The gutter made every cell read alpha=255 -> solid 100%.)
          tctx.clearRect(0, 0, ATLAS_INNER, ATLAS_INNER);
          tctx.drawImage(img, 0, 0, ATLAS_INNER, ATLAS_INNER);
          const d = tctx.getImageData(0, 0, ATLAS_INNER, ATLAS_INNER).data;
          const mask = new Uint8ClampedArray(ATLAS_CELLPX * ATLAS_CELLPX);
          for (let yy = 0; yy < ATLAS_INNER; yy++) {
            for (let xx = 0; xx < ATLAS_INNER; xx++) {
              const sp = (yy * ATLAS_INNER + xx) * 4;
              mask[(yy + ATLAS_GUTTER) * ATLAS_CELLPX + (xx + ATLAS_GUTTER)] =
                hasAlpha ? d[sp + 3] : d[sp];
            }
          }
          _dilateGutter(
            mask,
            ATLAS_CELLPX,
            ATLAS_CELLPX,
            ATLAS_DILATE,
            ATLAS_GUTTER,
            ATLAS_GUTTER,
            ATLAS_GUTTER + ATLAS_INNER,
            ATLAS_GUTTER + ATLAS_INNER,
          );
          const out = ctx.createImageData(ATLAS_CELLPX, ATLAS_CELLPX);
          const od = out.data;
          for (let q = 0, p = 0; q < mask.length; q++, p += 4) {
            od[p] = od[p + 1] = od[p + 2] = mask[q];
            od[p + 3] = 255;
          }
          ctx.putImageData(out, px0, py0);
          atlasCellMap.push({
            index: i,
            name: sources[i].name,
            uvRect: atlasCellRect(i),
          });
        });

        atlasCanvas = cv;
        if (atlasTexture) atlasTexture.dispose();
        atlasTexture = new THREE.CanvasTexture(cv);
        atlasTexture.colorSpace = THREE.SRGBColorSpace;
        atlasTexture.needsUpdate = true;

        // Preview: mask drives ALPHA over a checkerboard so partial-coverage leaf
        // shapes are visible (the atlas itself keeps the mask in RGB for the shader).
        const full = ctx.getImageData(0, 0, ATLAS_SIZE, ATLAS_SIZE);
        const fd = full.data;
        const prev = document.createElement("canvas");
        prev.width = ATLAS_SIZE;
        prev.height = ATLAS_SIZE;
        const pctx = prev.getContext("2d");
        const pim = pctx.createImageData(ATLAS_SIZE, ATLAS_SIZE);
        const pd = pim.data;
        for (let p = 0; p < fd.length; p += 4) {
          pd[p] = 120;
          pd[p + 1] = 230;
          pd[p + 2] = 90; // leaf green
          pd[p + 3] = fd[p]; // alpha = mask (red channel)
        }
        pctx.putImageData(pim, 0, 0);
        if (_atlasPreviewImg)
          _atlasPreviewImg.src = prev.toDataURL("image/png");

        // Per-cell coverage (% of interior texels with mask > 128).
        const cov = atlasCellMap.map((cell) => {
          const c = cell.index % ATLAS_COLS,
            r = (cell.index / ATLAS_COLS) | 0;
          let on = 0,
            tot = 0;
          for (
            let y = r * ATLAS_CELLPX + ATLAS_GUTTER;
            y < r * ATLAS_CELLPX + ATLAS_GUTTER + ATLAS_INNER;
            y++
          ) {
            for (
              let x = c * ATLAS_CELLPX + ATLAS_GUTTER;
              x < c * ATLAS_CELLPX + ATLAS_GUTTER + ATLAS_INNER;
              x++
            ) {
              tot++;
              if (fd[(y * ATLAS_SIZE + x) * 4] > 128) on++;
            }
          }
          return cell.name + ":" + Math.round((on / tot) * 100) + "%";
        });
        console.log("[atlas] per-cell coverage:", cov);
        infoEl.textContent = "Leaf atlas baked. Coverage = " + cov.join("  ");
      }

      // --- OCTAHEDRAL IMPOSTOR (far-LOD): bake the whole tree into a color atlas ---
      // Phase 1a: bake + preview only. Renders trunk + stylized billboard foliage
      // with their REAL materials from grid² octahedral views. The lab does the
      // heavy lifting (octahedral-v3/octahedral-core.js = single source of truth).
      const IMP = {
        grid: 8,
        atlasSize: 4096,
        cellPad: 6,
        fullOctahedral: false,
        bakeLight: 3.0,
      };
      let impostorResult = null;
      let _impPreviewImg = null;

      async function bakeTreeImpostor() {
        const trunk = trunkRoot || (params.bushMode ? null : defaultTrunk);
        const objs = [leavesMesh, trunk].filter(Boolean);
        if (!objs.length) {
          infoEl.textContent = "Nothing to bake (no foliage / trunk).";
          return;
        }
        infoEl.textContent =
          "Baking tree impostor — rendering the tree " +
          IMP.grid * IMP.grid +
          "x...";
        await new Promise((r) =>
          requestAnimationFrame(() => requestAnimationFrame(r)),
        );
        // Force world-up leaf normals during the bake so lighting is VIEW-STABLE —
        // normalBias<1 (presets use 0.75) makes leaves face the bake camera, so
        // anti-sun views bake dark. Restored right after; live tree unchanged.
        const _savedNB = uNormalBias.value;
        const _savedAO = uAoStr.value;
        const _savedRim = uRimStr.value;
        const _savedSSS = uSssStr.value;
        uNormalBias.value = 1.0; // world-up leaves
        uAoStr.value = 0.0; // no AO darkening
        uRimStr.value = 0.0; // no view-dependent rim glow
        uSssStr.value = 0.0; // no view-dependent back-light SSS
        // Flat AMBIENT bake light only — NO directional sun, so there's no
        // lit/shadow side and every octahedral view is illuminated identically
        // (the real cause of the bright/dark cells). View-stable atlas.
        // Captures ~ALBEDO (not lit colour) so the impostor can be RELIT live by
        // the scene sun (Phase 2 / day-night). Intensity is the brightness-match
        // knob (three's ambient ~/π, so true albedo ≈ 3); tune via the UI slider.
        const _bakeLight = new THREE.AmbientLight(0xffffff, IMP.bakeLight);
        try {
          impostorResult = await bakeColorAtlasFromObject(renderer, objs, {
            grid: IMP.grid,
            atlasSize: IMP.atlasSize,
            cellPad: IMP.cellPad,
            fullOctahedral: IMP.fullOctahedral,
            maxAniso: 8,
            lights: [_bakeLight],
          });
        } catch (e) {
          uNormalBias.value = _savedNB;
          uAoStr.value = _savedAO;
          uRimStr.value = _savedRim;
          uSssStr.value = _savedSSS;
          console.error(e);
          infoEl.textContent = "Impostor bake failed: " + e.message;
          return;
        }
        uNormalBias.value = _savedNB;
        uAoStr.value = _savedAO;
        uRimStr.value = _savedRim;
        uSssStr.value = _savedSSS;
        const { colorPixels, atlasSize } = impostorResult;
        const cv = document.createElement("canvas");
        cv.width = atlasSize;
        cv.height = atlasSize;
        const ctx = cv.getContext("2d");
        const im = ctx.createImageData(atlasSize, atlasSize);
        im.data.set(colorPixels);
        ctx.putImageData(im, 0, 0);
        if (_impPreviewImg) _impPreviewImg.src = cv.toDataURL("image/png");
        buildImpostorMesh();
        infoEl.textContent =
          "Tree impostor atlas baked: " +
          IMP.grid * IMP.grid +
          " views, " +
          atlasSize +
          "px (" +
          Math.floor(atlasSize / IMP.grid) +
          "px/cell)";
      }

      let impostorMesh = null;
      let impUniforms = null;
      let _impShow = true;
      const IMPSWAP = { enabled: false, startDist: 40, endDist: 80 };

      // Build the far-LOD billboard from the baked atlas, standing it beside the
      // real tree for comparison. UNLIT (the stylized lighting is baked in).
      function buildImpostorMesh() {
        if (!impostorResult) return;
        if (impostorMesh) {
          scene.remove(impostorMesh);
          impostorMesh.geometry.dispose();
          impostorMesh = null;
        }
        const flats = makeFlatAuxTextures();
        const built = createImpostorMaterials(
          {
            colorTex: impostorResult.colorTex,
            normalTex: flats.normalTex,
            rmTex: flats.rmTex,
            depthTex: flats.depthTex,
          },
          {
            impostorScale: impostorResult.radius,
            gridVal: IMP.grid,
            atlasSize: impostorResult.atlasSize,
            cellPad: impostorResult.cellPad,
            fullOctahedral: IMP.fullOctahedral,
          },
        );
        impUniforms = built.uniforms;
        impUniforms.uUnlit.value = 0; // RELIGHT: albedo lit live by the scene sun (day/night)
        built.mainMat.envMapIntensity = 0; // match leaves (they ignore env) -> sun+hemi only, no double sky tint

        const R = impostorResult.radius;
        const gap = 2 * R + 4;
        impostorMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(1, 1),
          built.mainMat,
        );
        impostorMesh.position.set(
          impostorResult.center.x + gap,
          impostorResult.center.y,
          impostorResult.center.z,
        );
        impostorMesh.scale.setScalar(2 * R);
        impostorMesh.frustumCulled = false;
        impUniforms.uCenter.value.copy(impostorMesh.position);
        scene.add(impostorMesh);
        infoEl.textContent =
          "Impostor placed beside the tree (orbit to compare).";
      }

      // Per-frame placement + LOD crossfade for the impostor billboard.
      // Priority: LOD-preview 4th column > distance swap (overlay) > compare (beside).
      function updateImpostorLod() {
        if (!impostorMesh || !impostorResult) return;
        const c = impostorResult.center;
        const trunk = trunkRoot || defaultTrunk;
        if (lodPreview) {
          impostorMesh.position.set(LOD_SPACING * 2, c.y, c.z);
          impUniforms.uCenter.value.copy(impostorMesh.position);
          impUniforms.uFade.value = 1;
          impostorMesh.visible = true;
          return;
        }
        if (IMPSWAP.enabled) {
          impostorMesh.position.set(c.x, c.y, c.z); // overlay the real tree
          impUniforms.uCenter.value.copy(impostorMesh.position);
          const dx = camera.position.x - c.x;
          const dy = camera.position.y - c.y;
          const dz = camera.position.z - c.z;
          const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
          const t = THREE.MathUtils.smoothstep(
            d,
            IMPSWAP.startDist,
            IMPSWAP.endDist,
          );
          impUniforms.uFade.value = t; // impostor dithers in as you pull away
          impostorMesh.visible = t > 0.001;
          const nearOn = t < 0.999; // near tree hard-cut once impostor is solid
          if (leavesMesh) leavesMesh.visible = nearOn;
          if (trunk) trunk.visible = nearOn && !params.bushMode;
          return;
        }
        // Compare mode: stand beside the tree, fully solid.
        if (leavesMesh) leavesMesh.visible = true;
        if (trunk) trunk.visible = !params.bushMode;
        impostorMesh.position.set(
          c.x + 2 * impostorResult.radius + 4,
          c.y,
          c.z,
        );
        impUniforms.uCenter.value.copy(impostorMesh.position);
        impUniforms.uFade.value = 1;
        impostorMesh.visible = _impShow;
      }
