        step: 0.1,
      });
      _button(impBody, {
        title: "Bake tree impostor atlas",
        onClick: () => bakeTreeImpostor(),
      });
      {
        const impVis = { show: true };
        _toggle(impBody, impVis, "show", {
          label: "Show impostor",
          onChange: (ev) => {
            _impShow = ev.value;
          },
        });
      }
      _separator(impBody);
      _toggle(impBody, IMPSWAP, "enabled", { label: "Distance LOD swap" });
      _slider(impBody, IMPSWAP, "startDist", {
        label: "Swap start dist",
        min: 5,
        max: 200,
        step: 1,
      });
      _slider(impBody, IMPSWAP, "endDist", {
        label: "Swap end dist",
        min: 5,
        max: 300,
        step: 1,
      });

      const allBody = _section(uiRoot, "All Clusters", false);
      _slider(allBody, params, "canopyScale", {
        label: "Canopy scale",
        min: 0.1,
        max: 4,
        step: 0.01,
        onChange: rebuildCluster,
      });

      clusterDefs.forEach((c, ci) => {
        const cBody = _section(
          uiRoot,
          `Cluster ${ci + 1} (${CLUSTER_COLORS[ci]})`,
          ci === 0,
        );
        _toggle(cBody, c, "enabled", {
          label: "Enabled",
          onChange: () => {
            scheduleUndo();
            buildFoliage(true);
          },
        });
        _button(cBody, {
          title: "Duplicate to next empty slot",
          onClick: () => {
            const target = clusterDefs.findIndex(
              (cc, ii) => ii > ci && !cc.enabled,
            );
            if (target < 0) {
              infoEl.textContent = "No empty slot available";
              return;
            }
            pushUndo();
            Object.assign(clusterDefs[target], { ...c });
            clusterDefs[target].x += 0.5;
            clusterDefs[target].enabled = true;
            buildFoliage(true);
            uiRefresh();
            infoEl.textContent = `Duplicated cluster ${ci + 1} → ${target + 1}`;
          },
        });
        _separator(cBody);
        _slider(cBody, c, "x", {
          label: "X",
          min: -10,
          max: 10,
          step: 0.05,
          onChange: rebuildCluster,
        });
        _slider(cBody, c, "y", {
          label: "Y",
          min: 0,
          max: 20,
          step: 0.05,
          onChange: rebuildCluster,
        });
        _slider(cBody, c, "z", {
          label: "Z",
          min: -10,
          max: 10,
          step: 0.05,
          onChange: rebuildCluster,
        });
        _separator(cBody);
        _slider(cBody, c, "rx", {
          label: "Radius X",
          min: 0.2,
          max: 10,
          step: 0.05,
          onChange: rebuildCluster,
        });
        _slider(cBody, c, "rz", {
          label: "Radius Z",
          min: 0.2,
          max: 10,
          step: 0.05,
          onChange: rebuildCluster,
        });
        _slider(cBody, c, "ry", {
          label: "Radius Y",
          min: 0.2,
          max: 8,
          step: 0.05,
          onChange: rebuildCluster,
        });
        _slider(cBody, c, "scale", {
          label: "Cluster scale",
          min: 0.1,
          max: 4,
          step: 0.01,
          onChange: rebuildCluster,
        });
        _slider(cBody, c, "leanX", {
          label: "Lean X",
          min: -60,
          max: 60,
          step: 1,
          onChange: rebuildCluster,
        });
        _slider(cBody, c, "leanZ", {
          label: "Lean Z",
          min: -60,
          max: 60,
          step: 1,
          onChange: rebuildCluster,
        });
        _separator(cBody);
        _slider(cBody, c, "count", {
          label: "Leaf count",
          min: 10,
          max: 2000,
          step: 10,
          onChange: rebuildCluster,
        });
        _slider(cBody, c, "leafSize", {
          label: "Leaf size",
          min: 0.05,
          max: 4,
          step: 0.05,
          onChange: rebuildCluster,
        });
        _slider(cBody, c, "scaleVar", {
          label: "Scale variation",
          min: 0,
          max: 0.9,
          step: 0.01,
          onChange: rebuildCluster,
        });
        _separator(cBody);
        _slider(cBody, c, "shell", {
          label: "Shell bias",
          min: 0,
          max: 1,
          step: 0.01,
          onChange: rebuildCluster,
        });
        _slider(cBody, c, "shellThick", {
          label: "Shell thickness",
          min: 0.05,
          max: 0.98,
          step: 0.01,
          onChange: rebuildCluster,
        });
        _slider(cBody, c, "tiltMax", {
          label: "Max tilt",
          min: 0,
          max: 90,
          step: 1,
          onChange: rebuildCluster,
        });
      });

      const matBody = _section(uiRoot, "Leaf Colors", false);
      _color(matBody, params, "bottomColor", {
        label: "Base color",
        onChange: (ev) => {
          uBottomColor.value.set(ev.value);
          scheduleUndo();
        },
      });
      _color(matBody, params, "topColor", {
        label: "Top color",
        onChange: (ev) => {
          uTopColor.value.set(ev.value);
          scheduleUndo();
        },
      });
      _slider(matBody, params, "colorVar", {
        label: "Tint variation",
        min: 0,
        max: 0.6,
        step: 0.01,
        onChange: (ev) => {
          uColorVar.value = ev.value;
          scheduleUndo();
        },
      });
      _slider(matBody, params, "roughness", {
        label: "Roughness",
        min: 0,
        max: 1,
        step: 0.01,
        onChange: (ev) => {
          if (leavesMesh) leavesMesh.material.roughness = ev.value;
          scheduleUndo();
        },
      });

      const lightBody = _section(uiRoot, "SSS & Rim Light", false);
      _color(lightBody, params, "sssColor", {
        label: "SSS color",
        onChange: (ev) => {
          uSssColor.value.set(ev.value);
          scheduleUndo();
        },
      });
      _slider(lightBody, params, "sssStr", {
        label: "SSS strength",
        min: 0,
        max: 2,
        step: 0.01,
        onChange: (ev) => {
          uSssStr.value = ev.value;
          scheduleUndo();
        },
      });
      _slider(lightBody, params, "sssPow", {
        label: "SSS falloff",
        min: 0.5,
        max: 10,
        step: 0.1,
        onChange: (ev) => {
          uSssPow.value = ev.value;
          scheduleUndo();
        },
      });
      _separator(lightBody);
      _color(lightBody, params, "rimColor", {
        label: "Rim color",
        onChange: (ev) => {
          uRimColor.value.set(ev.value);
          scheduleUndo();
        },
      });
      _slider(lightBody, params, "rimStr", {
        label: "Rim strength",
        min: 0,
        max: 2,
        step: 0.01,
        onChange: (ev) => {
          uRimStr.value = ev.value;
          scheduleUndo();
        },
      });
      _slider(lightBody, params, "rimPow", {
        label: "Rim sharpness",
        min: 0.5,
        max: 10,
        step: 0.1,
        onChange: (ev) => {
          uRimPow.value = ev.value;
          scheduleUndo();
        },
      });
      _separator(lightBody);
      _slider(lightBody, params, "aoStr", {
        label: "AO strength",
        min: 0,
        max: 1,
        step: 0.01,
        onChange: (ev) => {
          uAoStr.value = ev.value;
          scheduleUndo();
        },
      });
      _separator(lightBody);
      _slider(lightBody, params, "normalBias", {
        label: "Normal bias (sphere)",
        min: 0,
        max: 1,
        step: 0.01,
        onChange: (ev) => {
          uNormalBias.value = ev.value;
          scheduleUndo();
        },
      });
      _slider(lightBody, params, "leafWarp", {
        label: "Leaf warp",
        min: 0,
        max: 1,
        step: 0.01,
        onChange: (ev) => {
          uLeafWarp.value = ev.value;
          scheduleUndo();
        },
      });

      const windBody = _section(uiRoot, "Wind", false);
      _slider(windBody, params, "windSpeed", {
        label: "Speed",
        min: 0,
        max: 5,
        step: 0.05,
        onChange: (ev) => {
          uWindSpeed.value = ev.value;
          scheduleUndo();
        },
      });
      _slider(windBody, params, "windStr", {
        label: "Strength",
        min: 0,
        max: 0.8,
        step: 0.005,
        onChange: (ev) => {
          uWindStr.value = ev.value;
          scheduleUndo();
        },
      });
      _slider(windBody, params, "windMicro", {
        label: "Micro sway",
        min: 0,
        max: 0.3,
        step: 0.005,
        onChange: (ev) => {
          uWindMicro.value = ev.value;
          scheduleUndo();
        },
      });

      const bbBody = _section(uiRoot, "Billboard foliage", false);
      _toggle(bbBody, params, "billboardLeaves", {
        label: "Face camera",
        onChange: () => {
          scheduleUndo();
          buildFoliage(true);
        },
      });
      _toggle(bbBody, params, "billboardYawOnly", {
        label: "Yaw only (stable)",
        onChange: () => {
          uBillboardYaw.value = params.billboardYawOnly ? 1.0 : 0.0;
          scheduleUndo();
        },
      });

      const sceneBody = _section(uiRoot, "Scene", false);
      _color(sceneBody, params, "bgColor", {
        label: "Sky color",
        onChange: (ev) => {
          if (scene.background) scene.background.set(ev.value);
          if (scene.fog) scene.fog.color.set(ev.value);
        },
      });
      _slider(sceneBody, params, "sunIntensity", {
        label: "Sun intensity",
        min: 0,
        max: 6,
        step: 0.05,
        onChange: (ev) => {
          sun.intensity = ev.value;
        },
      });
      _slider(sceneBody, params, "ambientInt", {
        label: "Ambient light",
        min: 0,
        max: 3,
        step: 0.05,
        onChange: (ev) => {
          hemi.intensity = ev.value;
        },
      });
      _separator(sceneBody);
      const syncSun = () => {
        sun.position.set(params.sunX, params.sunY, params.sunZ);
        uSunDir.value.set(params.sunX, params.sunY, params.sunZ);
        uSunDir.value.normalize();
      };
      _slider(sceneBody, params, "sunX", {
        label: "Sun X",
        min: -20,
        max: 20,
        step: 0.5,
        onChange: syncSun,
      });
      _slider(sceneBody, params, "sunY", {
        label: "Sun Y",
        min: 0.5,
        max: 20,
        step: 0.5,
        onChange: syncSun,
      });
      _slider(sceneBody, params, "sunZ", {
        label: "Sun Z",
        min: -20,
        max: 20,
        step: 0.5,
        onChange: syncSun,
      });
      _separator(sceneBody);
      _toggle(sceneBody, params, "showFog", {
        label: "Show fog",
        onChange: (ev) => {
          scene.fog = ev.value
            ? new THREE.FogExp2(params.bgColor, 0.018)
            : null;
        },
      });
      _toggle(sceneBody, params, "showGround", {
        label: "Show ground",
        onChange: (ev) => {
          ground.visible = ev.value;
        },
      });
      _toggle(sceneBody, params, "showHelpers", {
        label: "Show helpers (draggable)",
        onChange: (ev) => {
          showHelpers = ev.value;
          updateClusterHelpers();
        },
      });

      const statsBody = _section(uiRoot, "Stats", true);
      _info(statsBody, "Trunk LOD0 tris", () => String(params.trunkTris));
      _info(statsBody, "Trunk LOD1 tris", () => String(params.trunkLod1Tris));
      _info(statsBody, "LOD0 leaves", () => String(params.totalLeaves));
      _info(statsBody, "LOD0 leaf tris", () => String(params.totalLeafTris));

      _separator(uiRoot);
      _button(uiRoot, {
        title: "Rebuild Foliage",
        onClick: () => buildFoliage(true),
      });

      _separator(uiRoot);
      const presetBody = _section(uiRoot, "Save / Load", true);
      _text(presetBody, params, "presetName", { label: "Preset name" });
      _button(presetBody, {
        title: "Save Preset to File",
        onClick: savePreset,
      });
      _button(presetBody, {
        title: "Load Preset from File",
        onClick: () => {
          const i = document.createElement("input");
          i.type = "file";
          i.accept = ".json";
          i.onchange = () => i.files[0] && loadPresetFromFile(i.files[0]);
          i.click();
        },
      });
      _separator(presetBody);
      _button(presetBody, {
        title: "Copy to Clipboard",
        onClick: () => {
          const json = JSON.stringify(buildPresetData(), null, 2);
          navigator.clipboard
            .writeText(json)
            .then(() => (infoEl.textContent = "Settings copied to clipboard!"))
            .catch(() => {
              const ta = document.createElement("textarea");
              ta.value = json;
              document.body.appendChild(ta);
              ta.select();
              document.execCommand("copy");
              document.body.removeChild(ta);
              infoEl.textContent = "Settings copied!";
            });
        },
      });

      // ─── INITIAL BUILD ───────────────────────────────────────────────────────────
      await preloadTrunkGlbs();
      try {
        await bakeTrunkPickerThumbnails();
      } catch (err) {
        console.warn("[Arborist] trunk thumbnail bake skipped:", err);
      }
      await loadStartupPreset();

      // ─── RENDER LOOP ─────────────────────────────────────────────────────────────
      const timer = new THREE.Timer();
      renderer.setAnimationLoop(() => {
        timer.update();
        const dt = timer.getDelta();
        uTime.value = timer.getElapsed();
        if (lightingMode === "world")
          driveWorldLighting(timer.getElapsed(), dt);
        if (lightingMode === "world") updateEnvBake(dt);
        if (impUniforms) impUniforms.uTime.value = timer.getElapsed();
        updateImpostorLod();
        controls.update();
        renderer.render(scene, camera);
      });

      // ─── RESIZE ──────────────────────────────────────────────────────────────────
      window.addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    </script>
  </body>
</html>
