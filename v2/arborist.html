<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tree Editor — Stylized Tree Builder for V2 Engine</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a3020;
      }
      canvas {
        display: block;
      }
      :root {
        --bg-darkest: #1a1a1a;
        --bg-dark: #222222;
        --bg-panel: #2a2a2a;
        --bg-item: #333333;
        --bg-hover: #3a3a3a;
        --bg-input: #1e1e1e;
        --border: #3c3c3c;
        --border-light: #4a4a4a;
        --text: #cccccc;
        --text-dim: #888888;
        --text-bright: #e0e0e0;
        --accent: #4a9eff;
        --font: "Segoe UI", system-ui, -apple-system, sans-serif;
        --font-mono: "Cascadia Code", "Fira Code", Consolas, monospace;
        --radius: 4px;
      }
      #ui {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 10;
        width: 320px;
        max-height: calc(100vh - 16px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-family: var(--font);
        font-size: 13px;
        color: var(--text);
        user-select: none;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      #ui .panel-header {
        display: flex;
        align-items: center;
        padding: 8px 12px;
        min-height: 36px;
        background: var(--bg-dark);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.4px;
        color: var(--text-bright);
        flex-shrink: 0;
      }
      #ui-scroll {
        flex: 1;
        overflow-y: auto;
        scrollbar-width: thin;
      }
      #ui-scroll::-webkit-scrollbar {
        width: 8px;
      }
      #ui-scroll::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }
      .inspector-section {
        border-bottom: 1px solid var(--border);
      }
      .section-header {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: var(--text-dim);
      }
      .section-header:hover {
        background: var(--bg-hover);
      }
      .section-header .section-arrow {
        width: 14px;
        height: 14px;
        transition: transform 0.15s;
        flex-shrink: 0;
      }
      .section-header.collapsed .section-arrow {
        transform: rotate(-90deg);
      }
      .section-body {
        padding: 6px 12px 10px;
      }
      .section-body.hidden {
        display: none;
      }
      .prop-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 0;
        min-height: 26px;
      }
      .prop-label {
        width: 108px;
        min-width: 108px;
        font-size: 11px;
        color: var(--text-dim);
        text-align: right;
        padding-right: 4px;
        line-height: 1.2;
      }
      .prop-value {
        flex: 1;
        display: flex;
        gap: 4px;
        align-items: center;
        min-width: 0;
      }
      .prop-input {
        flex: 1;
        height: 22px;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0 6px;
        color: var(--text);
        font-size: 12px;
        font-family: var(--font-mono);
        outline: none;
        min-width: 0;
      }
      .prop-input:focus {
        border-color: var(--accent);
      }
      .prop-color-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 1;
      }
      .prop-color {
        width: 22px;
        height: 22px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        cursor: pointer;
        flex-shrink: 0;
        padding: 0;
        -webkit-appearance: none;
        appearance: none;
      }
      .prop-color::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      .prop-color::-webkit-color-swatch {
        border: none;
        border-radius: 2px;
      }
      .prop-slider-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .prop-num-input {
        width: 72px;
        height: 22px;
        flex-shrink: 0;
        box-sizing: border-box;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0 5px;
        color: var(--text);
        font-size: 11px;
        font-family: var(--font-mono);
        text-align: right;
        outline: none;
      }
      .prop-num-input:focus {
        border-color: var(--accent);
      }
      .prop-num-input::-webkit-outer-spin-button,
      .prop-num-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .prop-num-input[type="number"] {
        appearance: textfield;
        -moz-appearance: textfield;
      }
      .prop-slider {
        flex: 1;
        height: 4px;
        -webkit-appearance: none;
        appearance: none;
        background: var(--bg-input);
        border-radius: 2px;
        outline: none;
        min-width: 0;
      }
      .prop-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
      }
      .prop-toggle {
        width: 14px;
        height: 14px;
        border: 1px solid var(--border-light);
        border-radius: 3px;
        background: var(--bg-input);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        padding: 0;
        color: transparent;
      }
      .prop-toggle.checked {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }
      .prop-toggle svg {
        width: 10px;
        height: 10px;
      }
      .section-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 26px;
        margin-top: 4px;
        background: var(--bg-item);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-dim);
        cursor: pointer;
        font-size: 11px;
        font-family: var(--font);
      }
      .section-btn:hover {
        background: var(--bg-hover);
        color: var(--text);
        border-color: var(--border-light);
      }
      .section-separator {
        height: 1px;
        background: var(--border);
        margin: 6px 0;
      }
      .info-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 0;
        min-height: 26px;
      }
      .info-label {
        width: 108px;
        min-width: 108px;
        font-size: 11px;
        color: var(--text-dim);
        text-align: right;
        padding-right: 4px;
      }
      .info-value {
        flex: 1;
        font-size: 12px;
        color: var(--text);
        font-family: var(--font-mono);
      }
      #info {
        position: fixed;
        bottom: 8px;
        left: 8px;
        color: #ddd;
        font: 11px/1.8 monospace;
        background: rgba(0, 0, 0, 0.55);
        padding: 5px 10px;
        border-radius: 4px;
        pointer-events: none;
      }
      .tex-gallery-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.35px;
        color: var(--text-dim);
        padding: 2px 0 6px;
      }
      .tex-gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0 0 10px;
      }
      .tex-gallery .tex-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        width: 56px;
      }
      .tex-gallery img {
        width: 52px;
        height: 52px;
        object-fit: cover;
        border-radius: var(--radius);
        border: 2px solid var(--border);
        cursor: pointer;
        opacity: 0.75;
        background: var(--bg-input);
        transition:
          opacity 0.15s,
          border-color 0.15s;
      }
      .tex-gallery img:hover {
        opacity: 1;
        border-color: var(--border-light);
      }
      .tex-gallery img.active {
        border-color: var(--accent);
        opacity: 1;
        box-shadow: 0 0 0 1px var(--accent);
      }
      .tex-gallery .tex-label {
        font-size: 9px;
        line-height: 1.2;
        font-family: var(--font-mono);
        color: var(--text-dim);
        text-align: center;
        max-width: 56px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        pointer-events: none;
      }
      .trunk-gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 0 0 10px;
      }
      .trunk-gallery .tex-item {
        width: 104px;
      }
      .trunk-gallery img {
        width: 96px;
        height: 112px;
        object-fit: contain;
        background-color: #2a2a2a;
        background-image: repeating-conic-gradient(
          #3a3a3a 0% 25%,
          #2a2a2a 0% 50%
        );
        background-size: 12px 12px;
      }
      .trunk-gallery .tex-label {
        max-width: 104px;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <div class="panel-header">Tree Editor</div>
      <div id="ui-scroll"></div>
    </div>
    <div id="info">
      Drag to orbit · Scroll to zoom · Middle-drag to pan · Ctrl+Z undo · Ctrl+Y
      redo
    </div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import {
        Fn,
        float,
        vec2,
        vec3,
        vec4,
        uniform,
        attribute,
        varying,
        texture,
        uv,
        mix,
        step,
        smoothstep,
        clamp,
        sin,
        cos,
        abs,
        fract,
        floor,
        dot,
        normalize,
        length,
        add,
        sub,
        mul,
        div,
        max,
        min,
        pow,
        positionLocal,
        positionWorld,
        normalLocal,
        normalWorld,
        cameraPosition,
        modelWorldMatrix,
        negate,
        cross,
        If,
        Loop,
        Break,
        sqrt,
        exp,
      } from "three/tsl";
      import { MeshStandardNodeMaterial } from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import {
        bakeColorAtlasFromObject,
        makeFlatAuxTextures,
        createImpostorMaterials,
      } from "./octahedral-v3/octahedral-core.js";
      import { bakeObjectThumbnails } from "./tools/objectThumbnails.js";

      // ─── CUSTOM INSPECTOR (v2/editor-style) ─────────────────────────────────────
      const _checkSvg =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
      const _arrowSvg =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="section-arrow"><polyline points="6 9 12 15 18 9"></polyline></svg>';
      const _uiRefreshers = [];

      function _fmt(v, step) {
        if (step >= 1) return String(Math.round(v));
        const d = Math.max(0, -Math.floor(Math.log10(step)));
        return v.toFixed(d);
      }

      function _clampSnap(v, min, max, step) {
        if (!Number.isFinite(v)) return min;
        const n = Math.round((v - min) / step);
        let out = min + n * step;
        const stepStr = String(step);
        let decimals = 0;
        if (stepStr.includes(".")) {
          decimals = stepStr.split(".")[1].length;
        } else if (stepStr.includes("e-")) {
          decimals = 8;
        }
        if (decimals > 0) out = Number(out.toFixed(decimals));
        return Math.min(max, Math.max(min, out));
      }

      function _section(parent, title, expanded = true) {
        const sec = document.createElement("div");
        sec.className = "inspector-section";
        const hdr = document.createElement("div");
        hdr.className = "section-header" + (expanded ? "" : " collapsed");
        hdr.innerHTML = _arrowSvg + " " + title;
        const body = document.createElement("div");
        body.className = "section-body" + (expanded ? "" : " hidden");
        hdr.addEventListener("click", () => {
          hdr.classList.toggle("collapsed");
          body.classList.toggle("hidden");
        });
        sec.appendChild(hdr);
        sec.appendChild(body);
        parent.appendChild(sec);
        return body;
      }

      function _slider(parent, obj, key, opts) {
        const { label, min, max, step = 0.01, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        const cur = obj[key];
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><div class="prop-slider-wrap"><input type="range" class="prop-slider" min="${min}" max="${max}" step="${step}" value="${cur}"><input type="number" class="prop-num-input" title="Type an exact value" min="${min}" max="${max}" step="${step}" value="${_fmt(cur, step)}"></div></div>`;
        const sl = row.querySelector(".prop-slider");
        const num = row.querySelector(".prop-num-input");
        const syncNumDisplay = () => {
          num.value = _fmt(obj[key], step);
        };
        const applyFromSlider = () => {
          obj[key] = parseFloat(sl.value);
          syncNumDisplay();
          onChange?.({ value: obj[key] });
        };
        const commitFromNum = () => {
          const raw = String(num.value).trim();
          if (raw === "" || raw === "-" || raw === "." || raw === "-.") {
            syncNumDisplay();
            return;
          }
          let v = parseFloat(raw);
          if (!Number.isFinite(v)) {
            syncNumDisplay();
            return;
          }
          v = _clampSnap(v, min, max, step);
          obj[key] = v;
          sl.value = String(v);
          syncNumDisplay();
          onChange?.({ value: obj[key] });
        };
        sl.addEventListener("input", applyFromSlider);
        num.addEventListener("change", commitFromNum);
        num.addEventListener("keydown", (e) => {
          if (e.key === "Enter") num.blur();
        });
        num.addEventListener(
          "wheel",
          (e) => {
            if (document.activeElement === num) e.preventDefault();
          },
          { passive: false },
        );
        parent.appendChild(row);
        const handle = {
          refresh() {
            sl.value = obj[key];
            syncNumDisplay();
          },
        };
        _uiRefreshers.push(handle);
        return handle;
      }

      function _color(parent, obj, key, opts) {
        const { label, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><div class="prop-color-wrap"><input type="color" class="prop-color" value="${obj[key]}"><span class="prop-slider-val" style="width:auto;font-size:11px;color:var(--text-dim);font-family:var(--font-mono)">${obj[key]}</span></div></div>`;
        const inp = row.querySelector(".prop-color");
        const hex = row.querySelector(".prop-slider-val");
        inp.addEventListener("input", () => {
          obj[key] = inp.value;
          hex.textContent = inp.value;
          onChange?.({ value: obj[key] });
        });
        parent.appendChild(row);
        const handle = {
          refresh() {
            inp.value = obj[key];
            hex.textContent = obj[key];
          },
        };
        _uiRefreshers.push(handle);
        return handle;
      }

      function _toggle(parent, obj, key, opts) {
        const { label, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><button type="button" class="prop-toggle ${obj[key] ? "checked" : ""}">${_checkSvg}</button></div>`;
        const btn = row.querySelector(".prop-toggle");
        btn.addEventListener("click", () => {
          obj[key] = !obj[key];
          btn.classList.toggle("checked", obj[key]);
          onChange?.({ value: obj[key] });
        });
        parent.appendChild(row);
        const handle = {
          refresh() {
            btn.classList.toggle("checked", !!obj[key]);
          },
        };
        _uiRefreshers.push(handle);
        return handle;
      }

      function _text(parent, obj, key, opts) {
        const { label, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><input type="text" class="prop-input" value="${obj[key] ?? ""}"></div>`;
        const inp = row.querySelector(".prop-input");
        inp.addEventListener("change", () => {
          obj[key] = inp.value;
          onChange?.({ value: obj[key] });
        });
        parent.appendChild(row);
        const handle = {
          refresh() {
            inp.value = obj[key] ?? "";
          },
        };
        _uiRefreshers.push(handle);
        return handle;
      }

      function _button(parent, opts) {
        const { title, onClick } = opts;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "section-btn";
        btn.textContent = title;
        btn.addEventListener("click", onClick);
        parent.appendChild(btn);
      }

      function _info(parent, label, getValue) {
        const row = document.createElement("div");
        row.className = "info-row";
        const valSpan = document.createElement("span");
        valSpan.className = "info-value";
        valSpan.textContent = getValue();
        row.innerHTML = `<span class="info-label">${label}</span>`;
        row.appendChild(valSpan);
        parent.appendChild(row);
        const handle = {
          refresh() {
            valSpan.textContent = getValue();
          },
        };
        _uiRefreshers.push(handle);
        return handle;
      }

      function _separator(parent) {
        const div = document.createElement("div");
        div.className = "section-separator";
        parent.appendChild(div);
      }

      function uiRefresh() {
        _uiRefreshers.forEach((h) => h.refresh());
      }

      // Vite serves `public/` at the site root. From v2/arborist.html, bare
      // `textures/...` resolves to /v2/textures/... (HTML fallback). Presets keep
      // the canonical `textures/...` string; resolve to `/textures/...` at load time.
      function resolvePublicPath(path) {
        if (
          !path ||
          path.startsWith("data:") ||
          path.startsWith("http") ||
          path.startsWith("/")
        )
          return path;
        return "/" + path.replace(/^\.\//, "");
      }

      // ─── BUILT-IN LEAF TEXTURES ─────────────────────────────────────────────────
      // NEW set first (these feed the atlas/export — atlas bakes the first 16);
      // OLD placeholders kept below ONLY for side-by-side comparison in the picker.
      // When the new set is final, trim the OLD block so the exported atlas is clean.
      const LEAF_TEXTURES = [
        {
          name: "Billboard 1",
          path: "textures/leaves/Leaf-Billboard-Texture-1.png",
        },
        {
          name: "Billboard 2",
          path: "textures/leaves/Leaf-Billboard-Texture-2.png",
        },
        {
          name: "Billboard 3",
          path: "textures/leaves/Leaf-Billboard-Texture-3.png",
        },
        {
          name: "Billboard 4",
          path: "textures/leaves/Leaf-Billboard-Texture-4.png",
        },
        {
          name: "Billboard 5",
          path: "textures/leaves/Leaf-Billboard-Texture-5.png",
        },
        { name: "Frame 63", path: "textures/leaves/Frame 63.png" },
        { name: "Frame 64", path: "textures/leaves/Frame 64.png" },
        {
          name: "Tree Opacity",
          path: "textures/leaves/tree_Opacity-01 1 1.png",
        },
        // --- OLD placeholders (comparison only) ---
        { name: "[old] Alpha 3", path: "textures/leaves/foliage_alpha3.png" },
        { name: "[old] SDF", path: "textures/leaves/foliageSDF.png" },
        { name: "[old] Frame 7", path: "textures/leaves/Frame 7.png" },
        { name: "[old] Leaf 128", path: "textures/leaves/image 128.png" },
        { name: "[old] Leaf 127", path: "textures/leaves/image 127.png" },
        { name: "[old] Leafcard", path: "textures/leaves/leafcard.jpg" },
      ];

      const MAX_CLUSTERS = 6;
      const LOD_SPACING = 12;
      const LOD_LABEL_Z = 5.2;

      // ─── RENDERER ────────────────────────────────────────────────────────────────
      const renderer = new THREE.WebGPURenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.shadowMap.transmitted = true;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      document.body.appendChild(renderer.domElement);
      await renderer.init();

      // ─── SCENE / CAMERA ──────────────────────────────────────────────────────────
      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#87ceeb");
      scene.fog = null;

      const camera = new THREE.PerspectiveCamera(
        55,
        innerWidth / innerHeight,
        0.1,
        3000,
      );
      camera.position.set(7, 5, 10);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 3, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.update();

      // ─── LIGHTING ────────────────────────────────────────────────────────────────
      const hemi = new THREE.HemisphereLight("#b8dfff", "#3d6b20", 0.8);
      scene.add(hemi);

      const sun = new THREE.DirectionalLight("#fff8e8", 2.2);
      sun.position.set(5, 12, 4);
      sun.castShadow = true;
      // Single-tree editor: tighten the shadow frustum to ~fit the tree + the
      // -12/0/+12 LOD previews so the 4096 map isn't wasted on empty ground.
      // 4096 / 40m ≈ 102 texels/m (vs the old 2048 / 60m ≈ 34) — ~3x crisper, so
      // the thin trunk shadow stops looking blocky.
      sun.shadow.mapSize.set(4096, 4096);
      sun.shadow.camera.near = 0.5;
      sun.shadow.camera.far = 200;
      sun.shadow.camera.left = -20;
      sun.shadow.camera.right = 20;
      sun.shadow.camera.top = 20;
      sun.shadow.camera.bottom = -20;
      sun.shadow.bias = -0.0005;
      sun.shadow.normalBias = 0.02;
      scene.add(sun);

      // ─── GROUND ──────────────────────────────────────────────────────────────────
      const groundGeo = new THREE.CircleGeometry(40, 72);
      const groundMat = new THREE.MeshStandardMaterial({
        color: "#4a7c2a",
        roughness: 0.92,
        metalness: 0,
      });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      const pebbleGeo = new THREE.SphereGeometry(0.12, 5, 3);
      const pebbleMat = new THREE.MeshStandardMaterial({
        color: "#888",
        roughness: 0.95,
      });
      [
        [-1.8, 0, 1.4],
        [2.2, 0, 0.9],
        [-0.5, 0, 2.3],
        [1.5, 0, -1.7],
      ].forEach(([x, y, z]) => {
        const p = new THREE.Mesh(pebbleGeo, pebbleMat);
        p.position.set(x, 0.07, z);
        p.scale.y = 0.5 + Math.random() * 0.5;
        scene.add(p);
      });

      // ─── PROCEDURAL TRUNK MATERIAL (TSL) ─────────────────────────────────────────
      // Shared by the default cylinder AND any imported GLB trunk, so trunks get a
      // bark colour with NO texture needed. Cheap: a vertical 2-colour gradient
      // (world-Y from the ground up) + roughness, metalness 0 (so it bakes the same
      // colour it shows — no sky-reflection metal trap). Live-tunable via uniforms.
      const uTrunkBot = uniform(new THREE.Color(0x4a2f17));
      const uTrunkTop = uniform(new THREE.Color(0x6b4a2b));
      const uTrunkGradH = uniform(6.0);
      const uTrunkRough = uniform(0.9);
      const trunkMat = new MeshStandardNodeMaterial({ metalness: 0 });
      trunkMat.colorNode = mix(
        uTrunkBot,
        uTrunkTop,
        smoothstep(
          float(0.0),
          float(1.0),
          div(positionWorld.y, max(uTrunkGradH, float(0.001))),
        ),
      );
      trunkMat.roughnessNode = uTrunkRough;

      // ─── DEFAULT TRUNK PLACEHOLDER ───────────────────────────────────────────────
      const defTrunkGeo = new THREE.CylinderGeometry(0.1, 0.3, 5.0, 10, 3);
      const defaultTrunk = new THREE.Mesh(defTrunkGeo, trunkMat);
      defaultTrunk.position.y = 2.5;
      defaultTrunk.castShadow = true;
      defaultTrunk.receiveShadow = true;
      defaultTrunk.visible = false;
      scene.add(defaultTrunk);

      let trunkRoot = null;
      let trunkLod1Root = null;

      // ─── LEAF TEXTURE ────────────────────────────────────────────────────────────
      // Atlas sampling. uUseAtlas=1 remaps the leaf quad uv into a cell; 0 leaves
      // it unchanged (standalone rendering identical to before). The cell index is
      // a PER-INSTANCE attribute (aAtlasIndex) — uniform across one arborist tree,
      // but per-tree-type in v2's merged mesh. That per-instance index is what lets
      // v2 batch every tree type on ONE material. Grid packed as
      // (cols, cellStep=cellPx/size, gutterFrac, innerFrac); math is identical in
      // arborist and v2 so the contract can't drift.
      let atlasCellIndex = 0;
      const uUseAtlas = uniform(0.0);
      const uAtlasGrid = uniform(
        new THREE.Vector4(4, 0.25, 12 / 1024, 232 / 1024),
      );
      const aAtlasIndex = attribute("aAtlasIndex", "float");
      const _leafBaseUv = uv();
      const _agCols = uAtlasGrid.x;
      const _agRow = floor(aAtlasIndex.div(_agCols));
      const _agCol = aAtlasIndex.sub(_agRow.mul(_agCols));
      const _agOx = _agCol.mul(uAtlasGrid.y).add(uAtlasGrid.z);
      const _agOy = _agCols
        .sub(1)
        .sub(_agRow)
        .mul(uAtlasGrid.y)
        .add(uAtlasGrid.z);
      const _leafCellUv = _leafBaseUv.mul(uAtlasGrid.w).add(vec2(_agOx, _agOy));
      const _leafSampleUv = mix(_leafBaseUv, _leafCellUv, uUseAtlas);
      const leafMapNode = texture(new THREE.Texture(), _leafSampleUv);
      // 0 = sample mask from .r (grayscale/RGB-only PNGs), 1 = sample from .a (RGBA PNGs).
      // Set per-texture by detectAlphaChannel() after load.
      const uMaskInAlpha = uniform(0.0);
      // Built-in texture: activeLeafTexPath = "textures/leaves/...".
      // User-loaded texture: activeLeafTexDataUrl = "data:image/...;base64,...".
      // At most one is non-empty; both are serialized as `leafTexture` in the preset.
      let activeLeafTexPath = "";
      let activeLeafTexDataUrl = "";

      // Detects whether an image's alpha channel carries meaningful (<255) data.
      // Used to decide which channel holds the leaf mask.
      function detectAlphaChannel(image) {
        try {
          const w = image.width || image.naturalWidth;
          const h = image.height || image.naturalHeight;
          if (!w || !h) return false;
          const c = document.createElement("canvas");
          c.width = w;
          c.height = h;
          const ctx = c.getContext("2d", { willReadFrequently: true });
          ctx.drawImage(image, 0, 0);
          const data = ctx.getImageData(0, 0, w, h).data;
          // Sample every 4th pixel for speed; bail on first sub-opaque alpha.
          for (let i = 3; i < data.length; i += 16) {
            if (data[i] < 255) return true;
          }
          return false;
        } catch (e) {
          // Cross-origin tainted canvas etc. — fall back to red-channel.
          return false;
        }
      }

      function applyMaskChannelFor(tex) {
        const img = tex.image;
        uMaskInAlpha.value = detectAlphaChannel(img) ? 1.0 : 0.0;
      }

      function loadLeafTexFromPath(path) {
        const url = resolvePublicPath(path);
        const loader = new THREE.TextureLoader();
        loader.load(
          url,
          (tex) => {
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.needsUpdate = true;
            leafMapNode.value = tex;
            applyMaskChannelFor(tex);
            activeLeafTexPath = path;
            activeLeafTexDataUrl = "";
            params.leafTexFile = path;
            updateGallerySelection();
          },
          undefined,
          (err) => console.error("Leaf texture load failed:", url, err),
        );
      }

      function loadLeafTexFromFile(file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const dataUrl = ev.target.result;
          loadLeafTexFromDataUrl(dataUrl, file.name);
        };
        reader.readAsDataURL(file);
      }

      // Used both by file uploads and by preset loads that embedded the texture.
      function loadLeafTexFromDataUrl(dataUrl, displayName) {
        const img = new Image();
        img.onload = () => {
          const tex = new THREE.Texture(img);
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.needsUpdate = true;
          leafMapNode.value = tex;
          applyMaskChannelFor(tex);
          activeLeafTexPath = "";
          activeLeafTexDataUrl = dataUrl;
          params.leafTexFile = displayName || "(embedded)";
          updateGallerySelection();
        };
        img.src = dataUrl;
      }

      // ─── TEXTURE GALLERY (mounted in Leaf Texture panel) ─────────────────────────
      let galleryImgs = [];

      function updateGallerySelection() {
        galleryImgs.forEach((img, i) => {
          img.classList.toggle(
            "active",
            LEAF_TEXTURES[i].path === activeLeafTexPath,
          );
        });
      }

      function buildTexGallery(parent) {
        const label = document.createElement("div");
        label.className = "tex-gallery-label";
        label.textContent = "Built-in textures";
        parent.appendChild(label);

        const galleryEl = document.createElement("div");
        galleryEl.className = "tex-gallery";
        parent.appendChild(galleryEl);

        galleryImgs = [];
        LEAF_TEXTURES.forEach((t) => {
          const wrap = document.createElement("div");
          wrap.className = "tex-item";
          const img = document.createElement("img");
          img.src = resolvePublicPath(t.path);
          img.title = t.name;
          img.alt = t.name;
          img.addEventListener("click", () => loadLeafTexFromPath(t.path));
          wrap.appendChild(img);
          const cap = document.createElement("div");
          cap.className = "tex-label";
          cap.textContent = t.name;
          wrap.appendChild(cap);
          galleryEl.appendChild(wrap);
          galleryImgs.push(img);
        });
        updateGallerySelection();
      }

      // ─── MATERIAL UNIFORMS ───────────────────────────────────────────────────────
      const uTime = uniform(0.0);
      const uYMin = uniform(0.0);
      const uYMax = uniform(8.0);
      const uBottomColor = uniform(new THREE.Color("#2d5a1b"));
      const uTopColor = uniform(new THREE.Color("#5aaa2a"));
      const uColorVar = uniform(0.12);
      const uAlphaCutoff = uniform(0.45);
      const uSssColor = uniform(new THREE.Color("#c8e070"));
      const uSssStr = uniform(0.0);
      const uSssPow = uniform(2.0);
      const uRimColor = uniform(new THREE.Color("#c8ffaa"));
      const uRimStr = uniform(0.07);
      const uRimPow = uniform(2.5);
      const uAoStr = uniform(0.7);
      const uSunDir = uniform(new THREE.Vector3(5, 12, 4).normalize());
      const uWindSpeed = uniform(0.9);
      const uWindStr = uniform(0.0);
      const uWindMicro = uniform(0.0);
      const uCanopyCenter = uniform(new THREE.Vector3(0, 4, 0));
      const uAoRadius = uniform(6.0);
      const uNormalBias = uniform(1.0);
      const uLeafWarp = uniform(0.28);
      const uBillboard = uniform(1.0);
      const uBillboardYaw = uniform(0.0);

      // ─── LEAF MATERIAL (TSL) ─────────────────────────────────────────────────────
      const aRand = attribute("aRand", "vec2");
      const aLeafScale = attribute("aLeafScale", "float");
      const aLeafCenter = attribute("aLeafCenter", "vec3");
      // Per-instance world-space center — instance-aware (modelWorldMatrix * leaf center)
      const instanceCenterW = modelWorldMatrix.mul(vec4(aLeafCenter, 1)).xyz;

      const leafWindOffset = Fn(() => {
        const phase = aRand.x.mul(6.2832);
        const tipFactor = positionLocal.y.add(0.5);
        const sway = sin(uTime.mul(uWindSpeed).add(phase))
          .mul(uWindStr)
          .mul(tipFactor);
        const micro = sin(uTime.mul(3.1).add(phase.mul(2.6)))
          .mul(uWindMicro)
          .mul(tipFactor);
        const swayZ = cos(uTime.mul(uWindSpeed.mul(0.8)).add(phase.mul(1.3)))
          .mul(uWindStr.mul(0.5))
          .mul(tipFactor);
        return vec3(sway.add(micro), float(0), swayZ);
      });

      const positionNode = Fn(() => {
        // Wind is a world-space delta (sway along world X, swayZ along world Z).
        // Must NOT be projected into the camera basis or it appears to rotate with the camera.
        const wo = leafWindOffset();
        const pivotW = instanceCenterW;
        const toCam = normalize(sub(cameraPosition, pivotW));
        const horiz = vec3(toCam.x, float(0), toCam.z);
        const hLen = length(horiz);
        const useH = step(float(0.0001), hLen);
        const yawDir = normalize(
          add(
            mul(normalize(horiz), useH),
            mul(vec3(0, 0, float(1)), sub(float(1), useH)),
          ),
        );
        const face = normalize(mix(toCam, yawDir, uBillboardYaw));
        const worldUp = vec3(0, 1, 0);
        // NaN-safe basis: pick the non-degenerate cross BEFORE normalizing.
        const cA = cross(worldUp, face);
        const cB = cross(vec3(-1, 0, 0), face);
        const right = normalize(mix(cA, cB, step(float(0.99), abs(face.y))));
        const upv = normalize(cross(face, right));
        // Per-leaf 2D rotation of the camera-aligned quad around the face axis.
        // Breaks up the "all billboards point the same way" tell. Uses aRand.x
        // (already deterministic per leaf and shared with v2).
        const ang = aRand.x.mul(6.2831853);
        const cosA = cos(ang);
        const sinA = sin(ang);
        const rRight = right.mul(cosA).add(upv.mul(sinA));
        const rUp = upv.mul(cosA).sub(right.mul(sinA));
        // Camera-aligned quad from positionLocal only (no wind in the basis).
        const bbQuad = add(
          mul(rRight, mul(positionLocal.x, aLeafScale)),
          mul(rUp, mul(positionLocal.y, aLeafScale)),
        );
        // World-space wind, scaled with leaf size.
        const windWorld = mul(wo, aLeafScale);
        const bb3 = bbQuad.add(windWorld);
        // Non-billboard branch: wind added in local space (rotates with the leaf — acceptable).
        return mix(positionLocal.add(wo), bb3, uBillboard);
      })();

      // Stylized foliage lighting: every leaf uses world-up as its normal so the
      // entire canopy lights as one uniform "puff." Per-leaf sphereDir variation
      // produces visible per-leaf shading noise that swings as the camera orbits
      // (different leaves come to the front). Uniform world-up gives a stable,
      // angle-independent appearance; shape comes from AO and the height gradient,
      // not from per-leaf normal variation. Matches the BotW/Genshin stylized look.
      const sphereDir = vec3(0, 1, 0);
      // SSS uses the per-leaf outward direction (not the uniform sphereDir) so
      // backlit leaves on the anti-sun hemisphere still glow with the SSS color.
      // Kept separate so Lambert stays uniform but SSS gives the stylized highlight.
      const sphereDirForSSS = normalize(instanceCenterW.sub(uCanopyCenter));
      const leafBillboardFace = Fn(() => {
        const pivotW = instanceCenterW;
        const toCam = normalize(sub(cameraPosition, pivotW));
        const horiz = vec3(toCam.x, float(0), toCam.z);
        const hLen = length(horiz);
        const useH = step(float(0.0001), hLen);
        const yawDir = normalize(
          add(
            mul(normalize(horiz), useH),
            mul(vec3(0, 0, float(1)), sub(float(1), useH)),
          ),
        );
        return normalize(mix(toCam, yawDir, uBillboardYaw));
      })();
      const warpedNormal = normalize(
        normalLocal.add(sin(uv().x.mul(10)).mul(uLeafWarp)),
      );
      const geomForMix = normalize(
        mix(warpedNormal, leafBillboardFace, uBillboard),
      );
      const finalNormal = normalize(mix(geomForMix, sphereDir, uNormalBias));

      const colorNode = Fn(() => {
        const h1 = aRand.x;
        const h2 = aRand.y;
        const heightFactor = clamp(
          positionWorld.y.sub(uYMin).div(max(uYMax.sub(uYMin), float(0.001))),
          float(0),
          float(1),
        );
        let col = mix(uBottomColor, uTopColor, heightFactor);
        const varMul = h1
          .mul(uColorVar.mul(2.0))
          .add(float(1.0).sub(uColorVar));
        col = col.mul(varMul);
        const hueShift = h2.sub(0.5).mul(uColorVar.mul(0.4));
        col = vec3(
          col.x.add(hueShift.mul(0.3)),
          col.y,
          col.z.sub(hueShift.mul(0.2)),
        );
        // Height-based AO
        const aoHeight = mix(
          float(1.0).sub(uAoStr),
          float(1.0),
          heightFactor.mul(0.8).add(0.2),
        );
        col = col.mul(aoHeight);
        // Sphere-distance AO: inner leaves darker
        const distC = clamp(
          length(sub(positionWorld, uCanopyCenter)).div(
            max(uAoRadius, float(0.001)),
          ),
          float(0),
          float(1),
        );
        const aoSphere = mix(float(1.0).sub(uAoStr), float(1.0), distC);
        col = col.mul(aoSphere);
        const viewDir = normalize(cameraPosition.sub(positionWorld));
        const n = normalWorld;
        // SSS uses per-leaf sphere direction so backlit anti-sun leaves glow,
        // while Lambert (via normalWorld = uniform world-up) stays stable.
        const backDot = max(dot(negate(uSunDir), sphereDirForSSS), float(0));
        const sss = pow(backDot, uSssPow).mul(uSssStr);
        col = col.add(uSssColor.mul(sss));
        // Rim uses per-leaf sphere direction (not the uniform up normal) so it
        // activates on leaves whose outward direction is perpendicular to view —
        // i.e. the canopy silhouette from any camera angle. Without this, rim
        // would be a "horizon glow" tied to camera height and would only show
        // up on the AO-darkened bottom, looking like SSS instead of edge rim.
        const rimDot = float(1.0).sub(
          max(dot(sphereDirForSSS, viewDir), float(0)),
        );
        const rim = pow(rimDot, uRimPow).mul(uRimStr);
        col = col.add(uRimColor.mul(rim));
        return clamp(col, float(0), float(2));
      })();

      // Selects the leaf mask channel based on the loaded texture format.
      // uMaskInAlpha = 0 -> .r (grayscale / RGB-only PNGs), = 1 -> .a (RGBA PNGs).
      const leafMaskCh = mix(leafMapNode.r, leafMapNode.a, uMaskInAlpha);

      const opacityNode = Fn(() => {
        const camDist = length(cameraPosition.sub(positionWorld));
        const distFade = clamp(camDist.div(float(150.0)), float(0), float(1));
        const adaptiveCutoff = mix(uAlphaCutoff, float(0.15), distFade);
        return smoothstep(
          adaptiveCutoff.sub(0.05),
          adaptiveCutoff.add(0.05),
          leafMaskCh,
        );
      })();

      const leafMat = new MeshStandardNodeMaterial({
        side: THREE.DoubleSide,
        transparent: false,
        alphaTest: 0.3,
        roughness: 1.0,
        metalness: 0.0,
        depthWrite: true,
      });
      leafMat.positionNode = positionNode;
      leafMat.normalNode = finalNormal;
      leafMat.colorNode = colorNode;
      leafMat.opacityNode = opacityNode;
      leafMat.envMapIntensity = 0;
      leafMat.castShadowNode = Fn(() => {
        // Match the visible pass: same channel select and same alphaTest threshold (0.3),
        // so the shadow silhouette aligns with the leaf silhouette.
        const a = smoothstep(
          uAlphaCutoff.sub(0.05),
          uAlphaCutoff.add(0.05),
          leafMaskCh,
        );
        a.lessThan(float(0.3)).discard();
        return vec4(0, 0, 0, 1);
      })();

      // ─── CLUSTER DEFINITIONS (6 slots) ──────────────────────────────────────────
      // --- DAY/NIGHT SKY (inlined verbatim copy of v2/render/sky/dayNightSky.js) ---
      // Source of truth = v2 module (itself a copy of the daynight-sky lab).
      // Only change vs source: SKY_RADIUS 4000 -> 1500 to fit this editor camera far.
      const SKY_RADIUS = 1500;

      function createDayNightSky() {
        // ── Uniforms (driven from PARAMS each frame) ─────────────────────────────
        const uSunDir = uniform(new THREE.Vector3(0, 1, 0));
        const uMoonDir = uniform(new THREE.Vector3(0, -1, 0));
        const uTime = uniform(0);

        const uZenithDay = uniform(new THREE.Color(0x2a6bd8));
        const uHorizonDay = uniform(new THREE.Color(0xbfe0ff));
        const uZenithNight = uniform(new THREE.Color(0x05080f));
        const uHorizonNight = uniform(new THREE.Color(0x1a2740));
        const uSunsetColor = uniform(new THREE.Color(0xff7a33));
        const uGroundColor = uniform(new THREE.Color(0x4a4a52));

        // ── Atmospheric scattering (Nishita single-scattering) ───────────────────
        // 0 = the analytic gradient above; 1 = a physically-based Rayleigh+Mie
        // raymarch that gives the whole-sky sun glow, true horizon brightening, the
        // belt of Venus and automatic sunset gradients. Drawn additively over the
        // night gradient, so twilight carries itself as the sun drops.
        const uScatterMix = uniform(1);
        const uSunIntensity = uniform(22); // disc-of-the-sun radiance scale
        const uRayleigh = uniform(1.0); // βR multiplier (sky blueness)
        const uMie = uniform(1.0); // βM multiplier (haze / sun aureole)
        const uMieG = uniform(0.76); // Mie anisotropy (aureole tightness)
        const uAtmoAltitude = uniform(1500); // viewer height in the atmosphere (m)
        const uHr = uniform(7994); // Rayleigh scale height (m)
        const uHm = uniform(1200); // Mie scale height (m)
        const uBetaR = uniform(new THREE.Vector3(5.5e-6, 13.0e-6, 22.4e-6));
        const uBetaM = uniform(21e-6);
        // Multiple-scattering approximation (no LUT): bounced light is ~isotropic and
        // less path-extincted, so it fills the long-path horizon (bright glow) and
        // shadowed twilight sky that single-scatter leaves dark. Gated by sun
        // visibility so the night stays dark.
        const uMsAmount = uniform(1.0); // strength of the multi-scatter fill
        const uMsExtinct = uniform(0.3); // <1 = bounced light keeps more energy
        const RG = 6360e3,
          RT = 6420e3; // planet / atmosphere radii (m)

        const uSunColor = uniform(new THREE.Color(0xfff3d8));
        const uSunCos = uniform(Math.cos(THREE.MathUtils.degToRad(1.2)));
        const uSunGlowPow = uniform(280);
        const uSunGlowStrength = uniform(0.55);
        const uSunDiscBright = uniform(8.0);

        const uMoonColor = uniform(new THREE.Color(0xcdd9ff));
        const uMoonCos = uniform(Math.cos(THREE.MathUtils.degToRad(1.6)));
        const uMoonGlowPow = uniform(900);
        const uMoonGlowStrength = uniform(0.25);
        const uMoonDiscBright = uniform(3.0);
        // Phase/surface (the moon is rendered as a reconstructed sphere in the disc).
        const uMoonRight = uniform(new THREE.Vector3(1, 0, 0));
        const uMoonUp = uniform(new THREE.Vector3(0, 1, 0));
        const uMoonLightDir = uniform(new THREE.Vector3(0, 0, 1)); // phase illumination dir
        const uMoonSinR = uniform(Math.sin(THREE.MathUtils.degToRad(1.6)));
        const uMoonSurface = uniform(0.85); // maria/crater strength
        const uMoonEarthshine = uniform(0.12); // ashen glow on the dark side
        const uMoonTermSoft = uniform(0.06); // terminator softness
        const uMoonEdgeSoft = uniform(0.04); // disc edge anti-alias

        // Module-scratch vectors for the per-frame moon frame.
        const _mRight = new THREE.Vector3();
        const _mUp = new THREE.Vector3();
        const _mL = new THREE.Vector3();
        const _mUpRef = new THREE.Vector3();
        const _mTmp = new THREE.Vector3();

        const uStarDensity = uniform(220);
        const uStarThreshold = uniform(0.92);
        const uStarSize = uniform(0.08);
        const uStarBrightness = uniform(1.0);
        const uStarTwinkle = uniform(3.0);

        // ── Milky Way band ────────────────────────────────────────────────────────
        const uMilkyWayEnabled = uniform(1);
        const uMilkyWayIntensity = uniform(1.0);
        const uMilkyWayWidth = uniform(0.32); // half-width of the band (|latitude|)
        const uMilkyWayScale = uniform(4.0); // noise feature scale
        const uMilkyWayColor1 = uniform(new THREE.Color(0x5566a0)); // cool dust
        const uMilkyWayColor2 = uniform(new THREE.Color(0xefe6cf)); // warm star clouds
        const uGalacticPole = uniform(
          new THREE.Vector3(0.34, 0.5, 0.8).normalize(),
        );

        // ── Shooting stars (procedural, stateless) ────────────────────────────────
        const uMeteorEnabled = uniform(1);
        const uMeteorIntensity = uniform(1.0);
        const uMeteorRate = uniform(0.45); // fraction of epochs that spawn a meteor
        const uMeteorSpeed = uniform(1.0);
        const uMeteorWidth = uniform(0.006); // streak thickness (radians of arc)
        const uMeteorLength = uniform(0.1); // trail length (radians of arc)

        // ── High cirrus deck (2D analytic clouds painted on the dome) ─────────────
        // Cheap fbm clouds projected onto a horizontal plane (so they converge to
        // the horizon like a real high deck). Complements the volumetric cumulus and
        // doubles as a perf fallback when the raymarch is off. Relit by sun/moon.
        const uCloudEnabled = uniform(1);
        const uCloudCoverage = uniform(0.5); // fraction of sky covered
        const uCloudDensity = uniform(0.85); // per-cloud opacity
        const uCloudOpacity = uniform(1.0); // master opacity
        const uCloudScale = uniform(0.7); // feature scale (bigger = smaller clouds)
        const uCloudStretch = uniform(2.5); // anisotropy → cirrus streaks
        const uCloudSharpness = uniform(0.22); // coverage edge softness
        const uCloudDetail = uniform(0.8); // fine-detail octave mix
        const uCloudSunTint = uniform(1.0); // strength of warm sunset tint
        const uCloudSpeed = uniform(0.01); // drift speed
        const uCloudWind = uniform(new THREE.Vector2(1, 0.35)); // drift direction
        const uCloudColor = uniform(new THREE.Color(0xffffff));
        const uCloudAerial = uniform(0.8); // aerial perspective: low cirrus → sky behind it

        const uFogEnabled = uniform(0);
        const uFogColor = uniform(new THREE.Color(0x9fb8c4));
        const uFogDensity = uniform(0.0003);
        // How high up the sky the horizon haze climbs (in `up`, i.e. sin of elevation).
        // Smaller = the haze hugs the waterline, leaving the scattering's bright
        // horizon band visible instead of washing it out.
        const uFogHazeHeight = uniform(0.12);

        // ── Hash + star field ────────────────────────────────────────────────────
        const hash33 = Fn(([p]) => {
          const q = vec3(
            dot(p, vec3(127.1, 311.7, 74.7)),
            dot(p, vec3(269.5, 183.3, 246.1)),
            dot(p, vec3(113.5, 271.9, 124.6)),
          );
          return fract(sin(q).mul(43758.5453123));
        });

        // Varied star field: per-cell hash drives presence, position, SIZE, magnitude
        // and COLOR (cool blue-white → warm), so the field reads natural, not uniform.
        const starField = Fn(([dir]) => {
          const sp = dir.mul(uStarDensity);
          const cell = floor(sp);
          const f = fract(sp).sub(0.5);
          const rnd = hash33(cell);
          // Sparse: only cells whose hash clears the threshold hold a star.
          const present = step(uStarThreshold, rnd.x);
          const off = hash33(cell.add(vec3(1.7, 9.2, 3.3)))
            .sub(0.5)
            .mul(0.7);
          const d = length(f.sub(off));
          const size = uStarSize.mul(mix(float(0.45), float(1.7), rnd.z)); // a few bright, many faint
          const core = smoothstep(size, float(0.0), d);
          const mag = mix(float(0.3), float(1.0), rnd.y.mul(rnd.y)); // skew dim
          const tw = sin(uTime.mul(uStarTwinkle).add(rnd.y.mul(6.2831)))
            .mul(0.35)
            .add(0.65);
          const col = mix(
            vec3(0.72, 0.82, 1.0),
            vec3(1.0, 0.86, 0.66),
            rnd.z.mul(rnd.z),
          );
          return col.mul(
            present.mul(core).mul(mag).mul(tw).mul(uStarBrightness),
          );
        });

        // Procedural shooting stars: a few stateless "slots", each cycling on its own
        // period. A lucky epoch spawns a meteor that sweeps a SHORT arc; we light the
        // thin line SEGMENT [tail→head] on the sphere (distance to the chord), bright
        // at the head and fading to the tail. No buffers; gated by night at call site.
        const shootingStars = Fn(([dir]) => {
          const acc = vec3(0.0).toVar();
          Loop(3, ({ i }) => {
            const slot = float(i);
            const period = float(5.0);
            const tt = uTime.mul(uMeteorSpeed).div(period).add(slot.mul(0.41));
            const epoch = floor(tt);
            const p = fract(tt); // 0..1 within this slot's cycle
            const h = hash33(
              vec3(epoch.add(slot.mul(17.3)), slot.add(3.0), 5.1),
            );
            const lucky = step(uMeteorRate.oneMinus(), h.x);
            // Brief visible burst within the cycle (fade in, fade out).
            const win = smoothstep(float(0.0), float(0.05), p)
              .mul(smoothstep(float(0.3), float(0.12), p))
              .toVar();
            // Random great circle: upward-biased anchor A + a perpendicular tangent T.
            const A = normalize(
              vec3(h.x.sub(0.5), h.y.mul(0.6).add(0.4), h.z.sub(0.5)),
            ).toVar();
            const h2 = hash33(vec3(epoch.add(11.0), slot.add(5.0), 2.2)).sub(
              0.5,
            );
            const T = normalize(h2.sub(A.mul(dot(h2, A)))).toVar();
            // Head sweeps the arc over the burst; tail trails behind by uMeteorLength.
            const headAng = p.mul(0.55).toVar();
            const tailAng = headAng.sub(uMeteorLength);
            const headDir = A.mul(cos(headAng))
              .add(T.mul(sin(headAng)))
              .toVar();
            const tailDir = A.mul(cos(tailAng))
              .add(T.mul(sin(tailAng)))
              .toVar();
            // Closest point on the chord [tail→head]; chord ≈ arc for short segments.
            const e = headDir.sub(tailDir);
            const u = clamp(
              dot(dir.sub(tailDir), e).div(dot(e, e).max(float(1e-5))),
              float(0.0),
              float(1.0),
            );
            const dist = length(dir.sub(tailDir.add(e.mul(u))));
            const line = smoothstep(uMeteorWidth, float(0.0), dist).mul(
              u.mul(u),
            ); // taper to tail
            const head = smoothstep(
              uMeteorWidth.mul(2.5),
              float(0.0),
              length(dir.sub(headDir)),
            ); // bright tip
            const m = lucky.mul(win).mul(line.add(head));
            acc.addAssign(vec3(0.85, 0.92, 1.0).mul(m));
          });
          return acc.mul(uMeteorIntensity);
        });

        // ── Procedural moon surface (value-noise fbm → maria + craters) ────────────
        const hash13 = Fn(([p]) =>
          fract(sin(dot(p, vec3(12.9898, 78.233, 37.719))).mul(43758.5453)),
        );
        const vnoise = Fn(([p]) => {
          const i = floor(p);
          const f = fract(p);
          const u = f.mul(f).mul(f.mul(-2.0).add(3.0));
          const c000 = hash13(i.add(vec3(0, 0, 0)));
          const c100 = hash13(i.add(vec3(1, 0, 0)));
          const c010 = hash13(i.add(vec3(0, 1, 0)));
          const c110 = hash13(i.add(vec3(1, 1, 0)));
          const c001 = hash13(i.add(vec3(0, 0, 1)));
          const c101 = hash13(i.add(vec3(1, 0, 1)));
          const c011 = hash13(i.add(vec3(0, 1, 1)));
          const c111 = hash13(i.add(vec3(1, 1, 1)));
          const x00 = mix(c000, c100, u.x),
            x10 = mix(c010, c110, u.x);
          const x01 = mix(c001, c101, u.x),
            x11 = mix(c011, c111, u.x);
          return mix(mix(x00, x10, u.y), mix(x01, x11, u.y), u.z);
        });
        const fbm3 = Fn(([p]) =>
          vnoise(p)
            .add(vnoise(p.mul(2.03).add(11.5)).mul(0.5))
            .add(vnoise(p.mul(4.01).add(31.7)).mul(0.25))
            .div(1.75),
        );

        // ── Nishita single-scattering atmosphere ─────────────────────────────────
        // Marches the view ray through the atmosphere shell; at each step a short
        // light-march toward the sun gives the optical depth to space, and Rayleigh
        // (molecular, blue) + Mie (aerosol, forward-peaked white) scattering are
        // accumulated with their phase functions. Output is HDR radiance (tone-mapped
        // into the sky RT with the rest of the scene).
        const atmosphere = Fn(([dir, sunDir]) => {
          const orig = vec3(0, float(RG).add(uAtmoAltitude), 0).toVar();
          const b = dot(orig, dir).toVar();
          const ococ = dot(orig, orig);
          // Far intersection with the atmosphere top (origin is always inside).
          const discA = b.mul(b).sub(ococ.sub(float(RT * RT)));
          const tmax = b
            .negate()
            .add(sqrt(discA.max(0.0)))
            .toVar();
          // Clamp the march to the ground if the planet is hit ahead (bright horizon).
          const discG = b.mul(b).sub(ococ.sub(float(RG * RG)));
          const tg = b.negate().sub(sqrt(discG.max(0.0)));
          If(discG.greaterThan(0.0).and(tg.greaterThan(0.0)), () => {
            tmax.assign(min(tmax, tg));
          });

          const betaR = uBetaR.mul(uRayleigh);
          const betaM = uBetaM.mul(uMie);
          const NS = 16,
            NL = 8;
          const segLen = tmax.div(float(NS)).toVar();
          const tCur = float(0.0).toVar();
          const sumR = vec3(0.0).toVar();
          const sumM = vec3(0.0).toVar();
          const sumMS = vec3(0.0).toVar(); // isotropic multiple-scatter fill
          const odR = float(0.0).toVar();
          const odM = float(0.0).toVar();

          Loop(NS, () => {
            const sp = orig.add(dir.mul(tCur.add(segLen.mul(0.5))));
            const h = length(sp).sub(float(RG));
            const hr = exp(h.negate().div(uHr)).mul(segLen);
            const hm = exp(h.negate().div(uHm)).mul(segLen);
            odR.addAssign(hr);
            odM.addAssign(hm);

            // Light march toward the sun for the optical depth (extinction to space).
            // No early-out on going underground: clamp the sample altitude at the ground
            // so the march stays continuous; the shadow itself is the smooth analytic
            // terminator below (replaces the old hard lit/shadow flip + Break).
            const bl = dot(sp, sunDir);
            const discL = bl.mul(bl).sub(dot(sp, sp).sub(float(RT * RT)));
            const segL = bl
              .negate()
              .add(sqrt(discL.max(0.0)))
              .div(float(NL))
              .toVar();
            const tCurL = float(0.0).toVar();
            const odLR = float(0.0).toVar();
            const odLM = float(0.0).toVar();
            Loop(NL, () => {
              const spl = sp.add(sunDir.mul(tCurL.add(segL.mul(0.5))));
              const hl = length(spl).sub(float(RG)).max(0.0); // clamp at ground
              odLR.addAssign(exp(hl.negate().div(uHr)).mul(segL));
              odLM.addAssign(exp(hl.negate().div(uHm)).mul(segL));
              tCurL.addAssign(segL);
            });

            // Soft analytic ground shadow: `m` is the sun's height above THIS sample's
            // geometric horizon (m = bl + sqrt(|sp|²−RG²)) — >0 lit, <0 shadowed, 0 at
            // the tangent terminator. Continuous & branchless, so single- and
            // multi-scatter fade gradually across twilight instead of snapping per
            // sample (the old hard `valid`/Break did).
            const m = bl.add(
              sqrt(
                dot(sp, sp)
                  .sub(float(RG * RG))
                  .max(0.0),
              ),
            );
            const litSoft = smoothstep(
              float(-9000.0),
              float(9000.0),
              m,
            ).toVar();

            const tau = betaR
              .mul(odR.add(odLR))
              .add(betaM.mul(1.1).mul(odM.add(odLM)));
            const att = vec3(
              exp(tau.x.negate()),
              exp(tau.y.negate()),
              exp(tau.z.negate()),
            );
            sumR.addAssign(att.mul(hr).mul(litSoft));
            sumM.addAssign(att.mul(hm).mul(litSoft));
            // Multiple-scatter fill: extinct only by the (reduced) VIEW path — the
            // bounced light is local, so it isn't dimmed by the long path to the sun.
            // (OFF by default now — msAmount=0; kept here for when it's dialed back up.)
            const tauV = betaR.mul(odR).add(betaM.mul(1.1).mul(odM));
            const attMS = vec3(
              exp(tauV.x.mul(uMsExtinct).negate()),
              exp(tauV.y.mul(uMsExtinct).negate()),
              exp(tauV.z.mul(uMsExtinct).negate()),
            );
            sumMS.addAssign(
              attMS.mul(betaR.mul(hr).add(betaM.mul(hm))).mul(litSoft),
            );
            tCur.addAssign(segLen);
          });

          const mu = dot(dir, sunDir);
          const phaseR = float(3 / (16 * Math.PI)).mul(
            float(1.0).add(mu.mul(mu)),
          );
          const g = uMieG;
          const g2 = g.mul(g);
          const phaseM = float(3 / (8 * Math.PI))
            .mul(
              float(1.0)
                .sub(g2)
                .mul(float(1.0).add(mu.mul(mu))),
            )
            .div(
              float(2.0)
                .add(g2)
                .mul(
                  pow(
                    float(1.0).add(g2).sub(g.mul(mu).mul(2.0)).max(0.0001),
                    1.5,
                  ),
                ),
            );

          const single = sumR
            .mul(betaR)
            .mul(phaseR)
            .add(sumM.mul(betaM).mul(phaseM));
          // Isotropic phase (1/4π) for the bounced fill.
          const multi = sumMS.mul(uMsAmount).mul(float(1 / (4 * Math.PI)));
          return single.add(multi).mul(uSunIntensity);
        });

        // ── High cirrus deck (2D analytic clouds on the dome) ─────────────────────
        // Returns vec4(rgb, alpha). Projects the view ray onto a horizontal plane so
        // clouds converge toward the horizon, samples a stretched fbm for streaky
        // cirrus, then relights by sun (silver lining), sunset (warm tint) and moon.
        const cirrus = Fn(([dir, dayF, twilightF, bgCol]) => {
          const y = dir.y.toVar();
          // Floor yy so the near-horizon uv doesn't explode into noise aliasing
          // (hidden by hMask anyway, but keeps the math finite).
          const yy = max(y, float(0.08));
          const proj = vec2(dir.x, dir.z).div(yy);
          // Anisotropic stretch → streaky cirrus rather than round blobs; drift on wind.
          const wind = uCloudWind.mul(uTime.mul(uCloudSpeed));
          const uv = vec2(proj.x.div(uCloudStretch), proj.y)
            .mul(uCloudScale)
            .add(wind)
            .toVar();

          // Coverage field (slow morph on the 3rd axis) + a finer detail layer.
          const n = fbm3(
            vec3(uv.x, uv.y, uTime.mul(uCloudSpeed).mul(0.4)),
          ).toVar();
          const nHi = fbm3(vec3(uv.x.mul(2.7).add(19.0), uv.y.mul(2.7), 7.0));
          n.assign(mix(n, n.mul(0.55).add(nHi.mul(0.45)), uCloudDetail));

          // Threshold by coverage (higher coverage → lower threshold → more sky).
          const edge = uCloudCoverage.oneMinus();
          const cov = smoothstep(edge, edge.add(uCloudSharpness), n);
          // Fade out at / below the horizon.
          const hMask = smoothstep(float(0.02), float(0.2), y);
          const alpha = cov.mul(uCloudDensity).mul(hMask).mul(uCloudOpacity);

          // ── Lighting ──
          const sunAmt = max(dot(dir, uSunDir), float(0.0));
          const moonAmt = max(dot(dir, uMoonDir), float(0.0));
          // Day: bright base with a silver lining toward the sun.
          const dayBright = mix(
            float(0.82),
            float(1.3),
            pow(sunAmt, float(2.5)),
          );
          const dayCol = uCloudColor.mul(dayBright).toVar();
          // Sunset: clouds catch warm low light near the horizon (pink mackerel sky).
          const warm = clamp(
            twilightF
              .mul(mix(float(0.35), float(1.0), sunAmt))
              .mul(uCloudSunTint),
            0.0,
            1.0,
          );
          dayCol.assign(mix(dayCol, uSunsetColor.mul(1.15), warm));
          // Night: dim, tinted by the moon.
          const nightBright = mix(
            float(0.08),
            float(0.45),
            pow(moonAmt, float(2.5)),
          );
          const nightCol = uCloudColor.mul(uMoonColor).mul(nightBright);

          const col = mix(nightCol, dayCol, dayF).toVar();
          // Aerial perspective: low (distant) cirrus recedes into the sky BEHIND it,
          // so the deck dissolves toward the horizon instead of holding full contrast.
          const aerial = smoothstep(float(0.5), float(0.05), y).mul(
            uCloudAerial,
          );
          col.assign(mix(col, bgCol, aerial));
          return vec4(col, alpha);
        });

        // ── Sky color node ───────────────────────────────────────────────────────
        const skyColorNode = Fn(() => {
          const dir = normalize(positionWorld.sub(cameraPosition)).toVar();
          const up = dir.y.toVar();

          const sunEl = uSunDir.y;
          const dayF = smoothstep(-0.15, 0.25, sunEl).toVar(); // 0 night → 1 day
          const nightF = dayF.oneMinus();
          // Twilight band peaks while the sun grazes the horizon.
          const twilightF = smoothstep(-0.3, 0.0, sunEl).mul(
            smoothstep(0.4, 0.04, sunEl),
          );

          // Vertical gradient (day + night palettes).
          const tGrad = pow(max(up, float(0.0)), float(0.45));
          const analyticDay = mix(uHorizonDay, uZenithDay, tGrad);
          const nightCol = mix(uHorizonNight, uZenithNight, tGrad);

          // ── ANALYTIC sky: crossfade day↔night + warm sunset wash (the old look) ──
          const analyticSky = mix(nightCol, analyticDay, dayF).toVar();
          const sunAmt = max(dot(dir, uSunDir), float(0.0));
          const horizonBand = smoothstep(0.4, 0.0, abs(up));
          const sunset = twilightF
            .mul(horizonBand)
            .mul(mix(float(0.25), float(1.0), sunAmt));
          analyticSky.assign(
            mix(analyticSky, uSunsetColor, clamp(sunset.mul(0.8), 0.0, 1.0)),
          );

          // ── PHYSICAL sky: Nishita scattering ADDED over the dark night gradient,
          //    so the blue overpowers it by day and twilight self-fades at night. ──
          const physicalSky = nightCol.add(atmosphere(dir, uSunDir));

          const skyCol = mix(analyticSky, physicalSky, uScatterMix).toVar();

          // Below the horizon. In SCATTER mode the Nishita march already clamps to the
          // planet ground, so it naturally fades from the bright horizon (long grazing
          // path) down to dark (steep, short path) — exactly like SkyMesh. So let it
          // show and only blend the explicit ground color in DEEP down (a floor instead
          // of black). In ANALYTIC mode the gradient is flat below the horizon, so blend
          // the ground in sooner. Either way the bottom follows the sky — no hard grey
          // seam at the waterline (the old code cut to ground over just ~2°).
          const groundDeep = smoothstep(-0.05, -0.6, up); // 0 at horizon → 1 far down
          const groundNear = smoothstep(0.0, -0.15, up); // analytic floor (sooner)
          const groundMix = mix(groundNear, groundDeep, uScatterMix);
          skyCol.assign(
            mix(
              skyCol,
              uGroundColor.mul(mix(float(0.12), float(1.0), dayF)),
              groundMix,
            ),
          );

          // Horizon + under-horizon haze (matches scene FogExp2 on terrain).
          const fogHorizon = smoothstep(uFogHazeHeight, float(0.0), up);
          const fogGround = smoothstep(float(0.06), float(-0.2), up);
          const fogMask = max(fogHorizon, fogGround);
          const fogDepth = fogMask.mul(float(SKY_RADIUS));
          const fogFac = sub(
            float(1),
            exp(
              fogDepth.mul(fogDepth).mul(uFogDensity).mul(uFogDensity).negate(),
            ),
          );
          skyCol.assign(mix(skyCol, uFogColor, mul(fogFac, uFogEnabled)));

          // ── Milky Way band (night only). Gated twice so only band pixels at night
          //    ever evaluate the FBM — day and off-band sky pay nothing. ──
          const aboveHorizon = smoothstep(float(-0.02), float(0.12), up);
          If(
            uMilkyWayEnabled
              .greaterThan(0.5)
              .and(nightF.greaterThan(0.02))
              .and(up.greaterThan(-0.02)),
            () => {
              const lat = abs(dot(dir, uGalacticPole));
              const band = smoothstep(uMilkyWayWidth, float(0.0), lat);
              If(band.greaterThan(0.001), () => {
                const n = fbm3(dir.mul(uMilkyWayScale));
                const cloud = smoothstep(float(0.45), float(0.85), n); // bright star clouds
                const dust = smoothstep(float(0.22), float(0.46), n); // dark dust lanes carve in
                const bright = band
                  .mul(mix(float(0.3), float(1.1), cloud))
                  .mul(mix(float(0.35), float(1.0), dust));
                const col = mix(uMilkyWayColor1, uMilkyWayColor2, n);
                skyCol.addAssign(
                  col
                    .mul(bright)
                    .mul(uMilkyWayIntensity)
                    .mul(nightF)
                    .mul(aboveHorizon),
                );
              });
            },
          );

          // Stars (above the horizon, night only).
          skyCol.addAssign(starField(dir).mul(nightF).mul(aboveHorizon));

          // Shooting stars (gated to night so day pays nothing).
          If(
            uMeteorEnabled.greaterThan(0.5).and(nightF.greaterThan(0.02)),
            () => {
              skyCol.addAssign(
                shootingStars(dir).mul(nightF).mul(aboveHorizon),
              );
            },
          );

          // High cirrus deck: sits OVER the sky + stars (occludes them) but UNDER the
          // sun/moon discs below (thin clouds → the disc still shines through). Gated
          // so a disabled deck pays nothing.
          If(uCloudEnabled.greaterThan(0.5), () => {
            const c = cirrus(dir, dayF, twilightF, skyCol);
            skyCol.assign(mix(skyCol, c.xyz, c.w));
          });

          // Sun disc + glow (fades out below the horizon).
          const sunDot = dot(dir, uSunDir);
          const sunUpFade = smoothstep(-0.06, 0.05, uSunDir.y);
          const sunDisc = smoothstep(uSunCos, float(1.0), sunDot).mul(
            uSunDiscBright,
          );
          const sunGlow = pow(max(sunDot, float(0.0)), uSunGlowPow).mul(
            uSunGlowStrength,
          );
          skyCol.addAssign(uSunColor.mul(sunDisc.add(sunGlow)).mul(sunUpFade));

          // Moon — reconstructed as a lit sphere inside the disc (phase + surface).
          const moonDot = dot(dir, uMoonDir);
          const moonUpFade = smoothstep(-0.06, 0.05, uMoonDir.y).mul(
            mix(float(0.25), float(1.0), nightF),
          );

          // Disc-local coords; reconstruct the near-hemisphere normal as a sphere.
          const nuvx = dot(dir, uMoonRight).div(uMoonSinR);
          const nuvy = dot(dir, uMoonUp).div(uMoonSinR);
          const r2 = nuvx.mul(nuvx).add(nuvy.mul(nuvy));
          const inside = r2.lessThan(1.0).and(moonDot.greaterThan(0.0));

          const moonCol = vec3(0.0).toVar();
          If(inside, () => {
            const z = sqrt(max(float(1.0).sub(r2), float(0.0)));
            const N = normalize(
              uMoonRight
                .mul(nuvx)
                .add(uMoonUp.mul(nuvy))
                .add(uMoonDir.negate().mul(z)),
            );
            // Phase: lit where the surface faces the phase-light direction.
            const lit = dot(N, uMoonLightDir);
            const litS = smoothstep(uMoonTermSoft.negate(), uMoonTermSoft, lit);
            const limb = pow(z.add(0.06).clamp(0.0, 1.0), float(0.35)); // gentle limb darkening
            // Surface: low-freq maria (dark seas) + higher-freq crater speckle.
            const nLow = fbm3(N.mul(2.4));
            const nHi = fbm3(N.mul(7.0).add(40.0));
            const maria = smoothstep(0.58, 0.4, nLow);
            const craters = smoothstep(0.62, 0.78, nHi);
            const albedoRaw = float(1.0)
              .sub(maria.mul(0.5))
              .sub(craters.mul(0.22))
              .max(0.25);
            const albedo = mix(float(1.0), albedoRaw, uMoonSurface);

            const dayCol = uMoonColor.mul(albedo).mul(litS).mul(limb);
            // Earthshine: faint cool fill on the unlit side (the "ashen light").
            const ashen = uMoonColor
              .mul(vec3(0.55, 0.62, 0.9))
              .mul(litS.oneMinus())
              .mul(uMoonEarthshine)
              .mul(albedo);
            moonCol.assign(dayCol.add(ashen).mul(uMoonDiscBright));
          });

          const edge = smoothstep(
            float(1.0),
            float(1.0).sub(uMoonEdgeSoft),
            sqrt(r2),
          );
          const moonGlow = pow(max(moonDot, float(0.0)), uMoonGlowPow).mul(
            uMoonGlowStrength,
          );
          skyCol.addAssign(
            moonCol.mul(edge).add(uMoonColor.mul(moonGlow)).mul(moonUpFade),
          );

          return vec4(max(skyCol, vec3(0.0)), 1.0);
        });

        const material = new THREE.MeshBasicNodeMaterial();
        material.colorNode = skyColorNode();
        material.side = THREE.BackSide;
        material.depthWrite = false;
        material.depthTest = false;
        material.fog = false;

        const mesh = new THREE.Mesh(
          new THREE.SphereGeometry(SKY_RADIUS, 32, 16),
          material,
        );
        mesh.renderOrder = -2;
        mesh.frustumCulled = false;
        mesh.name = "DayNightSkyDome";

        /**
         * @param {object} P    — PARAMS slice (sky.*)
         * @param {object} frame — { time, sunDir, moonDir, camera }
         */
        function update(P, frame) {
          mesh.position.copy(frame.camera.position);

          uTime.value = frame.time;
          uSunDir.value.copy(frame.sunDir);
          uMoonDir.value.copy(frame.moonDir);

          uZenithDay.value.set(P.zenithDay);
          uHorizonDay.value.set(P.horizonDay);
          uZenithNight.value.set(P.zenithNight);
          uHorizonNight.value.set(P.horizonNight);
          uSunsetColor.value.set(P.sunsetColor);
          uGroundColor.value.set(P.groundColor);

          uScatterMix.value = P.scatter ? 1 : 0;
          uSunIntensity.value = P.sunIntensity;
          uRayleigh.value = P.rayleigh;
          uMie.value = P.mie;
          uMieG.value = P.mieG;
          uAtmoAltitude.value = P.atmoAltitude;
          uMsAmount.value = P.msAmount;
          uMsExtinct.value = P.msExtinct;

          uSunColor.value.set(P.sunColor);
          uSunCos.value = Math.cos(THREE.MathUtils.degToRad(P.sunSizeDeg));
          uSunGlowPow.value = P.sunGlowPow;
          uSunGlowStrength.value = P.sunGlowStrength;
          uSunDiscBright.value = P.sunDiscBright;

          uMoonColor.value.set(P.moonColor);
          uMoonCos.value = Math.cos(THREE.MathUtils.degToRad(P.moonSizeDeg));
          uMoonGlowStrength.value = P.moonGlowStrength;
          uMoonDiscBright.value = P.moonDiscBright;

          // Moon phase frame (right/up ⊥ moonDir) + the phase-light direction.
          const md = frame.moonDir;
          _mUpRef.set(0, 1, 0);
          if (Math.abs(md.y) > 0.99) _mUpRef.set(0, 0, 1);
          _mRight.crossVectors(_mUpRef, md).normalize();
          _mUp.crossVectors(md, _mRight).normalize();
          uMoonRight.value.copy(_mRight);
          uMoonUp.value.copy(_mUp);
          const ang = (1 - P.moonPhase) * Math.PI; // 0 = full, π = new
          const orient = THREE.MathUtils.degToRad(P.moonPhaseOrient);
          _mL.copy(md).multiplyScalar(-Math.cos(ang));
          _mTmp.copy(_mRight).multiplyScalar(Math.sin(ang) * Math.cos(orient));
          _mL.add(_mTmp);
          _mTmp.copy(_mUp).multiplyScalar(Math.sin(ang) * Math.sin(orient));
          _mL.add(_mTmp).normalize();
          uMoonLightDir.value.copy(_mL);
          uMoonSinR.value = Math.sin(THREE.MathUtils.degToRad(P.moonSizeDeg));
          uMoonSurface.value = P.moonSurface;
          uMoonEarthshine.value = P.moonEarthshine;
          uMoonTermSoft.value = P.moonTermSoft;

          uStarDensity.value = P.starDensity;
          uStarThreshold.value = P.starThreshold;
          uStarSize.value = P.starSize;
          uStarBrightness.value = P.starBrightness;
          uStarTwinkle.value = P.starTwinkle;

          uMilkyWayEnabled.value = P.milkyWayEnabled ? 1 : 0;
          uMilkyWayIntensity.value = P.milkyWayIntensity;
          uMilkyWayWidth.value = P.milkyWayWidth;
          uMilkyWayScale.value = P.milkyWayScale;
          uMilkyWayColor1.value.set(P.milkyWayColor1);
          uMilkyWayColor2.value.set(P.milkyWayColor2);
          uMeteorEnabled.value = P.meteorEnabled ? 1 : 0;
          uMeteorIntensity.value = P.meteorIntensity;
          uMeteorRate.value = P.meteorRate;
          uMeteorSpeed.value = P.meteorSpeed;
          uMeteorWidth.value = P.meteorWidth;
          uMeteorLength.value = P.meteorLength;

          uCloudEnabled.value = P.cloudEnabled ? 1 : 0;
          uCloudCoverage.value = P.cloudCoverage;
          uCloudDensity.value = P.cloudDensity;
          uCloudOpacity.value = P.cloudOpacity;
          uCloudScale.value = P.cloudScale;
          uCloudStretch.value = P.cloudStretch;
          uCloudSharpness.value = P.cloudSharpness;
          uCloudDetail.value = P.cloudDetail;
          uCloudSunTint.value = P.cloudSunTint;
          uCloudSpeed.value = P.cloudSpeed;
          uCloudWind.value.set(
            Math.cos(THREE.MathUtils.degToRad(P.cloudWindDeg)),
            Math.sin(THREE.MathUtils.degToRad(P.cloudWindDeg)),
          );
          uCloudColor.value.set(P.cloudColor);
          uCloudAerial.value = P.cloudAerial ?? 0.8;

          if (frame.fog) {
            uFogEnabled.value = frame.fog.enabled ? 1 : 0;
            uFogColor.value.copy(frame.fog.color);
            uFogDensity.value = frame.fog.density;
            if (frame.fog.hazeHeight !== undefined)
              uFogHazeHeight.value = frame.fog.hazeHeight;
          }
        }

        function dispose() {
          mesh.geometry.dispose();
          material.dispose();
        }

        return { mesh, update, dispose };
      }

      const SKY_DEFAULTS = {
        zenithDay: "#2a6bd8",

      function makeDefaultCluster(enabled, x, y, z) {

          enabled,

      const clusterDefs = [
        {

          z: 0,
          rx: 2.4,

          count: 500,

        },
        {
