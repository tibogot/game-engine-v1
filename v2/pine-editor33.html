<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pine editor — v2 tree preset authoring</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #87ceeb;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hint {
        position: fixed;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        font-size: 12px;
        color: rgba(30, 50, 80, 0.75);
        pointer-events: none;
        text-align: center;
        max-width: 92vw;
      }
      #title {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 5;
        font-size: 14px;
        font-weight: 600;
        color: rgba(40, 60, 100, 0.85);
        pointer-events: none;
      }
      :root {
        --bg-dark: #222222;
        --bg-panel: #2a2a2a;
        --bg-item: #333333;
        --bg-hover: #3a3a3a;
        --bg-input: #1e1e1e;
        --border: #3c3c3c;
        --border-light: #4a4a4a;
        --text: #cccccc;
        --text-dim: #888888;
        --text-bright: #e0e0e0;
        --accent: #4a9eff;
        --font: "Segoe UI", system-ui, -apple-system, sans-serif;
        --font-mono: "Cascadia Code", "Fira Code", Consolas, monospace;
        --radius: 4px;
      }
      #ui {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 20;
        width: 320px;
        max-height: calc(100vh - 16px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-family: var(--font);
        font-size: 13px;
        color: var(--text);
        user-select: none;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      #ui .panel-header {
        display: flex;
        align-items: center;
        padding: 8px 12px;
        min-height: 36px;
        background: var(--bg-dark);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.4px;
        color: var(--text-bright);
        flex-shrink: 0;
      }
      #ui-scroll {
        flex: 1;
        overflow-y: auto;
        scrollbar-width: thin;
      }
      #ui-scroll::-webkit-scrollbar {
        width: 8px;
      }
      #ui-scroll::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }
      .inspector-section {
        border-bottom: 1px solid var(--border);
      }
      .section-header {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: var(--text-dim);
      }
      .section-header:hover {
        background: var(--bg-hover);
      }
      .section-header .section-arrow {
        width: 14px;
        height: 14px;
        transition: transform 0.15s;
        flex-shrink: 0;
      }
      .section-header.collapsed .section-arrow {
        transform: rotate(-90deg);
      }
      .section-body {
        padding: 6px 12px 10px;
      }
      .section-body.hidden {
        display: none;
      }
      .prop-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 0;
        min-height: 26px;
      }
      .prop-label {
        width: 108px;
        min-width: 108px;
        font-size: 11px;
        color: var(--text-dim);
        text-align: right;
        padding-right: 4px;
        line-height: 1.2;
      }
      .prop-value {
        flex: 1;
        display: flex;
        gap: 4px;
        align-items: center;
        min-width: 0;
      }
      .prop-color-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 1;
      }
      .prop-color {
        width: 22px;
        height: 22px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        cursor: pointer;
        padding: 0;
        -webkit-appearance: none;
        appearance: none;
      }
      .prop-color::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      .prop-color::-webkit-color-swatch {
        border: none;
        border-radius: 2px;
      }
      .prop-slider-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .prop-num-input {
        width: 72px;
        height: 22px;
        flex-shrink: 0;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0 5px;
        color: var(--text);
        font-size: 11px;
        font-family: var(--font-mono);
        text-align: right;
        outline: none;
      }
      .prop-num-input:focus {
        border-color: var(--accent);
      }
      .prop-num-input::-webkit-outer-spin-button,
      .prop-num-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .prop-num-input[type="number"] {
        appearance: textfield;
        -moz-appearance: textfield;
      }
      .prop-slider {
        flex: 1;
        height: 4px;
        -webkit-appearance: none;
        appearance: none;
        background: var(--bg-input);
        border-radius: 2px;
        outline: none;
        min-width: 0;
      }
      .prop-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
      }
      .prop-dropdown {
        flex: 1;
        height: 22px;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0 6px;
        color: var(--text);
        font-size: 12px;
        font-family: var(--font);
        outline: none;
        cursor: pointer;
        min-width: 0;
      }
      .prop-dropdown:focus {
        border-color: var(--accent);
      }
      .prop-input {
        flex: 1;
        height: 22px;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0 6px;
        color: var(--text);
        font-size: 12px;
        font-family: var(--font-mono);
        outline: none;
        min-width: 0;
      }
      .prop-input:focus {
        border-color: var(--accent);
      }
      .ui-separator {
        height: 1px;
        background: var(--border);
        margin: 8px 0;
      }
      .tex-gallery-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.35px;
        color: var(--text-dim);
        padding: 2px 0 6px;
      }
      .tex-gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0 0 10px;
      }
      .tex-gallery .tex-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        width: 56px;
      }
      .tex-gallery img {
        width: 52px;
        height: 52px;
        object-fit: cover;
        border-radius: var(--radius);
        border: 2px solid var(--border);
        cursor: pointer;
        opacity: 0.75;
        background: var(--bg-input);
        transition:
          opacity 0.15s,
          border-color 0.15s;
      }
      .tex-gallery img:hover {
        opacity: 1;
        border-color: var(--border-light);
      }
      .tex-gallery img.active {
        border-color: var(--accent);
        opacity: 1;
        box-shadow: 0 0 0 1px var(--accent);
      }
      .tex-gallery .tex-label {
        font-size: 9px;
        line-height: 1.2;
        font-family: var(--font-mono);
        color: var(--text-dim);
        text-align: center;
        max-width: 56px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        pointer-events: none;
      }
      .prop-toggle {
        width: 14px;
        height: 14px;
        border: 1px solid var(--border-light);
        border-radius: 3px;
        background: var(--bg-input);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        padding: 0;
        color: transparent;
      }
      .prop-toggle.checked {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }
      .prop-toggle svg {
        width: 10px;
        height: 10px;
      }
      .section-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 26px;
        margin-top: 4px;
        background: var(--bg-item);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-dim);
        cursor: pointer;
        font-size: 11px;
        font-family: var(--font);
      }
      .section-btn:hover {
        background: var(--bg-hover);
        color: var(--text);
        border-color: var(--border-light);
      }
      .info-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 0;
        min-height: 26px;
      }
      .info-label {
        width: 108px;
        min-width: 108px;
        font-size: 11px;
        color: var(--text-dim);
        text-align: right;
        padding-right: 4px;
      }
      .info-value {
        flex: 1;
        font-size: 11px;
        color: var(--text);
        font-family: var(--font-mono);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="ui">
      <div class="panel-header">Pine editor → v2 trees</div>
      <div id="ui-scroll"></div>
    </div>
    <div id="title">Pine — top whorl at trunk tip · 7×7 cards</div>
    <div id="hint">
      Top ring is always on the trunk tip; lower rings spread from base Y
      (height curve). v2 export in Save / Load.
    </div>
    <script type="module">
      import * as THREE from "three";
      import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";
      import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
      import { SkyMesh } from "three/addons/objects/SkyMesh.js";
      import { CSMShadowNode } from "three/addons/csm/CSMShadowNode.js";
      import {
        Fn,
        float,
        vec2,
        vec3,
        vec4,
        uniform,
        modelWorldMatrix,
        modelWorldMatrixInverse,
        texture,
        uv,
        mix,
        smoothstep,
        clamp,
        sin,
        cos,
        positionLocal,
        positionWorld,
        normalLocal,
        cameraPosition,
        normalize,
        length,
        dot,
        max,
        pow,
        negate,
        mul,
        add,
        sub,
        div,
        floor,
        instanceIndex,
        hash,
        rotateUV,
        step,
        abs,
        normalWorld,
        mx_atan2,
        mx_noise_float,
      } from "three/tsl";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      // Shared pine placement math — the SAME module the v2/v3 runtime preset
      // loader uses (v2/core/foliage/pinePlacement.js), so a preset authored
      // here reproduces exactly in-game. Keep placement changes there.
      import {
        trunkHeightT,
        trunkRadiusAtT,
        trunkCenterAtT,
        trunkTangentAtT,
        trunkOutwardAtT,
        buildPineTrunkGeometry,
        createPineCardGeometry,
        foliageHash01,
        foliageRandomSignedDeg,
        pineCardQuaternion,
        forEachPineCardPlacement as forEachPineCardPlacementShared,
        computePineFoliageBounds,
      } from "./core/foliage/pinePlacement.js";
      const DEG = Math.PI / 180;

      const _checkSvg =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
      const _arrowSvg =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="section-arrow"><polyline points="6 9 12 15 18 9"></polyline></svg>';

      function _fmt(v, step) {
        if (step >= 1) return String(Math.round(v));
        const d = Math.max(0, -Math.floor(Math.log10(step)));
        return v.toFixed(d);
      }

      function _clampSnap(v, min, max, step) {
        if (!Number.isFinite(v)) return min;
        const n = Math.round((v - min) / step);
        let out = min + n * step;
        const stepStr = String(step);
        let decimals = 0;
        if (stepStr.includes(".")) {
          decimals = stepStr.split(".")[1].length;
        } else if (stepStr.includes("e-")) {
          decimals = 8;
        }
        if (decimals > 0) out = Number(out.toFixed(decimals));
        return Math.min(max, Math.max(min, out));
      }

      function _section(parent, title, expanded = true) {
        const sec = document.createElement("div");
        sec.className = "inspector-section";
        const hdr = document.createElement("div");
        hdr.className = "section-header" + (expanded ? "" : " collapsed");
        hdr.innerHTML = _arrowSvg + " " + title;
        const body = document.createElement("div");
        body.className = "section-body" + (expanded ? "" : " hidden");
        hdr.addEventListener("click", () => {
          hdr.classList.toggle("collapsed");
          body.classList.toggle("hidden");
        });
        sec.appendChild(hdr);
        sec.appendChild(body);
        parent.appendChild(sec);
        return body;
      }

      function _slider(parent, obj, key, opts) {
        const { label, min, max, step = 0.01, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        const cur = obj[key];
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><div class="prop-slider-wrap"><input type="range" class="prop-slider" min="${min}" max="${max}" step="${step}" value="${cur}"><input type="number" class="prop-num-input" title="Type an exact value" min="${min}" max="${max}" step="${step}" value="${_fmt(cur, step)}"></div></div>`;
        const sl = row.querySelector(".prop-slider");
        const num = row.querySelector(".prop-num-input");
        const syncNumDisplay = () => {
          num.value = _fmt(obj[key], step);
        };
        const applyFromSlider = () => {
          obj[key] = parseFloat(sl.value);
          syncNumDisplay();
          onChange?.();
        };
        const commitFromNum = () => {
          const raw = String(num.value).trim();
          if (raw === "" || raw === "-" || raw === "." || raw === "-.") {
            syncNumDisplay();
            return;
          }
          let v = parseFloat(raw);
          if (!Number.isFinite(v)) {
            syncNumDisplay();
            return;
          }
          v = _clampSnap(v, min, max, step);
          obj[key] = v;
          sl.value = String(v);
          syncNumDisplay();
          onChange?.();
        };
        sl.addEventListener("input", applyFromSlider);
        num.addEventListener("change", commitFromNum);
        num.addEventListener("keydown", (e) => {
          if (e.key === "Enter") num.blur();
        });
        parent.appendChild(row);
      }

      function _color(parent, obj, key, opts) {
        const { label, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><div class="prop-color-wrap"><input type="color" class="prop-color" value="${obj[key]}"><span style="font-size:11px;color:var(--text-dim);font-family:var(--font-mono)">${obj[key]}</span></div></div>`;
        const inp = row.querySelector(".prop-color");
        const hex = row.querySelector("span");
        inp.addEventListener("input", () => {
          obj[key] = inp.value;
          hex.textContent = inp.value;
          onChange?.();
        });
        parent.appendChild(row);
      }

      function _toggle(parent, obj, key, opts) {
        const { label, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><button type="button" class="prop-toggle ${obj[key] ? "checked" : ""}">${_checkSvg}</button></div>`;
        const btn = row.querySelector(".prop-toggle");
        btn.addEventListener("click", () => {
          obj[key] = !obj[key];
          btn.classList.toggle("checked", obj[key]);
          onChange?.();
        });
        parent.appendChild(row);
      }

      function _dropdown(parent, obj, key, opts) {
        const { label, options, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        let optHtml = "";
        for (const [text, val] of Object.entries(options)) {
          optHtml += `<option value="${val}" ${obj[key] === val ? "selected" : ""}>${text}</option>`;
        }
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><select class="prop-dropdown">${optHtml}</select></div>`;
        const sel = row.querySelector(".prop-dropdown");
        const isNum = typeof obj[key] === "number";
        sel.addEventListener("change", () => {
          obj[key] = isNum ? Number(sel.value) : sel.value;
          onChange?.();
        });
        parent.appendChild(row);
      }

      function _button(parent, opts) {
        const { title, onClick } = opts;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "section-btn";
        btn.textContent = title;
        btn.addEventListener("click", onClick);
        parent.appendChild(btn);
      }

      function _separator(parent) {
        const el = document.createElement("div");
        el.className = "ui-separator";
        parent.appendChild(el);
      }

      function _text(parent, obj, key, opts) {
        const { label, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><input type="text" class="prop-input" value="${obj[key] ?? ""}"></div>`;
        const inp = row.querySelector(".prop-input");
        inp.addEventListener("change", () => {
          obj[key] = inp.value;
          onChange?.();
        });
        parent.appendChild(row);
        return {
          refresh() {
            inp.value = obj[key] ?? "";
          },
        };
      }

      function _info(parent, label, getValue) {
        const row = document.createElement("div");
        row.className = "info-row";
        const valSpan = document.createElement("span");
        valSpan.className = "info-value";
        valSpan.textContent = getValue();
        row.innerHTML = `<span class="info-label">${label}</span>`;
        row.appendChild(valSpan);
        parent.appendChild(row);
        return {
          update(v) {
            valSpan.textContent = v;
          },
        };
      }
      const _v3 = new THREE.Vector3();
      const _euler = new THREE.Euler();
      const _qCard = new THREE.Quaternion();
      const _qAz = new THREE.Quaternion();
      const _qOut = new THREE.Quaternion();
      const _dummy = new THREE.Object3D();
      const _yAxis = new THREE.Vector3(0, 1, 0);
      const _trunkP1 = new THREE.Vector3();
      const _trunkTan = new THREE.Vector3();
      const _trunkOut = new THREE.Vector3();
      const _qSeg = new THREE.Quaternion();
      const _mSeg = new THREE.Matrix4();

      function applyMapTransform(tex, matParams) {
        if (!tex) return;
        const ru = matParams.texRepeatU ?? 1;
        const rv = matParams.texRepeatV ?? 1;
        let su = ru;
        let sv = rv;
        if (matParams.texFlipH) su = -Math.abs(ru);
        if (matParams.texFlipV) sv = -Math.abs(rv);
        tex.center.set(0.5, 0.5);
        tex.rotation = (matParams.texRotDeg ?? 0) * DEG;
        tex.repeat.set(su, sv);
        tex.offset.set(matParams.texOffsetU ?? 0, matParams.texOffsetV ?? 0);
        if (matParams.texFlipH) tex.offset.x += Math.abs(ru);
        if (matParams.texFlipV) tex.offset.y += Math.abs(rv);
        const tiled =
          ru !== 1 || rv !== 1 || matParams.texFlipH || matParams.texFlipV;
        tex.wrapS = tiled ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
        tex.wrapT = tiled ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
        tex.needsUpdate = true;
      }

      /**
       * Tapered limb start→end; joints stay exact (bend uses 4t(1−t), zero at both caps).
       * droop bends in local +Z after align; droopSide in local +X (gravity-ish sag).
       */
      function addBentCylinderBetween(
        parts,
        start,
        end,
        radiusBottom,
        radiusTop,
        radialSegs,
        heightSegs,
        droop = 0,
        droopSide = 0,
      ) {
        _v3.subVectors(end, start);
        const len = _v3.length();
        if (len < 1e-4) return;
        const r0 = Math.max(0.003, radiusBottom);
        const r1 = Math.max(0.003, radiusTop);
        const rs = Math.max(3, Math.round(radialSegs));
        let hs = Math.max(1, Math.round(heightSegs));
        const bendAmt = Math.abs(droop) + Math.abs(droopSide);
        if (bendAmt > 1e-6) hs = Math.max(hs, 2);
        const geo = new THREE.CylinderGeometry(r1, r0, len, rs, hs);
        geo.translate(0, len * 0.5, 0);
        if (bendAmt > 1e-6) {
          const pos = geo.attributes.position;
          const capEps = 1e-4;
          for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i);
            const y = pos.getY(i);
            let z = pos.getZ(i);
            const t = len > 1e-6 ? THREE.MathUtils.clamp(y / len, 0, 1) : 0;
            if (t <= capEps || t >= 1 - capEps) continue;
            const profile = 4 * t * (1 - t);
            z += droop * profile * len;
            pos.setXYZ(i, x + droopSide * profile * len, y, z);
          }
          pos.needsUpdate = true;
        }
        geo.computeVertexNormals();
        _v3.subVectors(end, start).normalize();
        _qSeg.setFromUnitVectors(_yAxis, _v3);
        _mSeg.compose(start, _qSeg, new THREE.Vector3(1, 1, 1));
        geo.applyMatrix4(_mSeg);
        parts.push(geo);
      }

      /**
       * Branch mesh: base (0,0,0) → +Y. Single bent limb by default; optional thin fork twigs.
       */
      function createBranchGeometry(b) {
        const L = Math.max(0.12, b.length);
        const r0 = Math.max(0.004, b.radiusBottom);
        const r1 = Math.max(0.004, b.radiusTop);
        const rs = Math.max(3, Math.round(b.radialSegs));
        const hs = Math.max(1, Math.round(b.heightSegs));
        const droop = b.bend ?? 0;
        const droopSide = b.bendSide ?? 0;
        const origin = new THREE.Vector3(0, 0, 0);
        const tip = new THREE.Vector3(0, L, 0);
        const parts = [];

        if (b.forkEnabled !== true) {
          addBentCylinderBetween(
            parts,
            origin,
            tip,
            r0,
            r1,
            rs,
            hs,
            droop,
            droopSide,
          );
        } else {
          const forkT = THREE.MathUtils.clamp(b.forkStart ?? 0.68, 0.4, 0.92);
          const forkN = THREE.MathUtils.clamp(
            Math.round(b.forkCount ?? 2),
            1,
            4,
          );
          const spread = (b.forkAngleDeg ?? 28) * DEG;
          const twist = (b.forkTwistDeg ?? 0) * DEG;
          const forkRadiusMul = THREE.MathUtils.clamp(
            b.forkRadiusMul ?? 0.38,
            0.15,
            0.85,
          );
          const forkTipScale = THREE.MathUtils.clamp(
            b.forkTipScale ?? 0.5,
            0.2,
            1,
          );
          const forkLenMul = THREE.MathUtils.clamp(
            b.forkLengthMul ?? 0.58,
            0.2,
            1,
          );
          const mainLen = L * forkT;
          const rFork = THREE.MathUtils.lerp(r0, r1, forkT);
          const forkPt = new THREE.Vector3(0, mainLen, 0);

          addBentCylinderBetween(
            parts,
            origin,
            forkPt,
            r0,
            rFork,
            rs,
            hs,
            droop,
            droopSide * 0.35,
          );

          const baseChildLen = L * (1 - forkT) * forkLenMul;
          const sinS = Math.sin(spread);
          const cosS = Math.cos(spread);
          const childR0 = Math.max(0.003, rFork * forkRadiusMul);
          const childR1 = Math.max(0.003, childR0 * forkTipScale);

          for (let i = 0; i < forkN; i++) {
            const az = twist + (i / forkN) * Math.PI * 2;
            const lenJit = 0.72 + 0.28 * ((i * 0.37) % 1);
            const childLen = baseChildLen * lenJit;
            const dir = new THREE.Vector3(
              Math.cos(az) * sinS,
              cosS,
              Math.sin(az) * sinS,
            ).normalize();
            const end = forkPt.clone().addScaledVector(dir, childLen);
            const childSign = i % 2 === 0 ? 1 : -1;
            addBentCylinderBetween(
              parts,
              forkPt,
              end,
              childR0 * (0.92 + i * 0.02),
              childR1,
              Math.max(3, rs - 2),
              Math.max(1, hs - 1),
              droop * (0.35 + 0.08 * i),
              droopSide * 0.45 * childSign,
            );
          }
        }

        if (parts.length === 0) {
          return new THREE.CylinderGeometry(r1, r0, L, rs, hs);
        }
        const merged = parts.length === 1 ? parts[0] : mergeGeometries(parts);
        for (const g of parts) {
          if (g !== merged) g.dispose();
        }
        merged.computeVertexNormals();
        return merged;
      }

            c.width = c.height = 256;
            const g = c.getContext("2d");
            const n = 8;
            const s = 256 / n;
            for (let j = 0; j < n; j++) {
              for (let i = 0; i < n; i++) {
                g.fillStyle = (i + j) % 2 ? "#c8d8e8" : "#f0f4f8";
                g.fillRect(i * s, j * s, s, s);
              }
            }
            g.strokeStyle = "rgba(60,80,120,0.35)";
            g.lineWidth = 1;
            for (let k = 0; k <= n; k++) {
              g.beginPath();
              g.moveTo(0, k * s);
              g.lineTo(256, k * s);
              g.stroke();
              g.beginPath();
              g.moveTo(k * s, 0);
              g.lineTo(k * s, 256);
              g.stroke();
            }
            return c;
          })(),
        );
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(4, 4);
        t.colorSpace = THREE.SRGBColorSpace;
        t.needsUpdate = true;

            leafU.yMax.value = b.yMax;
            leafU.canopyCenter.value.copy(b.canopyCenter);
            leafU.aoRadius.value = b.aoRadius;
            params.material.aoRadius = b.aoRadius;
          } else {
            const f = params.foliage;
            const tr = params.trunk;
            leafU.yMin.value = f.baseY + (f.offsetY ?? 0);
            trunkCenterAtT(1, tr, _trunkP1);
            leafU.yMax.value = _trunkP1.y + 0.35;
            leafU.canopyCenter.value.set(
              0,
              (leafU.yMin.value + leafU.yMax.value) * 0.5,
              0,
            );
            leafU.aoRadius.value = params.material.aoRadius;
          }
          syncTrunkBounds();
        }

        function syncLeafUniforms() {
          const m = params.material;
          leafU.bottomColor.value.set(m.bottomColor);
          leafU.topColor.value.set(m.topColor);
          leafU.colorVar.value = m.colorVar;
          leafU.normalBias.value = m.normalBias;
          leafU.leafWarp.value = m.leafWarp;
          leafU.radialUp.value = m.radialUp;
          leafU.veinStrength.value = m.veinStrength;
          leafU.pivotAo.value = m.pivotAo;
          leafU.aoStrength.value = m.aoStrength;
          leafU.sssColor.value.set(m.sssColor);
          leafU.sssStrength.value = m.sssStrength;
          leafU.sssPower.value = m.sssPower;
          leafU.rimColor.value.set(m.rimColor);
          leafU.rimStrength.value = m.rimStrength;
          leafU.rimPower.value = m.rimPower;
          leafU.alphaCutoff.value = m.alphaTest;
          leafU.maskInAlpha.value = m.maskMode === "alpha" ? 1 : 0;
          const atlasCols = Math.max(1, Math.round(m.atlasCols ?? 2));
          const atlasRows = Math.max(1, Math.round(m.atlasRows ?? 2));
          leafU.useAtlas.value = m.textureMode === "atlas" ? 1 : 0;
          leafU.atlasCols.value = atlasCols;
          leafU.atlasRows.value = atlasRows;
          leafU.atlasCount.value = atlasCols * atlasRows;
          leafU.texRot.value = (m.texRotDeg ?? 0) * DEG;
          const ru = m.texRepeatU ?? 1;
          const rv = m.texRepeatV ?? 1;
          let su = ru;
          let sv = rv;
          if (m.texFlipH) su = -Math.abs(ru);
          if (m.texFlipV) sv = -Math.abs(rv);
          leafU.texRep.value.set(su, sv);
          let ou = m.texOffsetU ?? 0;
          let ov = m.texOffsetV ?? 0;
          if (m.texFlipH) ou += Math.abs(ru);
          if (m.texFlipV) ov += Math.abs(rv);
          leafU.texOff.value.set(ou, ov);
          leafU.texFlip.value.set(m.texFlipH ? 1 : 0, m.texFlipV ? 1 : 0);
          leafU.sunDir.value.copy(sunDir);
          syncWindUniforms();
          syncLeafBounds();
        }

        function syncLod2Uniforms() {
          const m = params.material;
          const c = params.lod2Cheap;
          leafU2.bottomColor.value.copy(leafU.bottomColor.value);
          leafU2.topColor.value.copy(leafU.topColor.value);
          leafU2.colorVar.value = m.colorVar * c.colorVarMul;
          leafU2.normalBias.value = m.normalBias;
          leafU2.leafWarp.value = m.leafWarp;
          leafU2.radialUp.value = m.radialUp;
          leafU2.veinStrength.value = m.veinStrength * c.veinMul;
          leafU2.pivotAo.value = Math.min(0.55, m.pivotAo * c.pivotAoMul);
          leafU2.aoStrength.value = Math.min(
            0.75,
            m.aoStrength * c.aoStrengthMul,
          );
          leafU2.aoRadius.value = leafU.aoRadius.value;
          leafU2.canopyCenter.value.copy(leafU.canopyCenter.value);
          leafU2.sssColor.value.copy(leafU.sssColor.value);
          leafU2.sssStrength.value = m.sssStrength * c.sssMul;
          leafU2.sssPower.value = m.sssPower;
          leafU2.rimColor.value.copy(leafU.rimColor.value);
          leafU2.rimStrength.value = m.rimStrength * c.rimMul;
          leafU2.rimPower.value = m.rimPower;
          leafU2.sunDarkenStr.value = c.sunDarkenStr;
          leafU2.sunDarkenPower.value = c.sunDarkenPower;
          leafU2.brightnessMul.value = c.brightnessMul;
          leafU2.cardShadowStr.value = c.cardShadowStr;
          leafU2.cardShadowFloor.value = c.cardShadowFloor;
          leafU2.cardShadowReach.value = c.cardShadowReach;
          leafU2.cardShadowPower.value = c.cardShadowPower;
          leafU2.alphaCutoff.value = m.alphaTest;
          leafU2.maskInAlpha.value = leafU.maskInAlpha.value;
          leafU2.useMaskTex.value = leafU.useMaskTex.value;
          leafU2.useImageColor.value = leafU.useImageColor.value;
          leafU2.sunDir.value.copy(leafU.sunDir.value);
          leafU2.windEnabled.value = 0;
          matLod2.roughness = m.roughness;
          matLod2.metalness = m.metalness;
          matLod2.wireframe = params.debug.wireframe;
          if (leafU.useMaskTex.value > 0.5) {
            matLod2.opacityNode = leafMaskAlphaNode;
            matLod2.transparent = false;
            matLod2.alphaTest = m.alphaTest;
            matLod2.depthWrite = m.depthWrite;
          } else {
            matLod2.opacityNode = null;
            matLod2.alphaTest = 0;
            matLod2.depthWrite = true;
          }
          matLod2.needsUpdate = true;
        }

        function syncWindUniforms() {
          const w = params.wind;
          leafU.windEnabled.value = w.enabled !== false ? 1 : 0;
          leafU.windSpeed.value = w.speed ?? 1;
          leafU.windStr.value = w.strength ?? 0;
          leafU.windMicro.value = w.micro ?? 0;
          leafU.windDir.value = (w.directionDeg ?? 0) * DEG;
        }

        function syncMaterial() {
          syncLeafUniforms();
          const m = params.material;
          mat.roughness = m.roughness;
          mat.metalness = m.metalness;
          mat.wireframe = params.debug.wireframe;

          leafU.useMaskTex.value = uploadedTex ? 1 : 0;
          if (uploadedTex) {
            leafMapNode.value = uploadedTex;
          } else if (m.useChecker) {
            leafMapNode.value = checker;
            leafU.useMaskTex.value = 1;
          } else {
            leafMapNode.value = opaqueTex;
          }

          const hasMask = leafU.useMaskTex.value > 0.5;
          if (hasMask) {
            /* Opaque alphaTest + depthWrite — same as arborist (avoids transparent sort artifacts). */
            mat.opacityNode = leafMaskAlphaNode;
            mat.transparent = false;
            mat.alphaTest = m.alphaTest;
            mat.alphaTestNode = null;
            mat.alphaToCoverage = false;
            mat.depthWrite = m.depthWrite;
          } else {
            mat.opacityNode = null;
            mat.transparent = false;
            mat.alphaTest = 0;
            mat.alphaTestNode = null;
            mat.alphaToCoverage = false;
            mat.depthWrite = true;
          }

          leafU.useImageColor.value =
            m.colorSource === "texture" && hasMask ? 1 : 0;
          syncWindUniforms();
          syncLod2Uniforms();
          mat.needsUpdate = true;
        }

        function applySingleTransform() {
          if (!foliageObject || foliageObject.isInstancedMesh) return;
          const t = params.transform;
          const g = params.foliage.globalScale;
          foliageObject.position.set(t.posX, t.posY, t.posZ);
          foliageObject.rotation.set(
            t.rotXDeg * DEG,
            t.rotYDeg * DEG,
            t.rotZDeg * DEG,
            "XYZ",
          );
          foliageObject.scale.setScalar(Number.isFinite(g) && g > 0 ? g : 1);
        }

        function quaternionForAzimuth(thetaRad, pitchExtraDeg = 0, trunkT = 0) {
          return pineCardQuaternion(
            params.transform,
            params.trunk,
            thetaRad,
            pitchExtraDeg,
            trunkT,
            _qOut,
          );
        }

        function branchPlacementCount(b) {
          if (
            b.count !== undefined &&
            b.count !== null &&
            Number.isFinite(b.count)
          ) {
            return Math.max(0, Math.round(b.count));
          }
          return Math.max(
            0,
            Math.round(b.levels ?? 2) * Math.round(b.perRing ?? 1),
          );
        }

        function migrateBranchParams(b) {
          if (
            b.count === undefined ||
            b.count === null ||
            !Number.isFinite(b.count)
          ) {
            if (b.levels != null && b.perRing != null) {
              b.count = Math.min(4, Math.max(1, Math.round(b.levels * 0.35)));
            } else {
              b.count = 2;
            }
          }
          if (b.pivotAlongRadius == null || b.pivotAlongRadius < 0.5) {
            b.pivotAlongRadius = 1;
          }
          if (b.trunkEmbed == null) b.trunkEmbed = 0.02;
          if (Math.abs(b.rotZDeg ?? 0) >= 45) {
            b.rotZDeg = 0;
            b.rotXDeg = 0;
          }
          if (b.forkEnabled == null) b.forkEnabled = false;
        }

        function branchTrunkTRange(b, tr, f) {
          let tMin = THREE.MathUtils.clamp(b.bottomTrunkT ?? 0.04, 0, 1);
          let tMax = THREE.MathUtils.clamp(b.topTrunkT ?? 0.32, 0, 1);
          if (b.clampBelowFoliage !== false && f.layout === "pine") {
            const yFol = f.baseY + (f.offsetY ?? 0);
            const tFol = trunkHeightT(yFol, tr);
            const H = Math.max(0.15, tr.height);
            const marginT = (b.belowFoliageMargin ?? 0.15) / H;
            tMax = Math.min(tMax, Math.max(tMin + 0.02, tFol - marginT));
          }
          if (tMax < tMin) tMax = tMin;
          return { tMin, tMax };
        }

        /** Local +Y (branch base→tip) aligns to trunk outward, pitched around trunk tangent. */
        function quaternionForBranchAttach(trunkT, thetaRad, pitchUpDeg) {
          const b = params.branches;
          trunkTangentAtT(trunkT, params.trunk, _trunkTan);
          trunkOutwardAtT(trunkT, thetaRad, params.trunk, _trunkOut);
          _qSeg.setFromUnitVectors(_yAxis, _trunkOut);
          const pitch = pitchUpDeg * DEG;
          if (Math.abs(pitch) > 1e-6) {
            _qAz.setFromAxisAngle(_trunkTan, pitch);
            _qOut.copy(_qAz).multiply(_qSeg);
          } else {
            _qOut.copy(_qSeg);
          }
          if (b.rotXDeg || b.rotYDeg || b.rotZDeg) {
            _euler.set(
              b.rotXDeg * DEG,
              b.rotYDeg * DEG,
              b.rotZDeg * DEG,
              "XYZ",
            );
            _qCard.setFromEuler(_euler);
            _qOut.multiply(_qCard);
          }
          return _qOut;
        }

        function syncBranchMaterial() {
          branchMat.color.set(params.branches.color);
          branchMat.roughness = params.branches.roughness;
          branchMat.wireframe = params.debug.wireframe;
          branchMat.needsUpdate = true;
        }

        function updateBranchMatrices() {
          if (!branchesObject) return;
          const b = params.branches;
          const tr = params.trunk;
          const f = params.foliage;
          const count = branchPlacementCount(b);
          if (branchesObject.count !== count) return;

          const gScale =
            Number.isFinite(b.globalScale) && b.globalScale > 0
              ? b.globalScale
              : 1;
          const scaleVar = Math.max(0, b.scaleVariation);
          const lenVar = Math.max(0, b.lengthVariation ?? 0);
          const seed = b.placementSeed ?? 0;
          const { tMin, tMax } = branchTrunkTRange(b, tr, f);
          const along = THREE.MathUtils.clamp(
            Number.isFinite(b.pivotAlongRadius) ? b.pivotAlongRadius : 1,
            0,
            1,
          );
          const pitchBase = b.pitchUpDeg ?? 38;

          for (let idx = 0; idx < count; idx++) {
            const trunkT =
              tMin + foliageHash01(idx, 1, seed) * Math.max(0.001, tMax - tMin);
            const theta =
              foliageHash01(idx, 2, seed) * Math.PI * 2 +
              foliageRandomSignedDeg(idx, 3, seed, 12) * DEG;
            const pitchJit = foliageRandomSignedDeg(idx, 4, seed, 14);
            const R = Math.max(
              0.001,
              trunkRadiusAtT(trunkT, tr) - b.radialInset,
            );
            trunkCenterAtT(trunkT, tr, _dummy.position);
            trunkOutwardAtT(trunkT, theta, tr, _trunkOut);
            const embed = Math.max(0, b.trunkEmbed ?? 0.02);
            _dummy.position.addScaledVector(
              _trunkOut,
              Math.max(0, along * R - embed),
            );
            _dummy.position.x += b.offsetX;
            _dummy.position.y += b.offsetY;
            _dummy.position.z += b.offsetZ;
            const scaleJit =
              (1 + instanceScaleJitter(idx, scaleVar)) *
              (1 + instanceScaleJitter(idx + 17, lenVar));
            _dummy.quaternion.copy(
              quaternionForBranchAttach(trunkT, theta, pitchBase + pitchJit),
            );
            _dummy.scale.setScalar(gScale * scaleJit);
            _dummy.updateMatrix();
            branchesObject.setMatrixAt(idx, _dummy.matrix);
          }
          branchesObject.instanceMatrix.needsUpdate = true;
        }

        function disposeBranchesObject() {
          if (!branchesObject) return;
          scene.remove(branchesObject);
          branchesObject.dispose();
          branchesObject = null;
        }

        function ensureBranchesObject() {
          const pine = params.foliage.layout === "pine";
          const b = params.branches;
          if (!b.enabled || !pine || !branchGeo) {
            disposeBranchesObject();
            return;
          }

          const needCount = branchPlacementCount(b);
          if (needCount === 0) {
            disposeBranchesObject();
            return;
          }

          const needNew = !branchesObject || branchesObject.count !== needCount;

          if (needNew) {
            disposeBranchesObject();
            branchesObject = new THREE.InstancedMesh(
              branchGeo,
              branchMat,
              needCount,
            );
            branchesObject.frustumCulled = false;
            branchesObject.renderOrder = 0;
            branchesObject.castShadow = true;
            branchesObject.receiveShadow = false;
            scene.add(branchesObject);
          } else {
            branchesObject.geometry = branchGeo;
            branchesObject.material = branchMat;
          }
          syncBranchMaterial();
          updateBranchMatrices();
        }

        function rebuildBranchGeometry() {
          const b = params.branches;
          const newGeo = createBranchGeometry(b);
          if (branchGeo) branchGeo.dispose();
          branchGeo = newGeo;
          if (branchesObject) branchesObject.geometry = branchGeo;
          ensureBranchesObject();
        }

        function pineInstanceCapacity() {
          const f = params.foliage;
          return (
            Math.max(1, Math.round(f.levels)) *
            Math.max(1, Math.round(f.perRing))
          );
        }

        /**
         * Adapter over the shared placement module (same rules as the v3
         * runtime loader). Keeps the editor's visit(pos, scale) signature;
         * the card quaternion is left on _dummy.quaternion for
         * fillPineInstances, exactly like the old inline version did.
         */
        function forEachPineCardPlacement(options, visit) {
          return forEachPineCardPlacementShared(
            {
              foliage: params.foliage,
              trunk: params.trunk,
              transform: params.transform,
            },
            options,
            (pos, quat, scale) => {
              _dummy.position.copy(pos);
              _dummy.quaternion.copy(quat);
              visit(_dummy.position, scale);
            },
          );
        }

        /** @returns {number} instances written */
        function fillPineInstances(mesh, options = {}) {
          let out = 0;
          forEachPineCardPlacement(options, (pos, scale) => {
            _dummy.position.copy(pos);
            _dummy.scale.setScalar(scale);
            _dummy.updateMatrix();
            mesh.setMatrixAt(out++, _dummy.matrix);
          });
          mesh.count = out;
          mesh.instanceMatrix.needsUpdate = true;
          syncLeafBounds();
          return out;
        }

        function updateInstanceMatrices() {
          if (!foliageObject?.isInstancedMesh) return;
          const xOff =
            params.lodPreview && params.foliage.layout === "pine"
              ? -LOD_SPACING
              : 0;
          fillPineInstances(foliageObject, {
            keepFraction: 1,
            xOffset: xOff,
            scaleMul: 1,
          });
        }

        function countLeafTris(leafCount) {
          const trisPerCard = geo?.index
            ? geo.index.count / 3
            : geo
              ? (geo.attributes.position.count / 3) * 2
              : 2;
          return Math.round(leafCount * trisPerCard);
        }

        function updateStats() {
          const cap = pineInstanceCapacity();
          const n0 =
            foliageObject?.isInstancedMesh && params.foliage.layout === "pine"
              ? foliageObject.count
              : foliageObject
                ? 1
                : 0;
          params.totalLeaves = n0;
          params.totalLeafTris = countLeafTris(n0);
          params.lod1Leaves = lodMesh1 ? lodMesh1.count : 0;
          params.lod2Leaves = lodMesh2 ? lodMesh2.count : 0;
          if (trunkGeo) {
            params.trunkTris = trunkGeo.index
              ? trunkGeo.index.count / 3
              : trunkGeo.attributes.position.count / 3;
          } else {
            params.trunkTris = 0;
          }
          statTrunkTris?.update(String(params.trunkTris));
          statLeaves0?.update(String(params.totalLeaves));
          statLeafTris0?.update(String(params.totalLeafTris));
          statLod1Leaves?.update(String(params.lod1Leaves));
          statLod2Leaves?.update(String(params.lod2Leaves));
          statV2Leaves?.update();
        }

        function lodLabelRoundRect(ctx, x, y, w, h, r) {
          const rr = Math.min(r, w / 2, h / 2);
          ctx.beginPath();
          ctx.moveTo(x + rr, y);
          ctx.arcTo(x + w, y, x + w, y + h, rr);
          ctx.arcTo(x + w, y + h, x, y + h, rr);
          ctx.arcTo(x, y + h, x, y, rr);
          ctx.arcTo(x, y, x + w, y, rr);
          ctx.closePath();
        }

        function createLodGroundLabel() {
          const canvas = document.createElement("canvas");
          const W = 640;
          const H = 176;
          canvas.width = W;
          canvas.height = H;
          const ctx = canvas.getContext("2d");
          const tex = new THREE.CanvasTexture(canvas);
          tex.colorSpace = THREE.SRGBColorSpace;
          const matLabel = new THREE.MeshBasicMaterial({
            map: tex,
            transparent: true,
            depthWrite: false,
            toneMapped: false,
          });
          const geoLabel = new THREE.PlaneGeometry(5.8, 1.6);
          geoLabel.rotateX(-Math.PI / 2);
          const meshLabel = new THREE.Mesh(geoLabel, matLabel);
          meshLabel.renderOrder = 25;
          const label = { mesh: meshLabel, canvas, ctx, tex, W, H };
          label.redraw = (title, sub) => {
            const { ctx: c, tex: t, W: w, H: h } = label;
            c.clearRect(0, 0, w, h);
            lodLabelRoundRect(c, 8, 8, w - 16, h - 16, 14);
            c.fillStyle = "rgba(12, 18, 12, 0.9)";
            c.fill();
            c.strokeStyle = "rgba(100, 160, 95, 0.5)";
            c.lineWidth = 2;
            c.stroke();
            c.fillStyle = "#e8f0e4";
            c.font = "bold 26px Segoe UI, system-ui, sans-serif";
            c.textAlign = "center";
            c.textBaseline = "middle";
            c.fillText(title, w / 2, 56);
            c.fillStyle = "#9cb090";
            c.font = "17px Consolas, monospace";
            c.fillText(sub, w / 2, 112);
            t.needsUpdate = true;
          };
          return label;
        }

        function ensureLodGroundLabels() {
          if (lodGroundLabels.length) return;
          for (let i = 0; i < 3; i++) {
            const lb = createLodGroundLabel();
            lodGroundLabels.push(lb);
            scene.add(lb.mesh);
            lb.mesh.visible = false;
          }
        }

        function setLodGroundLabelsVisible(visible) {
          ensureLodGroundLabels();
          lodGroundLabels.forEach((lb) => {
            lb.mesh.visible = visible;
          });
        }

        function clearLodTrunkClones() {
          if (lodTrunk0Clone) {
            scene.remove(lodTrunk0Clone);
            lodTrunk0Clone = null;
          }
          if (lodTrunk1Clone) {
            scene.remove(lodTrunk1Clone);
            lodTrunk1Clone = null;
          }
          if (lodTrunk2Clone) {
            scene.remove(lodTrunk2Clone);
            lodTrunk2Clone = null;
          }
        }

        function clearLodPreviews() {
          if (lodMesh1) {
            scene.remove(lodMesh1);
            lodMesh1.dispose();
            lodMesh1 = null;
          }
          if (lodMesh2) {
            scene.remove(lodMesh2);
            lodMesh2.dispose();
            lodMesh2 = null;
          }
          clearLodTrunkClones();
        }

        function cloneTrunksForLod() {
          clearLodTrunkClones();
          if (!params.trunk.visible) return;
          const src = trunkMesh;
          const offsets = [-LOD_SPACING, 0, LOD_SPACING];
          const clones = [];
          for (let i = 0; i < 3; i++) {
            const c = src.clone();
            c.position.copy(src.position);
            c.position.x = offsets[i];
            c.visible = params.trunk.visible;
            c.castShadow = true;
            c.receiveShadow = true;
            scene.add(c);
            clones.push(c);
          }
          lodTrunk0Clone = clones[0];
          lodTrunk1Clone = clones[1];
          lodTrunk2Clone = clones[2];
        }

        function updateLodTrunkVisibility() {
          if (params.lodPreview && params.foliage.layout === "pine") {
            trunkMesh.visible = false;
          } else {
            trunkMesh.visible = params.trunk.visible;
          }
        }

        function updateLodLabels() {
          ensureLodGroundLabels();
          if (!params.lodPreview || params.foliage.layout !== "pine") {
            setLodGroundLabelsVisible(false);
            return;
          }
          const offsets = [-LOD_SPACING, 0, LOD_SPACING];
          const n0 =
            foliageObject?.isInstancedMesh && params.foliage.layout === "pine"
              ? foliageObject.count
              : params.totalLeaves;
          const n1 = lodMesh1?.count ?? params.lod1Leaves;
          const n2 = lodMesh2?.count ?? params.lod2Leaves;
          const titles = [
            "LOD 0 — Full Detail",
            "LOD 1 — Half Density",
            "LOD 2 — Far (same shape)",
          ];
          const subs = [
            `${n0} leaves · < ${params.lodDist1}m · receive shadow`,
            `${n1} leaves · 1.4× · same shader · no receive shadow`,
            `${n2} leaves · same as LOD1 · cheap shader · ${params.lodDist2}m+`,
          ];
          offsets.forEach((xOff, i) => {
            lodGroundLabels[i].mesh.position.set(xOff, 0.02, LOD_LABEL_Z);
            lodGroundLabels[i].redraw(titles[i], subs[i]);
          });
          setLodGroundLabelsVisible(true);
        }

        function rebuildLodPreviews() {
          clearLodPreviews();
          if (!params.lodPreview || params.foliage.layout !== "pine" || !geo)
            return;

          updateInstanceMatrices();

          const cap = pineInstanceCapacity();
          lodMesh1 = new THREE.InstancedMesh(geo, mat, cap);
          lodMesh1.frustumCulled = false;
          lodMesh1.castShadow = true;
          lodMesh1.receiveShadow = false;
          fillPineInstances(lodMesh1, {
            keepFraction: 0.5,
            xOffset: 0,
            scaleMul: 1.414,
          });
          scene.add(lodMesh1);

          lodMesh2 = new THREE.InstancedMesh(geo, matLod2, cap);
          lodMesh2.frustumCulled = false;
          lodMesh2.castShadow = false;
          lodMesh2.receiveShadow = false;
          fillPineInstances(lodMesh2, {
            keepFraction: 0.5,
            xOffset: LOD_SPACING,
            scaleMul: 1.414,
          });
          scene.add(lodMesh2);

          cloneTrunksForLod();
          updateLodTrunkVisibility();
          updateStats();
          updateLodLabels();
        }

        function refreshLodSystem() {
          if (branchesObject) {
            branchesObject.visible =
              params.branches.enabled &&
              !params.lodPreview &&
              params.foliage.layout === "pine";
          }
          if (params.lodPreview && params.foliage.layout === "pine") {
            rebuildLodPreviews();
          } else {
            clearLodPreviews();
            updateInstanceMatrices();
            updateLodTrunkVisibility();
            setLodGroundLabelsVisible(false);
          }
          syncFoliageVisibility();
          applyShadowFlags();
          updateStats();
        }

        function toggleLodPreview() {
          if (params.foliage.layout !== "pine") {
            params.lodPreview = false;
            infoEl.textContent = "LOD preview requires Pine layout.";
            return;
          }
          if (params.lodPreview) {
            controls.target.set(0, 3, 0);
            camera.position.set(0, 6, 22);
          } else {
            controls.target.set(0, 3, 0);
            camera.position.set(7, 5, 10);
          }
          controls.update();
          refreshLodSystem();
        }

        function detectAlphaChannel(image) {
          try {
            const w = image.width || image.naturalWidth;
            const h = image.height || image.naturalHeight;
            if (!w || !h) return false;
            const c = document.createElement("canvas");
            c.width = w;
            c.height = h;
            const ctx = c.getContext("2d", { willReadFrequently: true });
            ctx.drawImage(image, 0, 0);
            const data = ctx.getImageData(0, 0, w, h).data;
            for (let i = 3; i < data.length; i += 16) {
              if (data[i] < 255) return true;
            }
            return false;
          } catch {
            return false;
          }
        }

        function textureToDataUrl(tex) {
          const img = tex?.image;
          if (!img) return "";
          try {
            const w = img.width || img.naturalWidth;
            const h = img.height || img.naturalHeight;
            if (!w || !h) return "";
            const c = document.createElement("canvas");
            c.width = w;
            c.height = h;
            c.getContext("2d").drawImage(img, 0, 0);
            return c.toDataURL("image/png");
          } catch {
            return "";
          }
        }

        function updateGallerySelection() {
          galleryImgs.forEach((img, i) => {
            img.classList.toggle(
              "active",
              PINE_LEAF_TEXTURES[i].path === activeLeafTexPath,
            );
          });
        }

        function buildTexGallery(parent) {
          const label = document.createElement("div");
          label.className = "tex-gallery-label";
          label.textContent = "Built-in pine textures";
          parent.appendChild(label);

          const galleryEl = document.createElement("div");
          galleryEl.className = "tex-gallery";
          parent.appendChild(galleryEl);

          galleryImgs = [];
          PINE_LEAF_TEXTURES.forEach((t) => {
            const wrap = document.createElement("div");
            wrap.className = "tex-item";
            const img = document.createElement("img");
            img.src = resolvePublicPath(t.path);
            img.title = t.name;
            img.alt = t.name;
            img.addEventListener("click", () =>
              loadLeafTexFromPath(t.path, t.mode),
            );
            wrap.appendChild(img);
            const cap = document.createElement("div");
            cap.className = "tex-label";
            cap.textContent = t.name;
            wrap.appendChild(cap);
            galleryEl.appendChild(wrap);
            galleryImgs.push(img);
          });
          updateGallerySelection();
        }

        function loadLeafTexFromPath(path, mode) {
          const entry = PINE_LEAF_TEXTURES.find((t) => t.path === path);
          const url = resolvePublicPath(path);
          texLoader.load(
            url,
            (tex) => {
              configureMaskTexture(tex);
              disposeUploadedTexture();
              uploadedTex = tex;
              activeLeafTexPath = path;
              activeLeafTexDataUrl = "";
              if (entry?.mode) {
                params.material.textureMode = entry.mode;
              } else if (mode === "atlas" || mode === "single") {
                params.material.textureMode = mode;
              }
              params.material.uploadName =
                entry?.name || path.split("/").pop() || path;
              const img = tex.image;
              if (img) {
                params.material.maskMode = detectAlphaChannel(img)
                  ? "alpha"
                  : "luminance";
              }
              syncMaterial();
              refreshUploadName();
              updateGallerySelection();
              infoEl.textContent = `Texture loaded: ${params.material.uploadName}`;
            },
            undefined,
            (err) => {
              console.error(err);
              infoEl.textContent = `Failed to load texture: ${url}`;
            },
          );
        }

        function loadLeafTexFromDataUrl(dataUrl, displayName) {
          const img = new Image();
          img.onload = () => {
            const tex = new THREE.Texture(img);
            configureMaskTexture(tex);
            disposeUploadedTexture();
            uploadedTex = tex;
            activeLeafTexPath = "";
            activeLeafTexDataUrl = dataUrl;
            params.material.uploadName = displayName || "(embedded)";
            params.material.maskMode = detectAlphaChannel(img)
              ? "alpha"
              : "luminance";
            syncMaterial();
            refreshUploadName();
            updateGallerySelection();
            infoEl.textContent = `Texture loaded: ${params.material.uploadName}`;
          };
          img.src = dataUrl;
        }

        function migrateExportParams() {
          if (!params.export) {
            params.export = {
              trunkFile: "",
              trunkLod1File: "",
              trunkScale: 1,
              billboardLeaves: false,
              billboardYawOnly: true,
            };
          }
        }

        function buildPineEditorSnapshot() {
          const snapshot = JSON.parse(JSON.stringify(params));
          for (const k of [
            "trunkTris",
            "totalLeaves",
            "totalLeafTris",
            "lod1Leaves",
            "lod2Leaves",
          ]) {
            delete snapshot[k];
          }
          return snapshot;
        }

        function buildV2MaterialBlock() {
          const m = params.material;
          const ex = params.export;
          return {
            bottomColor: m.bottomColor,
            topColor: m.topColor,
            colorVar: m.colorVar,
            roughness: m.roughness,
            alphaCutoff: m.alphaTest,
            sssColor: m.sssColor,
            sssStr: m.sssStrength,
            sssPow: m.sssPower,
            rimColor: m.rimColor,
            rimStr: m.rimStrength,
            rimPow: m.rimPower,
            aoStr: m.aoStrength,
            normalBias: m.normalBias,
            leafWarp: m.leafWarp,
            // Pine shading model params — read by the shared foliage shader's
            // pineMode branch so the game matches the editor.
            radialUp: m.radialUp,
            pivotAo: m.pivotAo,
            veinStrength: m.veinStrength,
            billboardLeaves: !!ex.billboardLeaves,
            billboardYawOnly: ex.billboardYawOnly !== false,
          };
        }

        function buildPineParamBlock() {
          return {
            rect: { ...params.rect },
            grid: { ...params.grid },
            shape: { ...params.shape },
            transform: { ...params.transform },
            foliage: { ...params.foliage },
            trunk: { ...params.trunk },
            branches: { ...params.branches },
          };
        }

        function countPineLeaves(keepFraction) {
          return forEachPineCardPlacement({ keepFraction }, () => {});
        }

        function buildPresetData() {
          migrateExportParams();
          migrateFoliageParams(params.foliage);
          syncLeafBounds();
          const bounds = computePineCanopyBounds();
          const ex = params.export;
          return {
            pineEditor: PRESET_VERSION,
            presetName: params.presetName,
            foliageLayout: "pine",
            trunkFile: ex.trunkFile || "",
            trunkLod1File: ex.trunkLod1File || "",
            leafTexture:
              activeLeafTexPath ||
              activeLeafTexDataUrl ||
              textureToDataUrl(uploadedTex) ||
              "",
            leafTextureName: params.material.uploadName,
            material: buildV2MaterialBlock(),
            wind: {
              windSpeed: params.wind.speed,
              windStr: params.wind.strength,
              windMicro: params.wind.micro,
            },
            trunkScale: ex.trunkScale ?? 1,
            lodDistances: {
              lod1: params.lodDist1,
              lod2: params.lodDist2,
            },
            leafCounts: {
              lod0: countPineLeaves(1),
              lod1: countPineLeaves(0.5),
              lod2: countPineLeaves(0.5),
            },
            bounds: bounds
              ? {
                  yMin: bounds.yMin,
                  yMax: bounds.yMax,
                  canopyCenter: bounds.canopyCenter.toArray(),
                  aoRadius: bounds.aoRadius,
                }
              : null,
            pine: buildPineParamBlock(),
            params: buildPineEditorSnapshot(),
          };
        }

        async function exportTrunkGlb() {
          if (!trunkGeo) {
            infoEl.textContent = "No trunk mesh to export.";
            return;
          }
          const exportRoot = new THREE.Mesh(
            trunkGeo.clone(),
            new THREE.MeshStandardMaterial({
              color: params.trunk.barkMid || "#4a3528",
              roughness: params.trunk.roughness ?? 0.94,
              metalness: 0,
            }),
          );
          exportRoot.position.copy(trunkMesh.position);
          exportRoot.updateMatrixWorld(true);
          try {
            const buffer = await new GLTFExporter().parseAsync(exportRoot, {
              binary: true,
            });
            exportRoot.geometry.dispose();
            const name = (params.presetName || "pine_trunk").replace(
              /[^a-z0-9_\-]/gi,
              "_",
            );
            const blob = new Blob([buffer], {
              type: "model/gltf-binary",
            });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = name + "_trunk.glb";
            a.click();
            URL.revokeObjectURL(a.href);
            params.export.trunkFile = name + "_trunk.glb";
            infoEl.textContent = `Trunk GLB saved — set trunkFile to ${params.export.trunkFile} in tree-presets/ or models/trunks/`;
          } catch (e) {
            console.error(e);
            infoEl.textContent = "Trunk export failed: " + e.message;
          }
        }

        async function savePreset() {
          const data = buildPresetData();
          const json = JSON.stringify(data, null, 2);
          const name = (params.presetName || "pine_preset").replace(
            /[^a-z0-9_\-]/gi,
            "_",
          );
          if (window.showSaveFilePicker) {
            try {
              const handle = await showSaveFilePicker({
                suggestedName: name + ".json",
                types: [
                  {
                    description: "Pine editor preset",
                    accept: { "application/json": [".json"] },
                  },
                ],
              });
              const writable = await handle.createWritable();
              await writable.write(json);
              await writable.close();
              infoEl.textContent = `Preset saved: ${name}.json`;
            } catch (e) {
              if (e.name !== "AbortError") console.error(e);
            }
          } else {
            const a = document.createElement("a");
            a.href = URL.createObjectURL(
              new Blob([json], { type: "application/json" }),
            );
            a.download = name + ".json";
            a.click();
            URL.revokeObjectURL(a.href);
            infoEl.textContent = `Preset saved: ${name}.json`;
          }
        }

        function deepAssign(target, source) {
          if (!source || typeof source !== "object") return;
          for (const key of Object.keys(source)) {
            const sv = source[key];
            if (sv && typeof sv === "object" && !Array.isArray(sv)) {
              if (!target[key] || typeof target[key] !== "object")
                target[key] = {};
              deepAssign(target[key], sv);
            } else {
              target[key] = sv;
            }
          }
        }

        function applyV2Envelope(data) {
          migrateExportParams();
          migrateFoliageParams(params.foliage);
          const ex = params.export;
          if (data.trunkFile != null) ex.trunkFile = data.trunkFile;
          if (data.trunkLod1File != null) ex.trunkLod1File = data.trunkLod1File;
          if (data.trunkScale != null) ex.trunkScale = data.trunkScale;
          if (data.lodDistances) {
            params.lodDist1 = data.lodDistances.lod1 ?? params.lodDist1;
            params.lodDist2 = data.lodDistances.lod2 ?? params.lodDist2;
          }
          if (data.material) {
            const m = data.material;
            const mat = params.material;
            if (m.bottomColor) mat.bottomColor = m.bottomColor;
            if (m.topColor) mat.topColor = m.topColor;
            if (m.colorVar != null) mat.colorVar = m.colorVar;
            if (m.roughness != null) mat.roughness = m.roughness;
            if (m.alphaCutoff != null) mat.alphaTest = m.alphaCutoff;
            if (m.sssColor) mat.sssColor = m.sssColor;
            if (m.sssStr != null) mat.sssStrength = m.sssStr;
            if (m.sssPow != null) mat.sssPower = m.sssPow;
            if (m.rimColor) mat.rimColor = m.rimColor;
            if (m.rimStr != null) mat.rimStrength = m.rimStr;
            if (m.rimPow != null) mat.rimPower = m.rimPow;
            if (m.aoStr != null) mat.aoStrength = m.aoStr;
            if (m.normalBias != null) mat.normalBias = m.normalBias;
            if (m.leafWarp != null) mat.leafWarp = m.leafWarp;
            if (m.billboardLeaves != null)
              ex.billboardLeaves = m.billboardLeaves;
            if (m.billboardYawOnly != null)
              ex.billboardYawOnly = m.billboardYawOnly;
          }
          if (data.wind) {
            const w = data.wind;
            if (w.windSpeed != null) params.wind.speed = w.windSpeed;
            if (w.windStr != null) params.wind.strength = w.windStr;
            if (w.windMicro != null) params.wind.micro = w.windMicro;
          }
        }

        function applyPresetData(data) {
          const hasEditor =
            (data.pineEditor === 1 || data.pineEditor === 2) && data.params;
          const hasV2 =
            data.foliageLayout === "pine" && (data.pine || data.params);
          if (!hasEditor && !hasV2) {
            throw new Error(
              "Not a pine preset (need pineEditor+params or foliageLayout pine)",
            );
          }
          if (data.params) deepAssign(params, data.params);
          if (data.pine) {
            if (data.pine.rect) deepAssign(params.rect, data.pine.rect);
            if (data.pine.grid) deepAssign(params.grid, data.pine.grid);
            if (data.pine.shape) deepAssign(params.shape, data.pine.shape);
            if (data.pine.transform)
              deepAssign(params.transform, data.pine.transform);
            if (data.pine.foliage)
              deepAssign(params.foliage, data.pine.foliage);
            if (data.pine.trunk) deepAssign(params.trunk, data.pine.trunk);
            if (data.pine.branches)
              deepAssign(params.branches, data.pine.branches);
          }
          applyV2Envelope(data);
          migrateExportParams();
          migrateBranchParams(params.branches);
          migrateTrunkParams(params.trunk);
          migrateFoliageParams(params.foliage);
          migrateLod2CheapParams(params);
          if (data.presetName) params.presetName = data.presetName;
          migrateLightingParams();
          presetNameInput?.refresh();
          trunkFileInput?.refresh?.();
          trunkLod1Input?.refresh?.();

          rebuildTrunk();
          rebuildGeometry();
          rebuildBranchGeometry();
          syncMaterial();
          syncBranchMaterial();
          syncScene();
          rebuildSkyEnv();
          if (params.foliage.layout === "pine") {
            ensureFoliageObject();
            updateInstanceMatrices();
            ensureBranchesObject();
            updateBranchMatrices();
          } else {
            ensureFoliageObject();
            applySingleTransform();
          }
          refreshLodSystem();
          updatePivotHelper();

          if (data.leafTexture) {
            if (data.leafTexture.startsWith("data:")) {
              loadLeafTexFromDataUrl(
                data.leafTexture,
                data.leafTextureName || "(embedded)",
              );
            } else if (
              data.leafTexture.startsWith("textures/") ||
              data.leafTexture.includes("/")
            ) {
              loadLeafTexFromPath(data.leafTexture);
            }
          } else {
            activeLeafTexPath = "";
            activeLeafTexDataUrl = "";
            clearUploadedTexture();
          }
        }

        function loadPresetFromFile(file) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              applyPresetData(JSON.parse(ev.target.result));
              infoEl.textContent = `Preset loaded: ${file.name}`;
            } catch (e) {
              infoEl.textContent = "Invalid preset: " + e.message;
            }
          };
          reader.readAsText(file);
        }

        function disposeFoliageObject() {
          if (!foliageObject) return;
          scene.remove(foliageObject);
          if (foliageObject.isInstancedMesh) foliageObject.dispose();
          foliageObject = null;
        }

        function syncFoliageVisibility() {
          const show = params.foliage.enabled !== false;
          if (foliageObject) foliageObject.visible = show;
          if (lodMesh1) lodMesh1.visible = show;
          if (lodMesh2) lodMesh2.visible = show;
        }

        function ensureFoliageObject() {
          const f = params.foliage;
          const pine = f.layout === "pine";
          const needCount = pine ? pineInstanceCapacity() : 1;

          const needNewType =
            !foliageObject ||
            (pine && !foliageObject.isInstancedMesh) ||
            (!pine && foliageObject.isInstancedMesh) ||
            (pine &&
              foliageObject.isInstancedMesh &&
              foliageMeshCapacity !== needCount);

          if (needNewType) {
            disposeFoliageObject();
            if (pine) {
              foliageMeshCapacity = needCount;
              foliageObject = new THREE.InstancedMesh(geo, mat, needCount);
              foliageObject.frustumCulled = false;
              foliageObject.renderOrder = 1;
              foliageObject.castShadow = true;
              foliageObject.receiveShadow = false;
              scene.add(foliageObject);
              updateInstanceMatrices();
            } else {
              foliageObject = new THREE.Mesh(geo, mat);
              foliageObject.castShadow = true;
              foliageObject.receiveShadow = false;
              scene.add(foliageObject);
              applySingleTransform();
            }
          } else {
            foliageObject.geometry = geo;
            foliageObject.material = mat;
            foliageObject.castShadow = true;
            foliageObject.receiveShadow = false;
            if (pine) updateInstanceMatrices();
            else applySingleTransform();
          }
          syncFoliageVisibility();
          applyShadowFlags();
          updatePivotHelper();
        }

        function rebuildTrunk() {
          const t = params.trunk;
          if (trunkGeo) trunkGeo.dispose();
          // Shared builder (open-ended tube + base/tip caps — no hidden
          // per-segment caps). Geometry is trunk-local: mesh stays at origin.
          trunkGeo = buildPineTrunkGeometry(t);
          trunkMesh.position.set(0, 0, 0);
          trunkMesh.geometry = trunkGeo;
          trunkMesh.material = trunkMat;
          trunkMesh.visible = t.visible;
          syncTrunkBounds();
          syncTrunkMaterial();
        }

        function updatePivotHelper() {
          if (pivotHelperRoot) {
            scene.remove(pivotHelperRoot);
            pivotHelperRoot.traverse((o) => {
              o.geometry?.dispose?.();
              const m = o.material;
              if (m) (Array.isArray(m) ? m : [m]).forEach((x) => x.dispose?.());
            });
            pivotHelperRoot = null;
          }
          if (
            !params.debug.showPivot ||
            !foliageObject ||
            params.foliage.enabled === false
          )
            return;

          const axes = new THREE.AxesHelper(0.2);
          if (foliageObject.isInstancedMesh) {
            const m = new THREE.Matrix4();
            foliageObject.getMatrixAt(0, m);
            m.decompose(_dummy.position, _dummy.quaternion, _v3);
            const g = new THREE.Group();
            g.position.copy(_dummy.position);
            g.quaternion.copy(_dummy.quaternion);
            g.add(axes);
            scene.add(g);
            pivotHelperRoot = g;
          } else {
            foliageObject.add(axes);
            pivotHelperRoot = axes;
          }
        }

        function rebuildGeometry() {
          // Same card builder the runtime loader uses (clamps + bendY seg guard inside).
          const newGeo = createPineCardGeometry(
            params.rect,
            params.grid,
            params.shape,
          );
          if (foliageObject) foliageObject.geometry = newGeo;
          if (geo) geo.dispose();
          geo = newGeo;
          ensureFoliageObject();
        }

        function syncScene() {
          const sc = params.scene;
          updateSun();
          applyCsmSettings();
          applyShadowFlags();
          ground.visible = sc.showGround;
          scene.fog = sc.showFog
            ? new THREE.FogExp2(params.light.hemiSkyColor, 0.018)
            : null;
          syncLeafUniforms();
        }

        migrateBranchParams(params.branches);
        migrateTrunkParams(params.trunk);
        rebuildTrunk();
        rebuildGeometry();
        rebuildBranchGeometry();
        syncMaterial();
        syncTrunkMaterial();
        syncBranchMaterial();
        syncWindUniforms();
        syncScene();

        let refreshUploadName = () => {};
        let presetNameInput = null;
        let trunkFileInput = null;
        let trunkLod1Input = null;
        let statV2Leaves = null;

        migrateExportParams();
        migrateFoliageParams(params.foliage);
        migrateLod2CheapParams(params);
        let statTrunkTris = null;
        let statLeaves0 = null;
        let statLeafTris0 = null;
        let statLod1Leaves = null;
        let statLod2Leaves = null;

        const onTrunkShape = () => {
          rebuildTrunk();
          if (params.foliage.layout === "pine") updateInstanceMatrices();
          refreshLodSystem();
          if (params.branches.enabled) updateBranchMatrices();
          updatePivotHelper();

        const onTrunkBark = () => {
          syncTrunkMaterial();

        const onFoliage = () => {
          syncLeafBounds();
          ensureFoliageObject();
          ensureBranchesObject();
          if (params.branches.enabled) updateBranchMatrices();
          refreshLodSystem();

        const onFoliageMatrices = () => {

          else applySingleTransform();

        const onGeom = () => {

          refreshLodSystem();
        };
        const onCardTilt = () => {
          if (params.foliage.layout === "pine") refreshLodSystem();
          else applySingleTransform();
          if (params.debug.showPivot) updatePivotHelper();
        };
        const onBranchStruct = () => ensureBranchesObject();
        const onBranchMat = () => syncBranchMaterial();
        const onBranchGeom = () => rebuildBranchGeometry();
        const onBranchLayout = () => updateBranchMatrices();
        const onMaterial = () => syncMaterial();
        const onScene = () => syncScene();
        const onDebug = () => {

        fileInput.addEventListener("change", () => {

        _slider(sTrunk, t, "radiusTop", {

        _slider(sTrunk, t, "yOffset", {

        _slider(sTrunk, t, "curveBend", {

        _slider(sLeaf, m, "leafWarp", {

        _slider(sLeaf, m, "radialUp", {

        _slider(sLeaf, m, "aoStrength", {
