          max: 0.85,
          step: 0.02,
          onChange: onMaterial,
        });
        _slider(sLeaf, m, "aoRadius", {
          label: "inner AO radius",
          min: 0.3,
          max: 6,
          step: 0.05,
          onChange: onMaterial,
        });
        _slider(sLeaf, m, "sssStrength", {
          label: "SSS",
          min: 0,
          max: 1,
          step: 0.02,
          onChange: onMaterial,
        });
        _color(sLeaf, m, "sssColor", {
          label: "SSS color",
          onChange: onMaterial,
        });
        _slider(sLeaf, m, "sssPower", {
          label: "SSS power",
          min: 0.5,
          max: 6,
          step: 0.1,
          onChange: onMaterial,
        });
        _slider(sLeaf, m, "rimStrength", {
          label: "rim",
          min: 0,
          max: 0.5,
          step: 0.01,
          onChange: onMaterial,
        });
        _color(sLeaf, m, "rimColor", {
          label: "rim color",
          onChange: onMaterial,
        });
        _slider(sLeaf, m, "rimPower", {
          label: "rim power",
          min: 0.5,
          max: 6,
          step: 0.1,
          onChange: onMaterial,
        });

        const sSc = _section(uiRoot, "Scene", false);
        _toggle(sSc, sc, "showFog", { label: "Show fog", onChange: onScene });
        _toggle(sSc, sc, "showGround", {
          label: "Show ground",
          onChange: onScene,
        });
        _toggle(sSc, sc, "castFoliageShadows", {
          label: "foliage casts shadow",
          onChange: onScene,
        });
        _toggle(sSc, sc, "receiveFoliageShadows", {
          label: "foliage receives shadow",
          onChange: onScene,
        });
        _info(
          sSc,
          "shadow-hint",
          () =>
            "Receive: leaf-on-leaf + trunk on cards. Turn cast on too. Compare vs Material AO sliders.",
        );

        {
          const sec = _section(uiRoot, "Lights", true);
          _slider(sec, L, "sunAzimuth", {
            label: "Sun azimuth",
            min: 0,
            max: 360,
            step: 1,
            onChange: () => {
              updateSun();
              rebuildSkyEnv();
            },
          });
          _slider(sec, L, "sunElevation", {
            label: "Sun elev",
            min: -10,
            max: 90,
            step: 1,
            onChange: () => {
              updateSun();
              rebuildSkyEnv();
            },
          });
          _color(sec, L, "dirColor", {
            label: "Sun color",
            onChange: () => updateSun(),
          });
          _slider(sec, L, "dirIntensity", {
            label: "Sun int",
            min: 0,
            max: 10,
            step: 0.05,
            onChange: () => updateSun(),
          });
          _separator(sec);
          _color(sec, L, "hemiSkyColor", {
            label: "Hemi sky",
            onChange: () => updateSun(),
          });
          _color(sec, L, "hemiGroundColor", {
            label: "Hemi ground",
            onChange: () => updateSun(),
          });
          _slider(sec, L, "hemiIntensity", {
            label: "Hemi int",
            min: 0,
            max: 3,
            step: 0.05,
            onChange: () => updateSun(),
          });
          _separator(sec);
          _slider(sec, L, "envIntensity", {
            label: "Env int",
            min: 0,
            max: 3,
            step: 0.05,
            onChange: () => updateSun(),
          });
          _slider(sec, L, "exposure", {
            label: "Exposure",
            min: 0,
            max: 3,
            step: 0.05,
            onChange: () => updateSun(),
          });
          _separator(sec);
          _slider(sec, L, "shadowBias", {
            label: "Shadow bias",
            min: -0.005,
            max: 0.001,
            step: 0.00005,
            onChange: () => updateSun(),
          });
          _slider(sec, L, "shadowNormalBias", {
            label: "Normal bias",
            min: 0,
            max: 0.08,
            step: 0.001,
            onChange: () => updateSun(),
          });
        }

        {
          const sec = _section(uiRoot, "Shadows (CSM)", false);
          const onCsm = () => applyCsmSettings();
          _slider(sec, csmCfg, "maxFar", {
            label: "Max far (m)",
            min: 16,
            max: 300,
            step: 4,
            onChange: onCsm,
          });
          _slider(sec, csmCfg, "mapSize", {
            label: "Map size",
            min: 1024,
            max: 8192,
            step: 512,
            onChange: onCsm,
          });
          _slider(sec, csmCfg, "lightMargin", {
            label: "Light margin",
            min: 0,
            max: 120,
            step: 2,
            onChange: onCsm,
          });
          _slider(sec, csmCfg, "cascades", {
            label: "Cascades",
            min: 1,
            max: 4,
            step: 1,
            onChange: onCsm,
          });
          _info(
            sec,
            "csm-hint",
            () =>
              "Lower max far + higher map size = sharper ground/foliage shadows. CSM frustums follow the camera each frame.",
          );
        }

        {
          const sec = _section(uiRoot, "Sky", true);
          const reb = () => rebuildSkyEnv();
          _slider(sec, phySky, "turbidity", {
            label: "Turbidity",
            min: 0.1,
            max: 20,
            step: 0.1,
            onChange: reb,
          });
          _slider(sec, phySky, "rayleigh", {
            label: "Rayleigh",
            min: 0,
            max: 4,
            step: 0.01,
            onChange: reb,
          });
          _slider(sec, phySky, "mie", {
            label: "Mie",
            min: 0,
            max: 0.1,
            step: 0.0005,
            onChange: reb,
          });
          _slider(sec, phySky, "mieG", {
            label: "Mie G",
            min: 0,
            max: 0.999,
            step: 0.001,
            onChange: reb,
          });
          _slider(sec, phySky, "cloudCoverage", {
            label: "Cloud cov",
            min: 0,
            max: 1,
            step: 0.01,
            onChange: reb,
          });
          _slider(sec, phySky, "cloudDensity", {
            label: "Cloud dens",
            min: 0,
            max: 2,
            step: 0.01,
            onChange: reb,
          });
          _slider(sec, phySky, "cloudElevation", {
            label: "Cloud elev",
            min: 0,
            max: 1,
            step: 0.01,
            onChange: reb,
          });
          _slider(sec, phySky, "meshScale", {
            label: "Mesh scale",
            min: 1000,
            max: 50000,
            step: 100,
            onChange: reb,
          });
        }

        const sWind = _section(uiRoot, "Wind", true);
        _toggle(sWind, wnd, "enabled", {
          label: "enable wind",
          onChange: onMaterial,
        });
        _slider(sWind, wnd, "speed", {
          label: "speed",
          min: 0,
          max: 4,
          step: 0.05,
          onChange: onMaterial,
        });
        _slider(sWind, wnd, "strength", {
          label: "sway",
          min: 0,
          max: 0.45,
          step: 0.01,
          onChange: onMaterial,
        });
        _slider(sWind, wnd, "micro", {
          label: "flutter",
          min: 0,
          max: 0.15,
          step: 0.005,
          onChange: onMaterial,
        });
        _slider(sWind, wnd, "directionDeg", {
          label: "direction °",
          min: 0,
          max: 360,
          step: 1,
          onChange: onMaterial,
        });
        _info(
          sWind,
          "wind-hint",
          () => "Vertex sway in world XZ; hook (low Y) moves less than tips.",
        );

        const sDbg = _section(uiRoot, "Debug", false);
        _toggle(sDbg, dbg, "wireframe", {
          label: "wireframe",
          onChange: onDebug,
        });
        _toggle(sDbg, dbg, "showPivot", {
          label: "axes at pivot",
          onChange: onDebug,
        });

        _separator(uiRoot);
        const sLod = _section(uiRoot, "LOD Preview", true);
        _toggle(sLod, params, "lodPreview", {
          label: "Show LOD side-by-side",
          onChange: () => toggleLodPreview(),
        });
        _separator(sLod);
        _slider(sLod, params, "lodDist1", {
          label: "LOD0 → LOD1 dist",
          min: 20,
          max: 300,
          step: 5,
          onChange: () => updateLodLabels(),
        });
        _slider(sLod, params, "lodDist2", {
          label: "LOD1 → LOD2 dist",
          min: 50,
          max: 600,
          step: 10,
          onChange: () => updateLodLabels(),
        });
        _separator(sLod);
        statLod1Leaves = _info(sLod, "LOD1 leaves", () =>
          String(params.lod1Leaves),
        );
        statLod2Leaves = _info(sLod, "LOD2 leaves", () =>
          String(params.lod2Leaves),
        );
        _info(
          sLod,
          "lod1-hint",
          () =>
            "LOD1 = half leaves, 1.4× cards, same material as LOD0, no receive shadow.",
        );
        _separator(sLod);
        const sLod2 = sLod;
        _slider(sLod2, params.lod2Cheap, "aoStrengthMul", {
          label: "LOD2 AO boost",
          min: 1,
          max: 2,
          step: 0.05,
          onChange: () => {
            syncLod2Uniforms();
            matLod2.needsUpdate = true;
          },
        });
        _slider(sLod2, params.lod2Cheap, "colorVarMul", {
          label: "LOD2 color var",
          min: 0.1,
          max: 1,
          step: 0.05,
          onChange: () => syncLod2Uniforms(),
        });
        _slider(sLod2, params.lod2Cheap, "sssMul", {
          label: "LOD2 SSS",
          min: 0,
          max: 1,
          step: 0.05,
          onChange: () => syncLod2Uniforms(),
        });
        _slider(sLod2, params.lod2Cheap, "rimMul", {
          label: "LOD2 rim",
          min: 0,
          max: 1,
          step: 0.05,
          onChange: () => syncLod2Uniforms(),
        });

        const sStats = _section(uiRoot, "Stats", true);
        statTrunkTris = _info(sStats, "Trunk tris", () =>
          String(params.trunkTris),
        );
        statLeaves0 = _info(sStats, "LOD0 leaves", () =>
          String(params.totalLeaves),
        );
        statLeafTris0 = _info(sStats, "LOD0 leaf tris", () =>
          String(params.totalLeafTris),
        );

        const sV2 = _section(uiRoot, "V2 engine handoff", true);
        const ex = params.export;
        trunkFileInput = _text(sV2, ex, "trunkFile", {
          label: "trunkFile",
          onChange: () => {},
        });
        trunkLod1Input = _text(sV2, ex, "trunkLod1File", {
          label: "trunk LOD1",
          onChange: () => {},
        });
        _slider(sV2, ex, "trunkScale", {
          label: "trunk scale",
          min: 0.05,
          max: 3,
          step: 0.01,
          onChange: () => {},
        });
        _toggle(sV2, ex, "billboardLeaves", {
          label: "billboard LOD (v2)",
          onChange: () => {},
        });
        _toggle(sV2, ex, "billboardYawOnly", {
          label: "billboard yaw only",
          onChange: () => {},
        });
        statV2Leaves = _info(sV2, "leaf counts L0/L1/L2", () => {
          const l0 = countPineLeaves(1);
          const l1 = countPineLeaves(0.5);
          const l2 = countPineLeaves(0.5);
          return `${l0} / ${l1} / ${l2}`;
        });
        _button(sV2, {
          title: "Export trunk → GLB (for models/trunks/)",
          onClick: exportTrunkGlb,
        });

        _separator(uiRoot);
        const sPreset = _section(uiRoot, "Save / Load", true);
        presetNameInput = _text(sPreset, params, "presetName", {
          label: "Preset name",
        });
        _button(sPreset, {
          title: "Save preset (pine + v2 fields)",
          onClick: savePreset,
        });
        _button(sPreset, {
          title: "Load preset from file",
          onClick: () => {
            const i = document.createElement("input");
            i.type = "file";
            i.accept = ".json";
            i.onchange = () => i.files[0] && loadPresetFromFile(i.files[0]);
            i.click();
          },
        });
        _button(sPreset, {
          title: "Copy to clipboard",
          onClick: () => {
            const json = JSON.stringify(buildPresetData(), null, 2);
            navigator.clipboard
              .writeText(json)
              .then(() => {
                infoEl.textContent = "Settings copied to clipboard.";
              })
              .catch(() => {
                const ta = document.createElement("textarea");
                ta.value = json;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                ta.remove();
                infoEl.textContent = "Settings copied to clipboard.";
              });
          },
        });

        refreshLodSystem();

        loadLeafTexFromPath(
          PINE_LEAF_TEXTURES[0].path,
          PINE_LEAF_TEXTURES[0].mode,
        );

        addEventListener("resize", () => {
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(innerWidth, innerHeight);
          if (csm?.mainFrustum) csm.updateFrustums();
        });

        let windClock0 = performance.now();

        function tick() {
          requestAnimationFrame(tick);
          if (params.wind.enabled !== false) {
            const tw = (performance.now() - windClock0) * 0.001;
            leafU.time.value = tw;
            leafU2.time.value = tw;
          }
          controls.update();
          if (csm?.mainFrustum) csm.updateFrustums();
          renderer.render(scene, camera);
        }
        tick();
      })();
    </script>
  </body>
</html>
