<!doctype html>
<!-- Runtime preset preview: renders tree-presets through the REAL game path
     (presetLoader → FoliageLodRenderer → procedural trunks). Lineup mode shows
     the whole pine-family library side by side. Safe to delete. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>pine preset lineup</title>
    <style>
      body { margin: 0; background: #223; overflow: hidden; }
      canvas { display: block; }
      #status { position: fixed; top: 4px; left: 8px; color: #fff; font: 13px monospace; white-space: pre; z-index: 2; }
      .lbl { position: fixed; color: #fff; font: bold 13px monospace; text-shadow: 0 1px 3px #000; transform: translateX(-50%); z-index: 2; }
    </style>
  </head>
  <body>
    <div id="status">loading…</div>
    <script type="module">
      import * as THREE from "three";
      import { loadFullPresetFromUrl } from "./core/foliage/presetLoader.js";
      import { FoliageLodRenderer } from "./render/foliage/foliageLodRenderer.js";

      const status = (t) => (document.getElementById("status").textContent = t);
      // Add preset filenames from public/tree-presets/ to preview them side
      // by side through the real runtime path.
      const PRESETS = ["my_pine2.json", "my_pine3.json"];
      const SPACING = 7;

      (async () => {
        try {
          const renderer = new THREE.WebGPURenderer({ antialias: true });
          renderer.setSize(innerWidth, innerHeight);
          renderer.toneMapping = THREE.ACESFilmicToneMapping;
          renderer.toneMappingExposure = 0.9;
          renderer.shadowMap.enabled = true;
          document.body.appendChild(renderer.domElement);
          await renderer.init();

          const scene = new THREE.Scene();
          scene.background = new THREE.Color("#8fb8d8");
          scene.add(new THREE.HemisphereLight("#cfe4ff", "#7a9a55", 1.1));
          const sun = new THREE.DirectionalLight("#fff2dd", 2.6);
          sun.position.set(30, 50, 20);
          sun.castShadow = true;
          sun.shadow.mapSize.set(2048, 2048);
          sun.shadow.camera.left = sun.shadow.camera.bottom = -30;
          sun.shadow.camera.right = sun.shadow.camera.top = 30;
          scene.add(sun);
          const ground = new THREE.Mesh(
            new THREE.CircleGeometry(60, 48),
            new THREE.MeshStandardMaterial({ color: "#4a7c2a", roughness: 0.95 }),
          );
          ground.rotation.x = -Math.PI / 2;
          ground.receiveShadow = true;
          scene.add(ground);

          const fr = new FoliageLodRenderer(scene, { world: { chunkSize: 100, size: 2000 } });
          const stats = [];
          const labels = [];
          const x0 = -((PRESETS.length - 1) * SPACING) / 2;

          for (let i = 0; i < PRESETS.length; i++) {
            const x = x0 + i * SPACING;
            const { foliagePreset, trunkSubmeshes, json } = await loadFullPresetFromUrl(PRESETS[i]);
            fr.setSlotPreset(i, foliagePreset);
            const meshes = fr._buildChunkSlotLod(
              [{ x, y: 0, z: 0, rotY: 0.5 + i, scale: 1, slotIdx: i }], i, 0) ?? [];
            for (const m of meshes) { m.visible = true; m.castShadow = true; scene.add(m); }
            if (trunkSubmeshes) {
              for (const sm of trunkSubmeshes) {
                const mesh = new THREE.Mesh(sm.geometry, sm.material);
                mesh.position.set(x, 0, 0);
                mesh.rotation.y = 0.5 + i;
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
              }
            }
            const cardTris = foliagePreset.lods[0]
              ? foliagePreset.lods[0].geometry.index.count / 3
              : 0;
            const leaves = foliagePreset.lods[0]?.count ?? 0;
            const trunkTris = trunkSubmeshes
              ? trunkSubmeshes[0].geometry.index.count / 3
              : 0;
            stats.push(`${json.presetName}: ${leaves}c ${leaves * cardTris + trunkTris}tri`);
            labels.push({ name: json.presetName, x });
          }

          const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 300);
          camera.position.set(0, 5.2, 36);
          camera.lookAt(0, 3.2, 0);

          // Name labels projected to screen once (static camera).
          for (const l of labels) {
            const p = new THREE.Vector3(l.x, -0.4, 0).project(camera);
            const el = document.createElement("div");
            el.className = "lbl";
            el.textContent = l.name;
            el.style.left = ((p.x * 0.5 + 0.5) * innerWidth) + "px";
            el.style.top = ((-p.y * 0.5 + 0.5) * innerHeight) + "px";
            document.body.appendChild(el);
          }

          window.__result = { ready: true, stats };
          // Console camera hook: __cam(x,y,z, tx,ty,tz) to inspect any tree up close.
          window.__cam = (x, y, z, tx = 0, ty = 2, tz = 0) => {
            camera.position.set(x, y, z);
            camera.lookAt(tx, ty, tz);
          };
          status(stats.join("  ·  "));
          const loop = () => { renderer.render(scene, camera); requestAnimationFrame(loop); };
          loop();
        } catch (e) {
          window.__result = { ready: false, error: String(e && e.stack || e) };
          status("ERROR " + e);
          throw e;
        }
      })();
    </script>
  </body>
</html>
