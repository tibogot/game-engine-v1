<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Procedural Traffic Light — LED matrix — TSL</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #07060a; font-family: "SF Mono", Consolas, ui-monospace, monospace;
      }
      canvas { display: block; width: 100vw; height: 100vh; }
      #hint {
        position: fixed; left: 14px; bottom: 14px; z-index: 5;
        font-size: 11px; line-height: 1.5; color: #888;
        background: rgba(0, 0, 0, 0.55); padding: 8px 12px;
        border-radius: 6px; pointer-events: none;
      }
      #hint b { color: #ff9a2e; }
      #panel {
        position: fixed; top: 12px; right: 12px; z-index: 20;
        width: min(270px, calc(100vw - 24px)); max-height: calc(100vh - 24px);
        overflow: auto; padding: 12px 14px;
        font-size: 11px; line-height: 1.45; color: #d8d8de;
        background: rgba(8, 10, 16, 0.9);
        border: 1px solid rgba(255, 154, 46, 0.18);
        border-radius: 10px; backdrop-filter: blur(8px);
      }
      #panel h2 {
        font-size: 12px; font-weight: 600; color: #ff9a2e;
        margin-bottom: 10px; letter-spacing: 0.05em; text-transform: uppercase;
      }
      #panel section { margin-bottom: 12px; }
      #panel section > label {
        display: block; font-size: 10px; color: #8a8a96;
        text-transform: uppercase; letter-spacing: 0.06em;
        margin-bottom: 6px; padding-bottom: 4px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .row {
        display: grid; grid-template-columns: 1fr 52px;
        align-items: center; gap: 8px; margin-bottom: 6px;
      }
      .row span:first-child { color: #b8b8c2; }
      .row output { text-align: right; color: #ff9a2e; font-variant-numeric: tabular-nums; }
      .row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: #ff9a2e; }
      .row input[type="color"] { width: 100%; height: 22px; padding: 0; border: 1px solid rgba(255,255,255,0.12); border-radius: 4px; background: transparent; cursor: pointer; }
      .btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .lamp-row { display: grid; grid-template-columns: 46px 1fr 1fr; gap: 6px; align-items: center; margin-bottom: 6px; }
      .lamp-row > span { color: #b8b8c2; }
      select, input[type="text"], input[type="file"], button {
        width: 100%; font: inherit; font-size: 11px; color: #e8e8ee;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 5px; padding: 6px 8px;
      }
      select { background-color: #14161c; }
      select option { background-color: #14161c; color: #e8e8ee; }
      input[type="file"] { padding: 4px; font-size: 10px; }
      button { cursor: pointer; color: #ff9a2e; border-color: rgba(255,154,46,0.4); }
      button:hover { background: rgba(255,154,46,0.12); }
      button.mini { padding: 5px 4px; font-size: 10px; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="hint"><b>Traffic light</b> — LED dots clipped to a shape · upload an icon per lamp</div>
    <aside id="panel"></aside>

    <script type="module">
      import * as THREE from "three/webgpu";
      import {
        clamp,
        color,
        float,
        Fn,
        mix,
        pass,
        smoothstep,
        texture,
        uniform,
        uv,
        vec2,
      } from "three/tsl";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { bloom } from "three/addons/tsl/display/BloomNode.js";

      const params = {
        // sequence phase durations (seconds)
        greenDur: 4.0,
        amberDur: 1.2,
        redDur: 4.0,
        redAmberDur: 1.5, // EU "get ready" (set 0 for US-style)
        speed: 1.0,
        bulbFade: 0.12, // incandescent on/off fade time (s); 0 = instant LED snap
        playing: true,
        // LED look
        density: 16, // LED dots across a lamp
        dotRadius: 0.36,
        emissive: 7.0,
        offLevel: 0.035, // faint ember on unlit dots
        // colours
        redColor: "#ff2a1c",
        amberColor: "#ff9a16",
        greenColor: "#36ff5a",
        bloomStrength: 1.5,
        bloomRadius: 0.6,
      };

      const u = {
        density: uniform(float(params.density)),
        dotRadius: uniform(float(params.dotRadius)),
        emissive: uniform(float(params.emissive)),
        offLevel: uniform(float(params.offLevel)),
      };

      const LAMP_SIZE = 1.0;
      const LAMP_GAP = 1.16;

      let camera, scene, renderer, controls, pipeline, bloomPass;
      const lamps = {}; // red / amber / green

      // ── sequence state machine ──
      // each phase lists which lamps are ON and how long it lasts
      const phaseDur = (p) =>
        ({ GREEN: params.greenDur, AMBER: params.amberDur, RED: params.redDur, REDAMBER: params.redAmberDur }[p]);
      const PHASES = [
        { name: "GREEN", on: { green: 1 } },
        { name: "AMBER", on: { amber: 1 } },
        { name: "RED", on: { red: 1 } },
        { name: "REDAMBER", on: { red: 1, amber: 1 } },
      ];
      let phaseIndex = 0;
      let phaseTime = 0;
      let lastT = performance.now();

      init().catch(console.error);

      async function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x07060a);
        scene.fog = new THREE.Fog(0x07060a, 14, 55);

        camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 120);
        camera.position.set(2.6, 2.4, 6.2);

        renderer = new THREE.WebGPURenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        await renderer.init();

        controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 2.3, 0);
        controls.enableDamping = true;
        controls.minDistance = 2.5;
        controls.maxDistance = 16;
        controls.maxPolarAngle = Math.PI * 0.52;
        controls.update();

        buildScene();
        buildPost();
        buildPanel();
        applyPhase(PHASES[phaseIndex]); // start on green

        window.addEventListener("resize", onResize);
        renderer.setAnimationLoop(animate);
      }

      // ── one lamp = an LED matrix clipped to a shape texture ──
      function drawCircle(canvas) {
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(canvas.width / 2, canvas.height / 2, canvas.width * 0.42, 0, Math.PI * 2);
        ctx.fill();
      }

      function createLamp(hex) {
        const canvas = document.createElement("canvas");
        canvas.width = 256;
        canvas.height = 256;
        drawCircle(canvas);

        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.wrapS = THREE.ClampToEdgeWrapping;
        tex.wrapT = THREE.ClampToEdgeWrapping;
        tex.minFilter = THREE.LinearFilter;
        tex.magFilter = THREE.LinearFilter;
        tex.generateMipmaps = false;
        const shapeTex = texture(tex);

        const onU = uniform(float(0)); // animated 0..1
        const colU = uniform(color(hex));

        const mat = new THREE.MeshBasicNodeMaterial();
        mat.colorNode = Fn(() => {
          const grid = uv().mul(u.density);
          const cellCenter = grid.floor().add(0.5);
          const local = grid.sub(cellCenter);
          const dot = smoothstep(u.dotRadius, u.dotRadius.sub(0.06), local.length());

          const cuv = cellCenter.div(u.density); // cell-centre uv
          const s = shapeTex.sample(cuv);
          const shapeMask = s.r.mul(0.299).add(s.g.mul(0.587)).add(s.b.mul(0.114));

          // slight hot centre per dot for a bulb feel
          const tint = mix(float(0.8), float(1.25), dot);
          const intensity = dot
            .mul(shapeMask)
            .mul(clamp(onU.mul(u.emissive).add(u.offLevel), 0.0, u.emissive));
          return colU.mul(intensity).mul(tint);
        })();

        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(LAMP_SIZE, LAMP_SIZE), mat);
        return { canvas, tex, shapeTex, on: onU, color: colU, mesh, target: 0, cur: 0 };
      }

      function setLampShapeFromURL(lamp, url) {
        const img = new Image();
        img.onload = () => {
          const ctx = lamp.canvas.getContext("2d");
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, lamp.canvas.width, lamp.canvas.height);
          // contain-fit the icon centred in the square
          const s = Math.min(lamp.canvas.width / img.width, lamp.canvas.height / img.height);
          const w = img.width * s;
          const h = img.height * s;
          ctx.drawImage(img, (lamp.canvas.width - w) / 2, (lamp.canvas.height - h) / 2, w, h);
          lamp.tex.dispose();
          lamp.tex.needsUpdate = true;
          URL.revokeObjectURL(url);
        };
        img.onerror = () => URL.revokeObjectURL(url);
        img.src = url;
      }

      function resetLampShape(lamp) {
        drawCircle(lamp.canvas);
        lamp.tex.dispose();
        lamp.tex.needsUpdate = true;
      }

      function buildScene() {
        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(60, 60),
          new THREE.MeshStandardNodeMaterial({ color: 0x17120f, roughness: 0.9 }),
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        lamps.red = createLamp(params.redColor);
        lamps.amber = createLamp(params.amberColor);
        lamps.green = createLamp(params.greenColor);

        const baseY = 2.3; // centre of the housing
        lamps.red.mesh.position.set(0, baseY + LAMP_GAP, 0.145);
        lamps.amber.mesh.position.set(0, baseY, 0.145);
        lamps.green.mesh.position.set(0, baseY - LAMP_GAP, 0.145);
        scene.add(lamps.red.mesh, lamps.amber.mesh, lamps.green.mesh);

        const headW = LAMP_SIZE + 0.42;
        const headH = LAMP_GAP * 2 + LAMP_SIZE + 0.42;
        const FACE_Z = 0.13; // front face of the housing

        // visibility backboard (yellow plate behind the head)
        const backboard = new THREE.Mesh(
          new THREE.BoxGeometry(headW + 0.42, headH + 0.42, 0.05),
          new THREE.MeshStandardNodeMaterial({ color: 0xb9a318, roughness: 0.75 }),
        );
        backboard.position.set(0, baseY, -0.17);
        scene.add(backboard);

        // dark housing body
        const housingMat = new THREE.MeshStandardNodeMaterial({
          color: 0x121217,
          roughness: 0.5,
          metalness: 0.45,
        });
        const housing = new THREE.Mesh(
          new THREE.BoxGeometry(headW, headH, 0.26),
          housingMat,
        );
        housing.position.set(0, baseY, 0);
        scene.add(housing);

        // per-lamp: raised bezel ring + curved visor hood
        const bezelMat = new THREE.MeshStandardNodeMaterial({ color: 0x0a0a0d, roughness: 0.45, metalness: 0.55 });
        const visorMat = new THREE.MeshStandardNodeMaterial({ color: 0x070709, roughness: 0.7, metalness: 0.2 });
        const bezelR = LAMP_SIZE * 0.52;
        const hoodR = LAMP_SIZE * 0.6;
        const hoodDepth = 0.34;
        for (const y of [baseY + LAMP_GAP, baseY, baseY - LAMP_GAP]) {
          // protruding rim around the lens (torus faces +Z by default)
          const bezel = new THREE.Mesh(
            new THREE.TorusGeometry(bezelR, 0.055, 14, 40),
            bezelMat,
          );
          bezel.position.set(0, y, FACE_Z + 0.01);
          scene.add(bezel);

          // top-half tube hood: axis points forward, open underside
          const hood = new THREE.Mesh(
            new THREE.CylinderGeometry(hoodR, hoodR, hoodDepth, 28, 1, true, Math.PI, Math.PI),
            visorMat,
          );
          hood.rotation.x = Math.PI / 2; // lay the tube along +Z
          hood.position.set(0, y, FACE_Z + hoodDepth / 2);
          scene.add(hood);
        }

        // pole: base + upright
        const poleMat = new THREE.MeshStandardNodeMaterial({ color: 0x1c1c22, roughness: 0.6, metalness: 0.45 });
        const poleTop = baseY - headH / 2 + 0.05; // meet the housing bottom
        const pole = new THREE.Mesh(
          new THREE.CylinderGeometry(0.13, 0.16, poleTop, 20),
          poleMat,
        );
        pole.position.set(0, poleTop / 2, -0.05);
        scene.add(pole);
        const poleBase = new THREE.Mesh(
          new THREE.CylinderGeometry(0.3, 0.4, 0.16, 24),
          poleMat,
        );
        poleBase.position.set(0, 0.08, -0.05);
        scene.add(poleBase);

        scene.add(new THREE.AmbientLight(0x23252e, 0.7));
        const key = new THREE.DirectionalLight(0xffffff, 0.5);
        key.position.set(3, 6, 5);
        scene.add(key);
        const fill = new THREE.DirectionalLight(0x6a7a9a, 0.25);
        fill.position.set(-4, 2, 3);
        scene.add(fill);
      }

      function buildPost() {
        pipeline = new THREE.RenderPipeline(renderer);
        const scenePass = pass(scene, camera);
        const sceneColor = scenePass.getTextureNode("output");
        bloomPass = bloom(sceneColor, params.bloomStrength, params.bloomRadius, 0.0);
        pipeline.outputNode = sceneColor.add(bloomPass);
      }

      // ── sequence ──
      function applyPhase(phase) {
        lamps.red.target = phase.on.red ? 1 : 0;
        lamps.amber.target = phase.on.amber ? 1 : 0;
        lamps.green.target = phase.on.green ? 1 : 0;
      }

      function nextPhase() {
        // skip phases whose duration is 0
        for (let i = 0; i < PHASES.length; i++) {
          phaseIndex = (phaseIndex + 1) % PHASES.length;
          if (phaseDur(PHASES[phaseIndex].name) > 0) break;
        }
        phaseTime = 0;
        applyPhase(PHASES[phaseIndex]);
        reflectPhase();
      }

      function forceLamp(which) {
        params.playing = false;
        lamps.red.target = which === "red" ? 1 : 0;
        lamps.amber.target = which === "amber" ? 1 : 0;
        lamps.green.target = which === "green" ? 1 : 0;
        document.getElementById("playBtn").textContent = "▶ Resume";
      }

      function animate() {
        const now = performance.now();
        const dt = Math.min(0.05, (now - lastT) / 1000);
        lastT = now;

        if (params.playing) {
          phaseTime += dt * params.speed;
          if (phaseTime >= phaseDur(PHASES[phaseIndex].name)) nextPhase();
        }

        // ease each lamp toward its target (incandescent fade, or instant)
        const k = params.bulbFade <= 0 ? 1 : Math.min(1, dt / params.bulbFade);
        for (const key of ["red", "amber", "green"]) {
          const l = lamps[key];
          l.cur += (l.target - l.cur) * k;
          l.on.value = l.cur;
        }

        controls.update();
        pipeline.render();
      }

      // ── panel ──
      function buildPanel() {
        const panel = document.getElementById("panel");
        panel.innerHTML = `
          <h2>Traffic Light</h2>
          <section>
            <label>Sequence</label>
            <div class="row"><button id="playBtn" class="full">⏸ Pause</button></div>
            <div class="row">
              <span>Speed</span><output id="o-speed">${params.speed.toFixed(2)}</output>
              <input type="range" id="speed" min="0.1" max="5" step="0.1" value="${params.speed}" />
            </div>
            <div class="row">
              <span>Region</span>
              <select id="region" class="full" style="grid-column:1/-1">
                <option value="eu">EU (red+amber step)</option>
                <option value="us">US (no red+amber)</option>
              </select>
            </div>
            <div class="btns" style="margin-top:6px">
              <button class="mini" id="fRed">Red</button>
              <button class="mini" id="fAmber">Amber</button>
              <button class="mini" id="fGreen">Green</button>
            </div>
          </section>
          <section>
            <label>Phase durations (s)</label>
            <div class="row"><span>Green</span><output id="o-greenDur">${params.greenDur.toFixed(1)}</output>
              <input type="range" id="greenDur" min="0" max="10" step="0.1" value="${params.greenDur}" /></div>
            <div class="row"><span>Amber</span><output id="o-amberDur">${params.amberDur.toFixed(1)}</output>
              <input type="range" id="amberDur" min="0" max="6" step="0.1" value="${params.amberDur}" /></div>
            <div class="row"><span>Red</span><output id="o-redDur">${params.redDur.toFixed(1)}</output>
              <input type="range" id="redDur" min="0" max="10" step="0.1" value="${params.redDur}" /></div>
            <div class="row"><span>Red+Amber</span><output id="o-redAmberDur">${params.redAmberDur.toFixed(1)}</output>
              <input type="range" id="redAmberDur" min="0" max="6" step="0.1" value="${params.redAmberDur}" /></div>
            <div class="row"><span>Bulb fade</span><output id="o-bulbFade">${params.bulbFade.toFixed(2)}</output>
              <input type="range" id="bulbFade" min="0" max="0.5" step="0.01" value="${params.bulbFade}" /></div>
          </section>
          <section>
            <label>Lamp shape (default circle)</label>
            <div class="lamp-row"><span>Red</span>
              <input type="file" id="shapeRed" accept="image/*" /><button class="mini" id="resetRed">Circle</button></div>
            <div class="lamp-row"><span>Amber</span>
              <input type="file" id="shapeAmber" accept="image/*" /><button class="mini" id="resetAmber">Circle</button></div>
            <div class="lamp-row"><span>Green</span>
              <input type="file" id="shapeGreen" accept="image/*" /><button class="mini" id="resetGreen">Circle</button></div>
          </section>
          <section>
            <label>LED look</label>
            <div class="row"><span>Density</span><output id="o-density">${params.density}</output>
              <input type="range" id="density" min="6" max="40" step="1" value="${params.density}" /></div>
            <div class="row"><span>Dot size</span><output id="o-dotRadius">${params.dotRadius.toFixed(2)}</output>
              <input type="range" id="dotRadius" min="0.12" max="0.5" step="0.01" value="${params.dotRadius}" /></div>
            <div class="row"><span>Brightness</span><output id="o-emissive">${params.emissive.toFixed(1)}</output>
              <input type="range" id="emissive" min="1" max="14" step="0.1" value="${params.emissive}" /></div>
          </section>
          <section>
            <label>Colours</label>
            <div class="lamp-row"><span>Red</span><input type="color" id="redColor" value="${params.redColor}" /><span></span></div>
            <div class="lamp-row"><span>Amber</span><input type="color" id="amberColor" value="${params.amberColor}" /><span></span></div>
            <div class="lamp-row"><span>Green</span><input type="color" id="greenColor" value="${params.greenColor}" /><span></span></div>
          </section>
          <section>
            <label>Bloom</label>
            <div class="row"><span>Strength</span><output id="o-bloomStrength">${params.bloomStrength.toFixed(2)}</output>
              <input type="range" id="bloomStrength" min="0" max="3" step="0.05" value="${params.bloomStrength}" /></div>
            <div class="row"><span>Radius</span><output id="o-bloomRadius">${params.bloomRadius.toFixed(2)}</output>
              <input type="range" id="bloomRadius" min="0" max="1" step="0.02" value="${params.bloomRadius}" /></div>
          </section>
        `;

        const slider = (id, dec, apply) => {
          const el = document.getElementById(id);
          const out = document.getElementById("o-" + id);
          el.addEventListener("input", () => {
            const v = Number(el.value);
            params[id] = v;
            if (out) out.textContent = v.toFixed(dec);
            apply && apply(v);
          });
        };

        slider("speed", 2);
        slider("greenDur", 1);
        slider("amberDur", 1);
        slider("redDur", 1);
        slider("redAmberDur", 1);
        slider("bulbFade", 2);
        slider("density", 0, (v) => (u.density.value = v));
        slider("dotRadius", 2, (v) => (u.dotRadius.value = v));
        slider("emissive", 1, (v) => (u.emissive.value = v));
        slider("bloomStrength", 2, (v) => (bloomPass.strength.value = v));
        slider("bloomRadius", 2, (v) => (bloomPass.radius.value = v));

        const playBtn = document.getElementById("playBtn");
        playBtn.addEventListener("click", () => {
          params.playing = !params.playing;
          playBtn.textContent = params.playing ? "⏸ Pause" : "▶ Resume";
        });

        document.getElementById("region").addEventListener("change", (e) => {
          if (e.target.value === "us") {
            params.redAmberDur = 0;
            params.amberDur = 1.2;
          } else {
            params.redAmberDur = 1.5;
          }
          syncSlider("redAmberDur", 1);
          syncSlider("amberDur", 1);
        });
        const syncSlider = (id, dec) => {
          const el = document.getElementById(id);
          const out = document.getElementById("o-" + id);
          if (el) el.value = params[id];
          if (out) out.textContent = params[id].toFixed(dec);
        };

        document.getElementById("fRed").addEventListener("click", () => forceLamp("red"));
        document.getElementById("fAmber").addEventListener("click", () => forceLamp("amber"));
        document.getElementById("fGreen").addEventListener("click", () => forceLamp("green"));

        for (const key of ["red", "amber", "green"]) {
          const cap = key[0].toUpperCase() + key.slice(1);
          document.getElementById("shape" + cap).addEventListener("change", (e) => {
            const file = e.target.files?.[0];
            if (file) setLampShapeFromURL(lamps[key], URL.createObjectURL(file));
          });
          document.getElementById("reset" + cap).addEventListener("click", () => resetLampShape(lamps[key]));
          document.getElementById(key + "Color").addEventListener("input", (e) => {
            lamps[key].color.value.set(e.target.value);
          });
        }
      }

      function reflectPhase() {
        const el = document.getElementById("playBtn");
        if (el && params.playing) el.textContent = "⏸ Pause";
      }

      function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    </script>
  </body>
</html>
