<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bubble</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #04050a; }
      canvas { display: block; width: 100vw; height: 100vh; }
      canvas.hover { cursor: pointer; }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 30px;
        transform: translateX(-50%);
        z-index: 10;
        pointer-events: none;
        user-select: none;
        font: 500 12px/1.4 "Segoe UI", system-ui, sans-serif;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(226, 236, 255, 0.55);
        transition: opacity 0.8s ease;
      }
      #hint.fade { opacity: 0; }
      #veil {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: #04050a;
        display: grid;
        place-items: center;
        color: rgba(210, 224, 255, 0.6);
        font: 500 12px/1 "Segoe UI", system-ui, sans-serif;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        transition: opacity 1s ease, visibility 1s;
      }
      #veil.done { opacity: 0; visibility: hidden; }
    </style>
  </head>
  <body>
    <div id="veil">loading</div>
    <div id="hint">click the bubble</div>
    <script type="module">
      // Vite aliases `three` → `three/webgpu` (see vite.config.js)
      import * as THREE from "three";
      import {
        Fn, float, vec2, vec3, color, uniform, time,
        positionGeometry, normalize, cross, dot, abs, pow, mix,
        smoothstep, acos, clamp, sin, select, screenUV,
        transformNormalToView,
      } from "three/tsl";
      import { HDRLoader } from "three/addons/loaders/HDRLoader.js";

      const RADIUS = 1.2;
      const HEADLINE = "BUBBLE";
      const HDR_URLS = [
        "https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_09_1k.hdr",
        "https://threejs.org/examples/textures/equirectangular/royal_esplanade_1k.hdr",
      ];

      // ---------------------------------------------------------------- setup
      const renderer = new THREE.WebGPURenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();

      // Deep radial-gradient backdrop; the HDR is used for lighting only
      scene.backgroundNode = mix(
        color(0x131a2c),
        color(0x03040a),
        clamp(screenUV.distance(vec2(0.5, 0.45)).mul(1.7), 0, 1)
      );

      const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 60);
      const CAM_BASE = new THREE.Vector3(0, 0.1, 5.4);
      camera.position.copy(CAM_BASE);

      const key = new THREE.DirectionalLight(0xfff1dd, 1.0);
      key.position.set(4, 6, 3);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0x9db8ff, 0.45);
      rim.position.set(-5, 2, -4);
      scene.add(rim);

      // ------------------------------------------------------------- headline
      // Drawn opaque (alphaTest, not `transparent`) so the transmission pass
      // sees it in its backdrop and the glass refracts it.
      function makeHeadlineTexture(text) {
        const c = document.createElement("canvas");
        c.width = 2048;
        c.height = 1024;
        const ctx = c.getContext("2d");
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#eef3ff";
        let px = 420;
        do {
          ctx.font = `400 ${px}px "Archivo Black", "Arial Black", system-ui, sans-serif`;
          px -= 10;
        } while (ctx.measureText(text).width > c.width * 0.94 && px > 60);
        ctx.fillText(text, c.width / 2, c.height / 2);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = 8;
        return tex;
      }

      const headline = new THREE.Mesh(
        new THREE.PlaneGeometry(7.2, 3.6),
        new THREE.MeshBasicMaterial({ alphaTest: 0.4, fog: false })
      );
      headline.position.set(0, 0, -2.6);
      scene.add(headline);

      // --------------------------------------------------------------- bubble
      // The shape is a superellipsoid evaluated in the vertex stage:
      //   radius(dir) = R / ||dir||_p   with p: 2 (sphere) → 14 (rounded cube).
      // The morph spreads as a wavefront from the clicked point, and normals
      // come from finite differences so shading stays exact mid-morph.
      const uProgress = uniform(0);
      const uClickDir = uniform(new THREE.Vector3(0, 0, 1));

      const WAVE_W = 1.5; // wavefront width, radians

      const morphAmount = Fn(([dir]) => {
        const ang = acos(clamp(dot(dir, uClickDir), -1, 1));
        const front = uProgress.mul(Math.PI + WAVE_W);
        return smoothstep(0.0, WAVE_W, front.sub(ang));
      });

      const shapePoint = Fn(([dir]) => {
        const m = morphAmount(dir);
        const pExp = mix(2.0, 14.0, m);
        const a = abs(dir).max(1e-4);
        const pNorm = pow(
          dot(pow(a, vec3(pExp)), vec3(1.0)),
          float(1.0).div(pExp)
        );
        // Gentle soap wobble, stiffening as it crystallises into the cube
        const wob = sin(dir.x.mul(4.0).add(time.mul(1.4)))
          .mul(sin(dir.y.mul(5.0).add(time.mul(1.8))))
          .mul(sin(dir.z.mul(4.0).add(time.mul(1.1))))
          .mul(0.045)
          .mul(m.mul(-0.75).add(1.0));
        return dir.mul(float(RADIUS).div(pNorm).add(wob));
      });

      const dir = normalize(positionGeometry).toVar();
      const up = select(abs(dir.y).lessThan(0.98), vec3(0, 1, 0), vec3(1, 0, 0));
      const t1 = normalize(cross(up, dir));
      const t2 = normalize(cross(dir, t1));
      const EPS = 0.012;
      const p0 = shapePoint(dir);
      const p1 = shapePoint(normalize(dir.add(t1.mul(EPS))));
      const p2 = shapePoint(normalize(dir.add(t2.mul(EPS))));

      const bubbleMaterial = new THREE.MeshPhysicalNodeMaterial({
        roughness: 0.03,
        metalness: 0,
        transmission: 1,
        thickness: 1.1,
        ior: 1.34,
        dispersion: 4.0, // chromatic aberration on everything seen through the glass
        iridescence: 1,
        iridescenceIOR: 1.32,
        iridescenceThicknessRange: [140, 500],
        clearcoat: 1,
        clearcoatRoughness: 0.04,
        specularIntensity: 1,
        attenuationColor: new THREE.Color(0xe4f2ff),
        attenuationDistance: 3,
        envMapIntensity: 1.25,
      });
      bubbleMaterial.positionNode = p0;
      bubbleMaterial.normalNode = transformNormalToView(
        normalize(cross(p1.sub(p0), p2.sub(p0)))
      );

      const bubble = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 6), bubbleMaterial);
      scene.add(bubble);

      // ------------------------------------------------------------- morphing
      // A damped spring drives uProgress: clicks are interruptible and settle
      // with a soft overshoot instead of a canned tween.
      let morphTarget = 0;
      let morphValue = 0;
      let morphVel = 0;
      const STIFFNESS = 42;
      const DAMPING = 8.5;

      const raycaster = new THREE.Raycaster();
      const ndc = new THREE.Vector2();
      const proxy = new THREE.Sphere(new THREE.Vector3(), RADIUS * 1.1);
      const hitPoint = new THREE.Vector3();
      const invMatrix = new THREE.Matrix4();
      let hintHidden = false;

      function castToBubble(e) {
        ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
        raycaster.setFromCamera(ndc, camera);
        proxy.center.copy(bubble.position);
        return raycaster.ray.intersectSphere(proxy, hitPoint);
      }

      renderer.domElement.addEventListener("pointerdown", (e) => {
        if (!castToBubble(e)) return;
        // Wave origin = clicked point, in the bubble's local space
        invMatrix.copy(bubble.matrixWorld).invert();
        uClickDir.value.copy(hitPoint).applyMatrix4(invMatrix).normalize();
        morphTarget = morphTarget < 0.5 ? 1 : 0;
        if (!hintHidden) {
          hintHidden = true;
          document.getElementById("hint").classList.add("fade");
        }
      });

      // ------------------------------------------------------ pointer parallax
      const parallax = new THREE.Vector2();
      addEventListener("pointermove", (e) => {
        parallax.set(e.clientX / innerWidth - 0.5, e.clientY / innerHeight - 0.5);
        renderer.domElement.classList.toggle("hover", !!castToBubble(e));
      });

      // ----------------------------------------------------------------- loop
      let last = 0;
      function animate(now) {
        const dt = Math.min((now - last) / 1000 || 0.016, 0.05);
        last = now;

        // Spring integration (semi-implicit Euler)
        morphVel += (STIFFNESS * (morphTarget - morphValue) - DAMPING * morphVel) * dt;
        morphValue += morphVel * dt;
        uProgress.value = morphValue;

        const t = now / 1000;
        bubble.position.y = Math.sin(t * 0.6) * 0.07;
        bubble.rotation.y = t * 0.1;
        bubble.rotation.x = Math.sin(t * 0.3) * 0.06;

        // Slow soap-film colour drift
        const film = 140 + (Math.sin(t * 0.35) * 0.5 + 0.5) * 360;
        bubbleMaterial.iridescenceThicknessRange = [film * 0.5, film + 140];

        camera.position.x += (CAM_BASE.x + parallax.x * 0.55 - camera.position.x) * 0.045;
        camera.position.y += (CAM_BASE.y - parallax.y * 0.35 - camera.position.y) * 0.045;
        camera.lookAt(0, 0, 0);

        renderer.render(scene, camera);
      }

      // ----------------------------------------------------------------- boot
      async function loadHdr() {
        const loader = new HDRLoader();
        for (const url of HDR_URLS) {
          try {
            const hdr = await loader.loadAsync(url);
            hdr.mapping = THREE.EquirectangularReflectionMapping;
            return hdr;
          } catch (err) {
            console.warn("HDR failed:", url, err);
          }
        }
        return null; // directional lights still carry the scene offline
      }

      async function boot() {
        await renderer.init();

        const [hdr] = await Promise.all([
          loadHdr(),
          Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 2500))]),
        ]);
        if (hdr) {
          scene.environment = hdr;
          scene.environmentIntensity = 1.2;
        }
        headline.material.map = makeHeadlineTexture(HEADLINE);
        headline.material.needsUpdate = true;

        document.getElementById("veil").classList.add("done");
        renderer.setAnimationLoop(animate);
      }

      addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      boot().catch((err) => {
        console.error(err);
        document.getElementById("veil").textContent = "needs a WebGPU browser";
      });
    </script>
  </body>
</html>
