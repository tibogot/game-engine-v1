<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>V3 GPU Terrain</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #000; overflow: hidden; }
      canvas { display: block; }

      /* ── Side panel ──────────────────────────────────────────────────────── */
      #panel {
        position: fixed;
        top: 50%;
        left: 10px;
        transform: translateY(-50%);
        background: rgba(8, 10, 18, 0.82);
        border: 1px solid rgba(255,255,255,0.10);
        border-radius: 10px;
        padding: 14px 12px;
        width: 168px;
        color: #ddd;
        font: 12px/1.5 monospace;
        pointer-events: auto;
        user-select: none;
        backdrop-filter: blur(6px);
        z-index: 10;
      }
      .p-title {
        font-size: 10px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #6a9fff;
        margin-bottom: 14px;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      .p-label {
        font-size: 10px;
        color: #777;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        margin: 12px 0 5px;
      }
      .p-label:first-of-type { margin-top: 0; }

      /* Mode buttons */
      .btn-col { display: flex; flex-direction: column; gap: 5px; }
      .mode-btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 5px;
        color: #bbb;
        padding: 7px 10px;
        cursor: pointer;
        font: 12px monospace;
        text-align: left;
        transition: background 0.1s, border-color 0.1s, color 0.1s;
      }
      .mode-btn:hover  { background: rgba(255,255,255,0.12); color: #fff; }
      .mode-btn.active {
        background: rgba(80, 140, 255, 0.22);
        border-color: rgba(100,160,255,0.55);
        color: #9dc4ff;
      }

      /* Sliders */
      .sl-row { display: flex; align-items: center; gap: 7px; }
      .sl-row input[type=range] {
        flex: 1;
        accent-color: #5a9fff;
        cursor: pointer;
      }
      .sl-val { font-size: 11px; color: #999; width: 28px; text-align: right; }

      /* Divider + help */
      .p-div { border-top: 1px solid rgba(255,255,255,0.07); margin: 14px 0 10px; }
      .p-help { font-size: 10px; color: #555; line-height: 2.0; }
      .p-help b { color: #888; font-weight: normal; }
    </style>
  </head>
  <body>
    <div id="panel">
      <div class="p-title">V3 Terrain</div>

      <div class="p-label">Tool</div>
      <div class="btn-col">
        <button id="btn-raise"  class="mode-btn active">▲ Raise</button>
        <button id="btn-lower"  class="mode-btn">▼ Lower</button>
        <button id="btn-smooth" class="mode-btn">〜 Smooth</button>
      </div>

      <div class="p-label">Brush size</div>
      <div class="sl-row">
        <input type="range" id="sl-size" min="1" max="40" step="1" value="5">
        <span class="sl-val" id="lbl-size">5%</span>
      </div>

      <div class="p-label">Strength</div>
      <div class="sl-row">
        <input type="range" id="sl-str" min="1" max="50" step="1" value="4">
        <span class="sl-val" id="lbl-str">4</span>
      </div>

      <div class="p-div"></div>
      <div class="p-help">
        <b>LMB</b> sculpt<br>
        <b>MMB</b> orbit<br>
        <b>RMB</b> pan<br>
        <b>Scroll</b> zoom<br>
        <b>Shift+Scroll</b> size<br>
        <b>Alt+Scroll</b> strength
      </div>
    </div>

    <script type="module" src="./app/main.js"></script>
  </body>
</html>
