<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Fog lab: the volumetric fog (fog-lab/volumetricFog.js) on an editor level under Sky Pro.
        ?world=/levels/<name>.v3proj   the level (default steppe)
        ?trees=0                       do not plant tree groves
    -->
    <base href="/v3/" />
    <title>Fog lab</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #game { position: fixed; inset: 0; }
      #boot {
        position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
        background: #0a0a0a; color: #cfcfcf; font: 14px system-ui, sans-serif; transition: opacity 0.4s;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #panel {
        position: fixed; right: 10px; top: 10px; bottom: 10px; z-index: 50; width: 300px; overflow-y: auto;
        padding: 10px 12px; border-radius: 8px; background: rgba(12, 14, 18, 0.82); color: #ddd;
        font: 12px system-ui, sans-serif; box-sizing: border-box;
      }
      #panel .title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
      #panel .note { color: #9aa; margin: 4px 0 6px; line-height: 1.4; }
      #panel .section { margin: 12px 0 4px; color: #8cf; font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.08em; }
      #panel .row { display: grid; grid-template-columns: 104px 1fr 58px; align-items: center; gap: 6px; margin: 3px 0; }
      #panel .row.check { display: flex; gap: 6px; }
      #panel .row input[type="range"] { width: 100%; }
      #panel .val { text-align: right; font-variant-numeric: tabular-nums; color: #bbb; }
      #panel .buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
      #panel button {
        background: #2a3240; color: #ddd; border: 1px solid #3c4658; border-radius: 4px; padding: 4px 8px; font: inherit; cursor: pointer;
      }
      #panel button:disabled { opacity: 0.5; }
    </style>
    <link rel="icon" href="/favicon.svg" />
  </head>
  <body>
    <div id="game"></div>
    <div id="panel"></div>
    <div id="boot">Loading…</div>

    <script type="module">
      const boot = document.getElementById("boot");
      try {
        const { startFogLab } = await import("/v3/fog-lab/lab.js");
        window.__fogLab = await startFogLab({
          container: document.getElementById("game"),
          onStatus: (s) => (boot.textContent = s),
        });
        boot.classList.add("hidden");
        setTimeout(() => boot.remove(), 500);
      } catch (e) {
        console.error("[fog-lab] failed to start", e);
        boot.textContent = `Failed to start: ${e?.message ?? e}`;
      }
    </script>
  </body>
</html>
